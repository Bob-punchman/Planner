// ================= 24-UURS TIJDVELDEN =================
// <input type="time"> volgt de taal van het apparaat (soms AM/PM). Daarom maken we er tekstvelden van
// die altijd 24 uur gebruiken: typ 2340, 23:40 of 9 (= 09:00).
function normTijd(v){
  const s = String(v || '').trim(); if (!s) return '';
  let h, m;
  const d = s.match(/^(\d{1,2})[:.,h ]?(\d{2})?$/);
  if (d) { h = +d[1]; m = d[2] ? +d[2] : 0; }
  else if (/^\d{3}$/.test(s)) { h = +s[0]; m = +s.slice(1); }
  else return null;
  if (s.length === 3 && /^\d{3}$/.test(s)) { h = +s[0]; m = +s.slice(1); }
  if (h > 23 || m > 59) return null;
  return pad(h) + ':' + pad(m);
}
function maakTijdveld(el){
  el.type = 'text'; el.classList.add('tijd');
  el.setAttribute('inputmode', 'numeric'); el.setAttribute('maxlength', '5'); el.setAttribute('placeholder', '––:––');
  // telefoon/tablet: geen toetsenbord maar een kiezer (uur, dan minuten); op de pc kun je gewoon typen
  if (window.matchMedia && matchMedia('(pointer: coarse)').matches && !matchMedia('(any-pointer: fine)').matches) {
    el.readOnly = true;
    el.addEventListener('click', () => tijdKiezer(el));
  }
  el.setAttribute('autocomplete', 'off');
  el.addEventListener('input', () => {
    el.classList.remove('fout');
    if (/^\d{4}$/.test(el.value)) { el.value = el.value.slice(0,2) + ':' + el.value.slice(2); el.dispatchEvent(new Event('input')); }  // 2340 → 23:40
  });
  el.addEventListener('blur', () => {
    const n = normTijd(el.value);
    if (n === null) { el.classList.add('fout'); toast('Ongeldige tijd: gebruik uu:mm, bijv. 23:40'); el.value = ''; }
    else if (n !== el.value) { el.value = n; el.dispatchEvent(new Event('input')); }
  });
}
/** Kiezer: eerst het uur, dan de minuten (per 5). Ligt boven een eventueel open venster. */
function tijdKiezer(el){
  const oud = normTijd(el.value) || '';
  let uur = oud ? +oud.slice(0,2) : null, min = oud ? +oud.slice(3) : null, stap = 'uur', precies = min !== null && min % 5 !== 0;
  const bg = document.createElement('div'); bg.className = 'kiezer-bg';
  const teken = () => {
    const mm = min === null ? null : Math.round(min/5)*5 % 60;
    bg.innerHTML = `<div class="kiezer" role="dialog" aria-label="Tijd kiezen">
      <div class="kop"><div class="groot"><span class="${stap==='uur'?'actief':''} ${uur===null?'leeg':''}" data-stap="uur">${uur===null?'--':pad(uur)}</span>:<span class="${stap==='min'?'actief':''} ${min===null?'leeg':''}" data-stap="min">${min===null?'--':pad(min)}</span></div>
        <button class="btn ghost small" data-k="wis">Wissen</button></div>
      <div class="row"><div class="lbl grow">${stap==='uur' ? 'Kies het uur' : 'Kies de minuten'}</div>
        ${stap==='min' ? `<button class="btn ghost small" data-k="precies">${precies ? 'Per 5 minuten' : 'Op de minuut'}</button>` : ''}</div>
      ${stap==='uur'
        ? `<div class="rooster u">${[...Array(24)].map((_,i)=>`<button data-u="${i}" class="${i===uur?'on':''}">${pad(i)}</button>`).join('')}</div>`
        : precies
          ? `<div class="rooster m60">${[...Array(60)].map((_,i)=>`<button data-m="${i}" class="${i===min?'on':''}">${pad(i)}</button>`).join('')}</div>`
          : `<div class="rooster m">${[...Array(12)].map((_,i)=>`<button data-m="${i*5}" class="${i*5===mm?'on':''}">:${pad(i*5)}</button>`).join('')}</div>`}
      <div class="row"><button class="btn ghost" data-k="annuleer">Annuleren</button><button class="btn" data-k="ok" ${uur===null?'disabled':''}>Klaar</button></div></div>`;
  };
  const sluit = () => bg.remove();
  const kies = () => { el.value = pad(uur) + ':' + pad(min === null ? 0 : min); el.classList.remove('fout');
    el.dispatchEvent(new Event('input')); el.dispatchEvent(new Event('change')); sluit(); };
  bg.addEventListener('click', e => {
    const t = e.target.closest('button,[data-stap]');
    if (e.target === bg) return sluit();
    if (!t) return;
    if (t.dataset.stap) { stap = t.dataset.stap === 'min' && uur !== null ? 'min' : 'uur'; return teken(); }
    if (t.dataset.u !== undefined) { uur = +t.dataset.u; stap = 'min'; return teken(); }
    if (t.dataset.m !== undefined) { min = +t.dataset.m; return kies(); }          // na de minuten meteen klaar
    if (t.dataset.k === 'wis') { el.value = ''; el.dispatchEvent(new Event('input')); el.dispatchEvent(new Event('change')); return sluit(); }
    if (t.dataset.k === 'annuleer') return sluit();
    if (t.dataset.k === 'precies') { precies = !precies; return teken(); }
    if (t.dataset.k === 'ok' && uur !== null) return kies();
  });
  teken(); document.body.appendChild(bg);
}

// Datums: altijd dd-mm-jjjj op het scherm. Het originele veld wordt verborgen en houdt de waarde als jjjj-mm-dd,
// zodat de rest van de code gewoon .value kan blijven lezen.
const isoNaarNL = s => /^\d{4}-\d{2}-\d{2}$/.test(s||'') ? s.slice(8,10) + '-' + s.slice(5,7) + '-' + s.slice(0,4) : '';
function nlNaarIso(v){
  const s = String(v || '').trim(); if (!s) return '';
  let d, m, y;
  const a = s.match(/^(\d{1,2})[-/. ](\d{1,2})(?:[-/. ](\d{2}|\d{4}))?$/), b = s.match(/^(\d{2})(\d{2})(\d{4})$/);
  if (a) { d = +a[1]; m = +a[2]; y = a[3] ? +a[3] : new Date().getFullYear(); if (y < 100) y += 2000; }
  else if (b) { d = +b[1]; m = +b[2]; y = +b[3]; }
  else return null;
  const t = new Date(y, m-1, d);
  if (t.getFullYear() !== y || t.getMonth() !== m-1 || t.getDate() !== d) return null;   // bijv. 31-02 bestaat niet
  return y + '-' + pad(m) + '-' + pad(d);
}
function maakDatumveld(el){
  const wrap = document.createElement('div'); wrap.className = 'datumveld';
  if (el.getAttribute('style')) wrap.setAttribute('style', el.getAttribute('style'));
  const tekst = document.createElement('input');
  tekst.className = 'datum'; tekst.setAttribute('inputmode', 'numeric'); tekst.setAttribute('placeholder', 'dd-mm-jjjj');
  tekst.setAttribute('maxlength', '10'); tekst.setAttribute('autocomplete', 'off'); tekst.value = isoNaarNL(el.value);
  const knop = document.createElement('button'); knop.type = 'button'; knop.className = 'kal'; knop.innerHTML = '<svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><rect x="3" y="5" width="18" height="16" rx="3"/><path d="M3 10h18M8 3v4M16 3v4"/></svg>'; knop.setAttribute('aria-label', 'kalender');
  const nat = document.createElement('input'); nat.type = 'date'; nat.className = 'native'; nat.dataset.native = '1'; nat.tabIndex = -1; nat.value = el.value;
  el.parentNode.insertBefore(wrap, el); wrap.append(tekst, knop, nat, el);
  el.type = 'hidden';
  const zet = iso => { if (iso === el.value) return; el.value = iso; nat.value = iso;
    el.dispatchEvent(new Event('input')); el.dispatchEvent(new Event('change')); };
  tekst.addEventListener('input', () => {

// Kleuren: gevalideerd categorisch palet, per thema eigen stappen (licht/donker).
const PAL = { licht:['#2a78d6','#eb6834','#1baf7a','#eda100','#e87ba4','#008300','#6250d6','#e34948'],
              donker:['#3987e5','#d95926','#199e70','#c98500','#d55181','#0ca30c','#9085e9','#e66767'] };
const ZACHT = { licht:'#86b6ef', donker:'#184f95' };   // lichtere stap van dezelfde blauwe tint (gepland)
const donker = () => document.documentElement.dataset.thema === 'donker';
const kleur = n => PAL[donker() ? 'donker' : 'licht'][n];
const GRAF = {};
function mooiMax(v){ const p = Math.pow(10, Math.floor(Math.log10(v))); for (const f of [1,2,2.5,4,5,10]) if (f*p >= v) return f*p; return 10*p; }
function rond(x, y, w, h, r){ r = Math.min(r, h, w/2); if (h <= 0) return '';
  return `M${x},${y+h}V${y+r}Q${x},${y} ${x+r},${y}H${x+w-r}Q${x+w},${y} ${x+w},${y+r}V${y+h}Z`; }
function legenda(items){ return items.length < 2 && !items.some(x => x.soort) ? '' : `<div class="legenda">${items.map(x =>
  `<span><i class="${x.soort||''}" style="${x.kleur?'background:'+x.kleur:''}"></i>${esc(x.naam)}</span>`).join('')}</div>`; }
function tabel(kop, rijen){ return `<details><summary>Als tabel</summary><div class="tabelwrap"><table><tr>${kop.map(k=>`<th>${esc(k)}</th>`).join('')}</tr>
  ${rijen.map(r => `<tr>${r.map(c=>`<td>${c}</td>`).join('')}</tr>`).join('')}</table></div></details>`; }

/** Staafgrafiek (optioneel gestapeld), met streepjes (bijv. doel per week) en referentielijnen. */
function staven(id, o){
  const W = 340, H = 170, L = 28, R = 6, T = 14, B = 22, pw = W-L-R, ph = H-T-B, n = o.labels.length;
  const tot = o.labels.map((_,i) => o.series.reduce((t,s) => t + (s.waarden[i]||0), 0));
  const max = mooiMax(Math.max(1, ...tot, ...(o.refs||[]).map(r=>r.waarde), ...(o.streep ? o.streep.waarden.filter(v=>v!=null) : [])) * 1.05);
  const y = v => T + ph - v/max*ph, slot = pw/n, bw = Math.min(26, slot*0.6);
  let svg = [0, max/2, max].map(v => `<line class="grid" x1="${L}" x2="${W-R}" y1="${y(v)}" y2="${y(v)}"/><text class="ax" x="${L-5}" y="${y(v)+4}" text-anchor="end">${u(v)}</text>`).join('');
  o.labels.forEach((lab, i) => {
    const x = L + i*slot + (slot-bw)/2; let acc = 0;
    const seg = o.series.map(s => ({ s, v: s.waarden[i]||0 })).filter(z => z.v > 0);
    seg.forEach((z, k) => {
      const yb = y(acc) - (acc > 0 ? 2 : 0), yt = y(acc + z.v), h = yb - yt;       // 2px ruimte tussen segmenten
      svg += k === seg.length-1 ? `<path d="${rond(x, yt, bw, h, 4)}" fill="${z.s.kleur}"/>` : `<rect x="${x}" y="${yt}" width="${bw}" height="${Math.max(0,h)}" fill="${z.s.kleur}"/>`;
      acc += z.v;
    });
    if (o.streep && o.streep.waarden[i] != null) svg += `<line class="tick" x1="${x-3}" x2="${x+bw+3}" y1="${y(o.streep.waarden[i])}" y2="${y(o.streep.waarden[i])}"/>`;
    if (n <= 12 || i % 2 === 0) svg += `<text class="ax" x="${x+bw/2}" y="${H-6}" text-anchor="middle">${esc(lab)}</text>`;
    svg += `<rect data-i="${i}" x="${L+i*slot}" y="${T}" width="${slot}" height="${ph}" fill="transparent"/>`;
  });
  // referentielijnen; het label staat in de legenda, alleen 'inline' labels links in de grafiek
  (o.refs||[]).forEach(r => svg += `<line class="ref" x1="${L}" x2="${W-R}" y1="${y(r.waarde)}" y2="${y(r.waarde)}"/>`
    + (r.inline ? `<text class="ax" x="${L+4}" y="${y(r.waarde)-4}">${esc(r.label)}</text>` : ''));
  GRAF[id] = { n, tip: i => `<b>${esc(o.labels[i])}</b>` + o.series.map(s => `<br>${esc(s.naam)}: ${u(s.waarden[i]||0)} ${o.eenheid||''}`).join('')
    + (o.streep && o.streep.waarden[i] != null ? `<br>${esc(o.streep.naam)}: ${u(o.streep.waarden[i])} ${o.eenheid||''}` : ''), x: i => (L + (i+0.5)*slot)/W, y: i => y(tot[i])/H };
  const leg = o.series.map(s => ({naam:s.naam, kleur:s.kleur})).concat(o.streep ? [{naam:o.streep.naam, soort:'lijn'}] : [])
    .concat((o.refs||[]).length ? [{naam: o.refs.every(r=>r.inline) ? 'bonusgrenzen' : o.refs.map(r=>r.label).join(' / '), soort:'stip'}] : []);
  return `<div class="card grafiek" data-g="${id}"><div class="gt">${esc(o.titel)}</div>${o.sub?`<div class="gs">${esc(o.sub)}</div>`:''}
    ${legenda(leg)}<svg viewBox="0 0 ${W} ${H}" role="img" aria-label="${esc(o.titel)}">${svg}</svg><div class="tip"></div>
    ${tabel(['', ...o.series.map(s=>s.naam), ...(o.streep?[o.streep.naam]:[])],
      o.labels.map((l,i) => [esc(l), ...o.series.map(s => u(s.waarden[i]||0)), ...(o.streep ? [o.streep.waarden[i]==null?'–':u(o.streep.waarden[i])] : [])]))}</div>`;
}

/** Lijngrafiek met gaten waar niets is ingevuld. */
function lijn(id, o){
  const W = 340, H = 160, L = 28, R = 6, T = 14, B = 22, pw = W-L-R, ph = H-T-B, n = o.labels.length;
  const vals = o.waarden.filter(v => v != null);
  const lo = Math.max(0, Math.floor(Math.min(...vals, ...(o.refs||[]).map(r=>r.waarde)) - 1)), hi = Math.ceil(Math.max(...vals, ...(o.refs||[]).map(r=>r.waarde)) + 0.5);
  const y = v => T + ph - (v-lo)/(hi-lo)*ph, x = i => L + (n === 1 ? pw/2 : i*pw/(n-1));
  let svg = [lo, (lo+hi)/2, hi].map(v => `<line class="grid" x1="${L}" x2="${W-R}" y1="${y(v)}" y2="${y(v)}"/><text class="ax" x="${L-5}" y="${y(v)+4}" text-anchor="end">${o.fmt ? o.fmt(v) : u(Math.round(v*10)/10)}</text>`).join('');
  (o.refs||[]).forEach(r => svg += `<line class="ref" x1="${L}" x2="${W-R}" y1="${y(r.waarde)}" y2="${y(r.waarde)}"/>`);
  let pad = '', vorige = false;
  o.waarden.forEach((v, i) => { if (v == null) { vorige = false; return; } pad += (vorige ? 'L' : 'M') + x(i) + ',' + y(v); vorige = true; });
  svg += `<path d="${pad}" fill="none" stroke="${o.kleur}" stroke-width="2" stroke-linejoin="round"/>`;
  o.waarden.forEach((v, i) => { if (v != null) svg += `<circle cx="${x(i)}" cy="${y(v)}" r="4" fill="${o.kleur}" stroke="var(--card)" stroke-width="2"/>`; });
  o.labels.forEach((lab, i) => { if (i % 2 === 0 || i === n-1) svg += `<text class="ax" x="${x(i)}" y="${H-6}" text-anchor="middle">${esc(lab)}</text>`;
    svg += `<rect data-i="${i}" x="${x(i) - pw/(2*Math.max(1,n-1))}" y="${T}" width="${pw/Math.max(1,n-1)}" height="${ph}" fill="transparent"/>`; });
  const toon = v => o.tipFmt ? o.tipFmt(v) : o.fmt ? o.fmt(v) : u(v) + ' ' + (o.eenheid||'');
  GRAF[id] = { n, tip: i => `<b>${esc(o.labels[i])}</b><br>${o.waarden[i]==null ? 'niet ingevuld' : toon(o.waarden[i])}`,
               x: i => x(i)/W, y: i => (o.waarden[i]==null ? T+ph/2 : y(o.waarden[i]))/H };
  return `<div class="card grafiek" data-g="${id}"><div class="gt">${esc(o.titel)}</div>${o.sub?`<div class="gs">${esc(o.sub)}</div>`:''}
    ${(o.refs||[]).length ? legenda([{naam:o.reeks||'per nacht', kleur:o.kleur}, {naam:o.refs.map(r=>r.label).join(' / '), soort:'stip'}]) : ''}
    <svg viewBox="0 0 ${W} ${H}" role="img" aria-label="${esc(o.titel)}">${svg}</svg><div class="tip"></div>
    ${tabel(['', o.eenheid || ''], o.labels.map((l,i) => [esc(l), o.waarden[i]==null?'–':(o.tipFmt ? o.tipFmt(o.waarden[i]) : o.fmt ? o.fmt(o.waarden[i]) : u(o.waarden[i]))]))}</div>`;
}
/** Tik of beweeg over een staaf/punt: waarde tonen. */
function grafiekTips(){
  document.querySelectorAll('.grafiek').forEach(g => {
    const info = GRAF[g.dataset.g], tip = g.querySelector('.tip'), svg = g.querySelector('svg');
    const toon = i => { const r = svg.getBoundingClientRect(), gr = g.getBoundingClientRect();
      tip.innerHTML = info.tip(i); tip.style.display = 'block';
      tip.style.left = (r.left - gr.left + info.x(i)*r.width) + 'px'; tip.style.top = (r.top - gr.top + info.y(i)*r.height - 8) + 'px'; };
    g.querySelectorAll('[data-i]').forEach(el => { el.onpointerenter = () => toon(+el.dataset.i); el.onclick = () => toon(+el.dataset.i); });
    svg.onpointerleave = () => tip.style.display = 'none';
  });
}

function weekCijfers(ma){       // zoals weekStats, maar zonder lessen op te halen
  const perVak = {}; let gamen = 0, sport = 0, coderen = 0, studie = 0;
  for (let i = 0; i < 7; i++) {
    const s = plus(ma, i), r = D.dagen.find(x => x.datum === s) || {}, st = studieOp(s);
    Object.keys(st).forEach(v => { perVak[v] = (perVak[v]||0) + st[v]; studie += st[v]; });
    gamen += r.gamen || 0; coderen += r.coderen || 0; if (r.sport) sport++;
  }
  const doel = doelenVoor(ma, 7);
  return { perVak, studie, gamen, sport, coderen, doel, verdiend: weekPlan(ma).game.vrijgespeeld };
}

const CONCEPT_KEY = 'planner-concept';
let uitgesteld = false;
const opgeslagenRefl = w => { const r = D.reflecties.find(x => x.week === w) || {}; return {week:w, goed:r.goed||'', beter:r.beter||'', focus:r.focus||''}; };
const viesRefl = () => !!(D && refl && JSON.stringify(refl) !== JSON.stringify(opgeslagenRefl(refl.week)));
/** Ben je iets aan het invullen? Dan het scherm niet op de achtergrond opnieuw tekenen. */

/** Weggaan van een dag/week met niet-opgeslagen wijzigingen: eerst vragen. */
let opslaanBezig = null, wachtend = false;   // loopt er een opslag? dan eerst daarop wachten
function verlaat(actie, annuleer, naFout){
  const loopt = opslaanBezig || reflBezig;
  if (loopt) {
    wachtend = true; toast('Even wachten, wordt opgeslagen…');
    loopt.then(() => { wachtend = false; verlaat(actie, annuleer, naFout); });
    return;
  }
  // dag gewijzigd: niet vragen, gewoon meteen opslaan. Lukt dat niet, dan alsnog de vraag hieronder.
  if (viesDag() && !naFout) {
    wachtend = true;
    nuOpslaan().then(ok => { wachtend = false; verlaat(actie, annuleer, !ok); });
    return;
  }
  // reflectie gewijzigd: ook meteen opslaan
  if (viesRefl() && !naFout) {
    wachtend = true;
    reflNuOpslaan().then(ok => { wachtend = false; verlaat(actie, annuleer, !ok); });
    return;
  }
  const soort = viesDag() ? 'dag' : viesRefl() ? 'refl' : null;
  if (!soort) return actie();
  const bg = document.createElement('div'); bg.className = 'kiezer-bg vraag-bg';
  bg.innerHTML = `<div class="kiezer" role="dialog"><h3 style="margin:0 0 6px">Niet opgeslagen</h3>
    <div class="note" style="margin:0 0 14px">Je hebt wijzigingen ${soort==='dag' ? 'voor ' + dagKort(inv.dag) : 'in je weekreflectie'} nog niet opgeslagen.</div>
    <button class="btn" data-k="ok">Opslaan</button>
    <button class="btn danger" data-k="weg" style="margin-top:8px">Niet opslaan</button>
    <button class="btn ghost" data-k="terug">Annuleren</button></div>`;
  const sluit = () => { bg.remove(); setTimeout(inhalen, 0); };
  bg.onclick = async e => {
    const k = (e.target.closest('[data-k]') || {}).dataset?.k;
    if (e.target === bg || k === 'terug') { sluit(); if (annuleer) annuleer(); return; }

// ================= TERUGKNOP (Android) =================
// Een geïnstalleerde web-app sluit bij "terug" als er geen geschiedenis is. Daarom zetten we één extra stap
// in de browsergeschiedenis (pushState). Terug haalt die stap weg (popstate): wij doen dan zelf "terug" binnen
// de app en zetten de stap opnieuw klaar. Pas op Vandaag/vandaag, zonder open venster, mag terug de app sluiten.
let viewStapel = [], laatsteView = null, terugBezig = false;
function terugInApp(){
  const venster = document.querySelector('.kiezer-bg');          // tijdkiezer of vraag: annuleren
  if (venster) {
    const knop = venster.querySelector('[data-k="annuleer"], [data-k="terug"]');
    if (knop) knop.click(); else venster.remove();
    return true;
  }
  if (document.querySelector('.sheet-bg')) { closeSheet(); return true; }   // los venster (instellingen, dienst…)
  if (viewStapel.length) {                                        // vorig scherm
    const vorige = viewStapel.pop();
    verlaat(() => { terugBezig = true; view = vorige; render(); window.scrollTo(0,0); });
    return true;
  }
  if (view !== 'vandaag' || dag !== vandaag()) {                  // anders: naar Vandaag, vandaag
    verlaat(() => { terugBezig = true; view = 'vandaag'; dag = vandaag(); render(); window.scrollTo(0,0); });

}

// ================= AUTOMATISCH OPSLAAN (Vandaag) =================
// Na elke wijziging wachten we even (debounce): tik je binnen AUTO_MS nog iets, dan begint het wachten opnieuw.
// Zo worden tien tikken op + één verzoek naar de server in plaats van tien.
const AUTO_MS = 2500;
let autoTimer = null, autoStatus = '';
const STATUS_TEKST = { wacht: '· slaat zo op', bezig: '· opslaan…', ok: '· opgeslagen ✓',
                       offline: '· offline bewaard', fout: '· niet opgeslagen, tik om opnieuw' };
function toonStatus(s){
  autoStatus = s;
  const el = $('#vStatus');
  if (el) { el.textContent = STATUS_TEKST[s] || ''; el.className = 'sub autostatus ' + s; }
}
/** Na elke wijziging aanroepen: start (of herstart) het wachten. */
function planAuto(){
  clearTimeout(autoTimer);
  if (!viesDag()) { if (autoStatus === 'wacht') toonStatus(''); return; }
  toonStatus('wacht');
  autoTimer = setTimeout(nuOpslaan, AUTO_MS);
}
/** Meteen opslaan. Geeft een Promise die true (gelukt of offline bewaard) of false (fout) oplevert. */
function nuOpslaan(){
  clearTimeout(autoTimer);
  if (opslaanBezig) return opslaanBezig.then(() => viesDag() ? nuOpslaan() : true);   // één verzoek tegelijk
  if (!viesDag()) return Promise.resolve(true);
  const verstuurd = JSON.stringify(inv), welkeDag = inv.dag;
  toonStatus('bezig');
  opslaanBezig = api('bewaarDag', dagPayload()).then(d => {
    D = d;
    if (inv && inv.dag === welkeDag) {
      if (JSON.stringify(inv) === verstuurd) { laadInv(); opslag.weg(CONCEPT_KEY); }
      else invBasis = verstuurd;      // je tikte verder tijdens het opslaan: dat gaat in de volgende ronde mee
    }
    toonStatus((opslag.get(WACHT_KEY) || []).length ? 'offline' : 'ok');
    return true;
  }).catch(() => { bewaarConcept(); toonStatus('fout'); return false; })   // niet steeds opnieuw proberen: wacht op een tik of een nieuwe wijziging
    .then(ok => { opslaanBezig = null; if (ok && viesDag()) planAuto(); if (!wachtend) achtergrondRender(); return ok; });
  return opslaanBezig;
}

// ================= AUTOMATISCH OPSLAAN (weekreflectie) =================
// Zelfde idee als bij Vandaag: na elke tik even wachten (debounce). Typ je binnen REFL_MS verder,
// dan begint het wachten opnieuw. Zo wordt een hele zin één verzoek, en een halve gedachte niet steeds opgeslagen.
const REFL_MS = 3000;
let reflTimer = null, reflBezig = null, reflStatus = '';
function toonReflStatus(s){

}
function planRefl(){

  toonReflStatus('wacht');
  reflTimer = setTimeout(reflNuOpslaan, REFL_MS);
}
/** Meteen opslaan. Promise met true (gelukt of offline bewaard) of false (fout). Eén verzoek tegelijk. */
function reflNuOpslaan(){
  clearTimeout(reflTimer);

// ================= INDELING (vaste kolommen) =================
// Een scherm bestaat uit blokken met een id. Per apparaat (localStorage) onthouden we per blok: in welke kolom
// het staat (kol 1 = links), de volgorde, en of het zichtbaar is (aan). Op een breed scherm staan de kolommen
// naast elkaar (3, of 2 bij een smaller venster); op de telefoon staan alle blokken onder elkaar, kolom voor kolom.
// Indelen: slepen aan ⠿, ▲▼ = binnen de kolom, ◀ ▶ = naar een andere kolom, 👁 = tonen/verbergen.
const INDELING_KEY = 'planner-indeling';
let indelen = null, indelingConcept = null;              // scherm dat je nu indeelt + de werkkopie
const aantalKol = () => !BREED.matches ? 1 : window.innerWidth >= 1300 ? 3 : 2;
function indelingVan(scherm, ids){
  const alle = opslag.get(INDELING_KEY) || {}, bewaard = Array.isArray(alle[scherm]) ? alle[scherm] : [];
  const uit = bewaard.filter(x => ids.includes(x.id)).map(x => ({ id: x.id, aan: x.aan !== false, kol: Number(x.kol) || 0 }));
  // blokken die er later bij kwamen: op hun standaardplek erbij
  ids.forEach((id, i) => { if (!uit.some(x => x.id === id)) uit.splice(Math.min(i, uit.length), 0, { id, aan: true, kol: 0 }); });
  // nog geen kolom (nieuw, of bewaard vóór de vaste kolommen): om en om verdelen over 3 kolommen
  uit.forEach((x, i) => { if (!x.kol) x.kol = (i % 3) + 1; });
  return uit;
}
function indelingHtml(scherm, blokken){
  const ids = blokken.map(b => b.id), per = {};
  blokken.forEach(b => per[b.id] = b);
  const bezigMee = indelen === scherm;
  if (bezigMee && !indelingConcept) indelingConcept = indelingVan(scherm, ids);
  const n = aantalKol(), kolVan = x => Math.min(x.kol, n);
  kolStand = n;
  // één kolom (telefoon): eerst alle blokken van kolom 1, dan 2, dan 3 (sort is stabiel: volgorde binnen een kolom blijft)
  const ruw = bezigMee ? indelingConcept : indelingVan(scherm, ids);
  const lijst = n === 1 ? [...ruw].sort((a, b) => a.kol - b.kol) : ruw;
  // Bovenste kaarten op één lijn: heeft de bovenste kaart van een kolom een kopje (h2) en die van een andere kolom niet,
  // dan krijgt die laatste een onzichtbaar kopje van dezelfde hoogte (alleen buiten de indeelmodus en met >1 kolom).
  const zichtbaar = x => x.aan && per[x.id] && String(per[x.id].html || '').trim();
  const heeftKop = x => /^\s*<h2[\s>]/.test(per[x.id].html || '');
  const bovenste = [...Array(n)].map((_, i) => lijst.find(x => kolVan(x) === i + 1 && zichtbaar(x))).filter(Boolean);
  const metPlek = new Set(!bezigMee && n > 1 && bovenste.some(heeftKop) ? bovenste.filter(x => !heeftKop(x)).map(x => x.id) : []);
  const blokHtml = x => {
    const b = per[x.id]; if (!b) return '';
    const leeg = !String(b.html || '').trim(), k = kolVan(x);
    const inKol = lijst.filter(y => kolVan(y) === k), pos = inKol.indexOf(x);
    return `<div class="vblok ${x.aan ? '' : 'uit'} ${leeg ? 'leeg' : ''}" data-id="${x.id}" ${bezigMee ? 'draggable="true"' : ''}>
      ${bezigMee ? `<div class="blokbalk"><span class="greep" title="slepen">⠿</span><span class="bnaam">${esc(b.naam)}${x.aan ? '' : ' · verborgen'}${leeg ? ' · nu leeg' : ''}</span>
        ${n > 1 ? `<button class="mini-knop" data-ilinks="${x.id}" aria-label="kolom naar links" ${k === 1 ? 'disabled' : ''}>◀</button>
        <button class="mini-knop" data-irechts="${x.id}" aria-label="kolom naar rechts" ${k === n ? 'disabled' : ''}>▶</button>` : ''}
        <button class="mini-knop" data-iop="${x.id}" aria-label="omhoog" ${pos === 0 ? 'disabled' : ''}>▲</button>
        <button class="mini-knop" data-ineer="${x.id}" aria-label="omlaag" ${pos === inKol.length - 1 ? 'disabled' : ''}>▼</button>
        <button class="mini-knop" data-ioog="${x.id}" title="tonen of verbergen">${x.aan ? '👁' : '⊘'}</button></div>` : ''}
      <div class="vinhoud">${metPlek.has(x.id) ? '<h2 class="kopplek" aria-hidden="true">&nbsp;</h2>' : ''}${b.html || ''}</div></div>`;
  };
  const kolommen = [...Array(n)].map((_, i) =>
    `<div class="vkol" data-kol="${i + 1}">${lijst.filter(x => kolVan(x) === i + 1).map(blokHtml).join('')}</div>`).join('');
  return `${bezigMee ? `<div class="infobox indelbalk"><div class="grow"><b>Indeling aanpassen</b> (alleen op dit apparaat): sleep aan ⠿${n > 1 ? ', ◀ ▶ = andere kolom' : ''}, ▲▼ = volgorde, 👁 = tonen/verbergen.</div>
      <div class="row" style="margin-top:8px;flex-wrap:wrap"><button class="btn small" id="iBewaar">Opslaan</button>
      <button class="btn sec small" id="iAnnuleer">Annuleren</button><button class="btn ghost small" id="iStandaard">Standaard</button></div></div>` : ''}
    <div class="vkaarten ${bezigMee ? 'indelen' : ''}" data-scherm="${scherm}" style="grid-template-columns:repeat(${n},minmax(0,1fr))">${kolommen}</div>
    ${bezigMee ? '' : `<button class="btn ghost small" id="iStart" style="margin:6px auto 0;display:block">Indeling aanpassen</button>`}`;
}
/** Kolom en volgorde zoals ze nu op het scherm staan (na slepen) in de werkkopie zetten. */
function leesVolgorde(){
  const volg = [];
  document.querySelectorAll('.vkaarten > .vkol').forEach(kol => kol.querySelectorAll(':scope > .vblok').forEach(el => {
    const x = indelingConcept.find(y => y.id === el.dataset.id); if (x) { x.kol = +kol.dataset.kol; volg.push(x); } }));
  indelingConcept = volg.concat(indelingConcept.filter(x => !volg.includes(x)));
}
function indelingKnoppen(scherm){
  if ($('#iStart')) $('#iStart').onclick = () => { indelen = scherm; indelingConcept = null; render(); };
  if (indelen !== scherm) return;
  const stop = () => { indelen = null; indelingConcept = null; render(); };
  const n = aantalKol(), vind = id => indelingConcept.find(x => x.id === id);
  $('#iAnnuleer').onclick = stop;
  $('#iStandaard').onclick = () => { const alle = opslag.get(INDELING_KEY) || {}; delete alle[scherm]; opslag.set(INDELING_KEY, alle); stop(); toast('Standaardindeling'); };
  $('#iBewaar').onclick = () => { const alle = opslag.get(INDELING_KEY) || {}; alle[scherm] = indelingConcept; opslag.set(INDELING_KEY, alle); stop(); toast('Indeling opgeslagen ✓'); };
  // ▲▼: wisselen met het vorige/volgende blok in dezelfde kolom
  const schuif = (id, r) => {
    if (n === 1) {                                         // één kolom: volgorde zoals getoond, daarna alles in kolom 1
      const l = [...indelingConcept].sort((a, b) => a.kol - b.kol), i = l.indexOf(vind(id)), j = i + r;
      if (j < 0 || j >= l.length) return;
      [l[i], l[j]] = [l[j], l[i]]; l.forEach(y => y.kol = 1); indelingConcept = l; return render();
    }
    const x = vind(id), k = Math.min(x.kol, n), inKol = indelingConcept.filter(y => Math.min(y.kol, n) === k);
    const j = inKol.indexOf(x) + r; if (j < 0 || j >= inKol.length) return;
    const a = indelingConcept.indexOf(x), b = indelingConcept.indexOf(inKol[j]);
    [indelingConcept[a], indelingConcept[b]] = [indelingConcept[b], indelingConcept[a]]; render();
  };
  // ◀ ▶: naar de kolom ernaast (onderaan die kolom)
  const kolom = (id, r) => {
    const x = vind(id); x.kol = Math.max(1, Math.min(n, Math.min(x.kol, n) + r));
    indelingConcept = indelingConcept.filter(y => y !== x).concat([x]); render();
  };
  document.querySelectorAll('[data-iop]').forEach(b => b.onclick = () => schuif(b.dataset.iop, -1));
  document.querySelectorAll('[data-ineer]').forEach(b => b.onclick = () => schuif(b.dataset.ineer, 1));
  document.querySelectorAll('[data-ilinks]').forEach(b => b.onclick = () => kolom(b.dataset.ilinks, -1));
  document.querySelectorAll('[data-irechts]').forEach(b => b.onclick = () => kolom(b.dataset.irechts, 1));
  document.querySelectorAll('[data-ioog]').forEach(b => b.onclick = () => { const x = vind(b.dataset.ioog); x.aan = !x.aan; render(); });
  // slepen: tijdens het slepen verplaatsen we het blok zelf in de pagina (DOM); bij loslaten lezen we kolommen en volgorde uit
  let sleep = null;
  const zone = $('.vkaarten.indelen');
  zone.addEventListener('dragstart', e => {
    sleep = e.target.closest('.vblok'); if (!sleep) return;
    sleep.classList.add('sleept'); e.dataTransfer.effectAllowed = 'move';
    try { e.dataTransfer.setData('text/plain', sleep.dataset.id); } catch(_) {}
  });
  zone.addEventListener('dragover', e => {
    if (!sleep) return;
    const doel = e.target.closest('.vblok'), kol = e.target.closest('.vkol');
    if (doel && doel !== sleep) {
      e.preventDefault();
      const r = doel.getBoundingClientRect();
      doel.parentNode.insertBefore(sleep, e.clientY - r.top > r.height / 2 ? doel.nextSibling : doel);   // onderste helft = erachter
    } else if (!doel && kol) { e.preventDefault(); if (sleep.parentNode !== kol || kol.lastElementChild !== sleep) kol.appendChild(sleep); }
  });
  zone.addEventListener('drop', e => { if (sleep) e.preventDefault(); });
  zone.addEventListener('dragend', () => { if (!sleep) return; sleep.classList.remove('sleept'); sleep = null; leesVolgorde(); render(); });
}

// Met de knoppen Auto / Dag / Week kun je dat zelf kiezen; dat wordt per apparaat onthouden.

const BLOK_SOORT = { studie: 'Studie', sport: 'Sport', coderen: 'Coderen', taak: 'Taak', anders: 'Anders' };
const blokken = () => (D && D.blokken) || [];
const roosterKlaar = () => !!(D && Array.isArray(D.blokken) && Array.isArray(D.taken));   // nieuwe Code.gs al online?
const hm = m => pad(Math.floor(((m % 1440) + 1440) % 1440 / 60)) + ':' + pad(m % 60);
/** Begin en eind in minuten; eindigt hij na middernacht, dan telt het eind door (02:00 → 26:00). */
function minuten(x){ const b = mins(x.begin); let e = mins(x.eind); if (e <= b) e += 1440; return { b, e }; }
const blokUren = x => { const m = minuten(x); return (m.e - m.b) / 60; };
const blokNaam = b => b.wat || (b.soort === 'studie' ? (b.vak || 'Studie') : BLOK_SOORT[b.soort] || 'Blok');

/** Alles met een tijd op dag s: lessen, diensten en blokken. */
function roosterItems(s){
  const uit = [], lo = lessenOp(s);
  if (lo && lo.lessen) lo.lessen.forEach(l => uit.push(Object.assign(minuten(l), { soort: 'les', titel: l.titel, tijd: l.begin + '–' + l.eind, les: l })));
  extraOp(s).filter(x => !x.heleDag).forEach(x => uit.push(Object.assign(minuten(x), { soort: 'extra', titel: x.titel, tijd: x.begin + '–' + x.eind, extra: x })));
  dienstenOp(s).forEach(x => uit.push(Object.assign(minuten(x), { soort: 'werk', titel: W() + (x.waar ? ' · ' + x.waar : ''),
    tijd: x.begin + '–' + x.eind, dienst: x.id })));
  reisOp(s).forEach(r => uit.push({ b: r.b, e: r.e, soort: 'reis', titel: '🚆 reizen', sub: r.titel, tijd: hhmm(r.b) + '–' + hhmm(r.e) }));
  blokken().filter(b => b.datum === s).forEach(b => uit.push(Object.assign(minuten(b), { soort: b.soort, titel: blokNaam(b),
    sub: b.soort === 'studie' && b.vak && b.wat && b.wat !== b.vak ? b.vak : '', tijd: b.begin + '–' + b.eind, blok: b.id, klaar: b.klaar })));
  return uit.sort((a, b) => a.b - b.b || b.e - a.e);
}
/** Dingen zonder (echte) duur op dag s: deadlines, tentamens, vakantie, weg. */
function roosterKop(s){
  const uit = [];
  const vak = vakantieOp(s); if (vak) uit.push((vak.soort === 'zomer' ? '☀ ' : '🏖 ') + vak.naam);
  const weg = uitjeOp(s); if (weg) uit.push('🧳 ' + weg.lijst.map(p => p.naam).join(', '));
  D.tentamens.filter(t => t.datum === s).forEach(t => uit.push('📚 ' + t.vak + (t.tijd ? ' ' + t.tijd : '')));
  extraOp(s).filter(x => x.heleDag).forEach(x => uit.push('📅 ' + x.titel + (x.tijdTekst ? ' ' + x.tijdTekst : '')));
  D.deadlines.filter(d => d.datum === s && !d.klaar).forEach(d => uit.push('⏰ ' + deadlineNaam(d) + (d.tijd && d.tijd !== '23:59' ? ' ' + d.tijd : '')));
  return uit;
}
/** Studie op dag s: hoeveel heb je met blokken gepland, en wat zegt het studieplan? */
function studieVanDag(s){
  const wp = weekPlan(maandag(s)), d = wp.dagen.find(x => x.s === s);
  const gepland = blokken().filter(b => b.datum === s && b.soort === 'studie').reduce((t, b) => t + blokUren(b), 0);
  return { gepland, plan: d ? (s >= vandaag() ? d.planTot : d.doel) : 0, gedaan: d ? d.gedaan : 0 };
}
function studieRegel(s){
  const x = studieVanDag(s);
  if (x.plan < 0.01 && x.gepland < 0.01) return '';
  const weinig = s >= vandaag() && x.gepland < x.plan - 0.25;
  return `<span class="${weinig ? 'te-weinig' : ''}" title="studieblokken gepland / studieplan">📚 ${uMin(x.gepland)} / ${uD(x.plan)}</span>`;
}

/**
 * Overlappende items naast elkaar zetten: elk item krijgt een baan (l) en het aantal banen in zijn groepje (n).
 * Een groepje = items die (via elkaar) overlappen.
 */
function banen(items){
  let groep = [], eindGroep = -1, banenEind = [];
  const sluit = () => { const n = Math.max(1, banenEind.length); groep.forEach(x => x.n = n); groep = []; banenEind = []; eindGroep = -1; };
  items.forEach(x => {
    if (groep.length && x.b >= eindGroep) sluit();
    let l = banenEind.findIndex(e => e <= x.b);
    if (l < 0) { l = banenEind.length; banenEind.push(x.e); } else banenEind[l] = x.e;
    x.l = l; groep.push(x); eindGroep = Math.max(eindGroep, x.e);
  });
  sluit();
  return items;
}

/** Weekrooster: tijdkolom + 7 dagkolommen, items absoluut gepositioneerd op hun tijd. */
function weekRooster(ma){
  const { a, b } = actieveDag(), dagen = [...Array(7)].map((_, k) => plus(ma, k)), nu = vandaag();
  const per = dagen.map(s => banen(roosterItems(s)));
  // bereik: je actieve dag (⚙︎), uitgebreid als er iets eerder begint of later eindigt; altijd hele uren
  let start = Math.min(a, ...per.flat().map(x => x.b)), eind = Math.max(b, ...per.flat().map(x => x.e));
  start = Math.max(0, Math.floor(start / 60) * 60); eind = Math.min(start + 26 * 60, Math.ceil(eind / 60) * 60);
  const hoogte = (eind - start) / 30 * SLOT;
  const nuMin = new Date().getHours() * 60 + new Date().getMinutes();
  const uren = [...Array((eind - start) / 60)].map((_, i) => `<div class="uurlbl" style="top:${i * 2 * SLOT}px">${hm(start + i * 60)}</div>`).join('');
  const kop = dagen.map(s => {
    const k = roosterKop(s), st = studieRegel(s);
    return `<div class="wkkop ${s === nu ? 'vandaag' : ''}" data-dag="${s}"><div class="name">${DAGEN[dt(s).getDay()]} ${dt(s).getDate()}</div>
      ${st ? `<div class="sub">${st}</div>` : ''}
      ${k.map(x => `<div class="kopchip">${esc(x)}</div>`).join('')}</div>`;
  }).join('');
  const kolommen = dagen.map((s, k) => `<div class="dagkol ${s === nu ? 'vandaag' : ''}" data-s="${s}" data-start="${start}" style="height:${hoogte}px">
      ${per[k].map(x => itemHtml(x, start)).join('')}
      ${s === nu && nuMin >= start && nuMin <= eind ? `<div class="nu-lijn" style="top:${(nuMin - start) / 30 * SLOT}px"></div>` : ''}</div>`).join('');
  return `<div class="wk"><div class="wkkop leeg"></div>${kop}
    <div class="urenkol" style="height:${hoogte}px">${uren}</div>${kolommen}</div>`;
}
function itemHtml(x, start){
  const top = (x.b - start) / 30 * SLOT, h = Math.max(SLOT - 4, (x.e - x.b) / 30 * SLOT - 2);
  const data = x.blok ? `data-blok="${x.blok}"` : x.dienst ? `data-dienst="${x.dienst}"` : x.les ? lesData(x.les) : x.extra ? extraData(x.extra) : '';
  return `<div class="blok ${x.soort} ${x.klaar ? 'klaar' : ''}" ${data} title="${esc(x.tijd + ' ' + x.titel)}"
    style="top:${top}px;height:${h}px;left:calc(${x.l / x.n * 100}% + 2px);width:calc(${100 / x.n}% - 4px)">
    <div class="bt">${x.klaar ? '✓ ' : ''}${esc(x.titel)}</div>${h > SLOT ? `<div class="bs">${esc(x.tijd)}${x.sub ? ' · ' + esc(x.sub) : ''}</div>` : ''}</div>`;
}
/** Dagrooster (telefoon): een lijst op tijd, met een vinkje bij je eigen blokken. */
function dagRooster(s){
  const items = roosterItems(s);
  if (!items.length) return `<div class="card"><div class="empty">Nog niets gepland. Tik op + Blok.</div></div>`;
  return `<div class="card">${items.map(x => x.blok
    ? `<div class="ag blokrij ${x.soort} ${x.klaar ? 'klaar' : ''}"><button class="vink" data-bvink="${x.blok}" aria-label="afvinken">${x.klaar ? '✓' : ''}</button>
        <span class="tijd">${x.tijd}</span><span class="grow" data-blok="${x.blok}" style="cursor:pointer"><span class="bolletje ${x.soort}"></span>${esc(x.titel)}${x.sub ? ` <span class="sub">${esc(x.sub)}</span>` : ''}</span></div>`
    : `<div class="ag ${x.soort === 'werk' ? 'werk' : ''}" ${x.dienst ? `data-dienst="${x.dienst}"` : x.les ? lesData(x.les) : x.extra ? extraData(x.extra) : ''} style="cursor:pointer"><span class="vink-plek">${x.extra ? '<span class="bolletje extra"></span>' : ''}</span>
        <span class="tijd">${x.tijd}</span><span class="grow">${esc(x.titel)}${x.sub ? ` <span class="sub">${esc(x.sub)}</span>` : ''}</span></div>`).join('')}</div>`;
}

function roosterKnoppen(){
  const stap = n => verlaat(() => { rd = plus(rd, n); render(); });
  // naar een andere maand: in de huidige maand blijft vandaag de dag (voor de takenlijsten), anders de 1e

  $('#rPrev').onclick = () => roosterModus === 'maand' ? maandStap(-1) : stap(weekModus() ? -7 : -1);
  $('#rNext').onclick = () => roosterModus === 'maand' ? maandStap(1) : stap(weekModus() ? 7 : 1);
  document.querySelectorAll('.mdcel[data-dag]').forEach(el => el.onclick = () => openMaandDag(el.dataset.dag));
  if ($('#rNu')) $('#rNu').onclick = () => { rd = vandaag(); render(); };
  // maandrooster → vandaag in het gewone rooster (automatisch: week op pc, dag op telefoon)
  if ($('#rVandaag')) $('#rVandaag').onclick = () => { rd = vandaag(); roosterModus = 'auto'; opslag.set(ROOSTER_KEY, 'auto'); render(); };
  if ($('#rDatum')) $('#rDatum').onchange = e => { if (e.target.value) { rd = e.target.value; render(); } };
  document.querySelectorAll('#rModus button').forEach(b => b.onclick = () => { roosterModus = b.dataset.v; opslag.set(ROOSTER_KEY, roosterModus); render(); });
  if ($('#rNieuw')) $('#rNieuw').onclick = () => openBlok(null, { datum: rd });
  if ($('#rKopie')) $('#rKopie').onclick = () => neemVorigeWeekOver();
  if ($('#rBasis')) $('#rBasis').onclick = () => neemBasisOver();
  if ($('#rBasisBewaar')) $('#rBasisBewaar').onclick = () => bewaarBasisweek();
  if ($('#rBasisEdit')) $('#rBasisEdit').onclick = () => { basisEdit = { ref: maandag(rd), achter: true }; render(); window.scrollTo(0, 0); };
  document.querySelectorAll('[data-blok]').forEach(el => el.onclick = e => { e.stopPropagation(); openBlok(blokken().find(b => b.id === el.dataset.blok)); });
  document.querySelectorAll('[data-dienst]').forEach(el => el.onclick = e => { e.stopPropagation(); openDienst(D.diensten.find(x => x.id === el.dataset.dienst)); });
  document.querySelectorAll('[data-bvink]').forEach(el => el.onclick = () => vinkBlokVraag(blokken().find(b => b.id === el.dataset.bvink)));
  document.querySelectorAll('.wkkop[data-dag]').forEach(el => el.onclick = () => { rd = el.dataset.dag; roosterModus = 'dag'; opslag.set(ROOSTER_KEY, 'dag'); render(); });
  // klik in een leeg stuk van een dagkolom: nieuw blok op dat halfuur
  document.querySelectorAll('.dagkol').forEach(kol => kol.onclick = e => {
    if (e.target !== kol) return;
    const m = Number(kol.dataset.start) + Math.floor(e.offsetY / SLOT) * 30;
    if (m >= 1440) return toast('Na middernacht: plan dat blok op de volgende dag');
    openBlok(null, { datum: kol.dataset.s });                // alleen de dag; tijden vul je zelf in
  });
}

// ================= BASISWEEK BEWERKEN =================
// Een weekrooster ma–zo zonder data met alleen je basisblokken. Ter oriëntatie staan lessen, diensten en afspraken
// van een gewone week (‹ › te kiezen, of uit) grijs op de achtergrond; die komen niet in de basisweek.
let basisEdit = null;                                   // { ref: maandag van de achtergrondweek, achter: true/false }
function zetBasis(lijst, melding, knop){
  const waarde = JSON.stringify(lijst), oud = D.instellingen.basisWeek;
  if (knop) { tril(); knop.classList.add('bezig'); }
  D.instellingen.basisWeek = waarde;
  return api('bewaarInstelling', 'basisWeek', waarde).then(d => { D = d; closeSheet(); render(); if (melding) toast(melding); })
    .catch(() => { D.instellingen.basisWeek = oud; if (knop) knop.classList.remove('bezig'); });
}
function renderBasisEdit(){
  $('#title').textContent = 'Basisweek';
  const { ref, achter } = basisEdit, bw = basisWeek(), { a, b } = actieveDag();
  const per = [...Array(7)].map((_, k) => {
    const s = plus(ref, k);
    const bg = achter ? roosterItems(s).filter(x => !x.blok).map(x => Object.assign({}, x, { achter: true })) : [];
    const eigen = bw.map((x, i) => ({ x, i })).filter(y => y.x.dag === k).map(({ x, i }) => Object.assign(minuten(x),
      { soort: x.soort, titel: blokNaam(x), tijd: x.begin + '–' + x.eind, bw: i }));
    // achtergrond over de volle breedte, achter je eigen blokken (die krijgen hun eigen banen)
    return bg.map(x => Object.assign(x, { l: 0, n: 1 })).concat(banen(eigen.sort((p, q) => p.b - q.b || q.e - p.e)));
  });
  let start = Math.min(a, ...per.flat().map(x => x.b)), eind = Math.max(b, ...per.flat().map(x => x.e));
  start = Math.max(0, Math.floor(start / 60) * 60); eind = Math.min(start + 26 * 60, Math.ceil(eind / 60) * 60);
  const hoogte = (eind - start) / 30 * SLOT;
  const uren = [...Array((eind - start) / 60)].map((_, i) => `<div class="uurlbl" style="top:${i * 2 * SLOT}px">${hm(start + i * 60)}</div>`).join('');
  const kop = ['ma', 'di', 'wo', 'do', 'vr', 'za', 'zo'].map((d, k) => `<div class="wkkop" style="cursor:default"><div class="name">${d}</div>
    ${achter ? `<div class="sub">achtergrond ${dt(plus(ref, k)).getDate()} ${MAANDEN[dt(plus(ref, k)).getMonth()].slice(0, 3)}</div>` : ''}</div>`).join('');
  const item = (x) => {
    const top = (x.b - start) / 30 * SLOT, h = Math.max(SLOT - 4, (x.e - x.b) / 30 * SLOT - 2);
    return `<div class="blok ${x.soort} ${x.achter ? 'achter' : ''}" ${x.bw !== undefined ? `data-bw="${x.bw}"` : ''} title="${esc(x.tijd + ' ' + x.titel)}"
      style="top:${top}px;height:${h}px;left:calc(${x.l / x.n * 100}% + 2px);width:calc(${100 / x.n}% - 4px)">

// ================= BLOKKEN OVERNEMEN (vorige week of basisweek) =================
// Elk blok wordt eerst getoetst aan de nieuwe week: botst het met lessen, diensten, afspraken die meetellen
// (met "na afloop"), reistijd of een blok dat er al staat, dan vervalt het. Botst het maar deels, dan wordt het
// ingekort tot het grootste vrije stuk (minstens 30 min). Op dagen dat je helemaal weg bent (uitje) niets.
// Je ziet eerst wat er gebeurt en kiest dan pas "overnemen".
/** Basisweek: [{dag (0 = ma … 6 = zo), begin, eind, wat, soort, vak}] uit instelling basisWeek. */
function basisWeek(){
  try { const r = JSON.parse((D && D.instellingen && D.instellingen.basisWeek) || '[]'); return Array.isArray(r) ? r : []; } catch (e) { return []; }
}
/** Bezet op dag s: [{b, e, wat}] in minuten. */
function bezetOp(s){
  const uit = [], lo = lessenOp(s);
  if (lo && lo.lessen) lo.lessen.forEach(l => uit.push(Object.assign(minuten(l), { wat: l.titel })));
  dienstenOp(s).forEach(x => uit.push(Object.assign(minuten(x), { wat: W() + (x.waar ? ' ' + x.waar : '') })));
  const ex = extraOp(s).filter(x => extraTeltMee(x.agenda));
  extraStukken(s).forEach(([b, e]) => {
    const x = ex.find(y => !y.heleDag && minuten(y).b === b), r = reisOp(s).find(y => y.b === b && y.e === e);
    uit.push({ b, e, wat: r ? 'reistijd' : x ? x.titel : 'afspraak' });
  });
  blokken().filter(b => b.datum === s).forEach(b => uit.push(Object.assign(minuten(b), { wat: blokNaam(b) })));
  return uit;
}
/** Past blok n (datum, begin, eind) in de week? → { status: 'ok' | 'kort' | 'weg', begin, eind, reden } */
function toetsBlok(n){
  if (volWeg(n.datum)) return { status: 'weg', reden: 'je bent weg' };
  const m = minuten(n), bezet = bezetOp(n.datum).filter(x => x.b < m.e && x.e > m.b).sort((p, q) => p.b - q.b);
  if (!bezet.length) return { status: 'ok' };
  // vrije stukken binnen het blok
  let t = m.b, beste = null;
  const kijk = (van, tot) => { if (tot - van > (beste ? beste.e - beste.b : 0)) beste = { b: van, e: tot }; };
  bezet.forEach(x => { if (x.b > t) kijk(t, x.b); t = Math.max(t, x.e); });
  if (m.e > t) kijk(t, m.e);
  const reden = 'botst met ' + [...new Set(bezet.map(x => x.wat))].join(', ');
  if (beste && beste.e - beste.b >= 30) return { status: 'kort', begin: hhmm(beste.b), eind: hhmm(beste.e), reden };
  return { status: 'weg', reden };
}
/** Laat zien wat er met de blokken gebeurt en neem ze over na "overnemen". */
function overnemenScherm(titel, kandidaten){
  const dubbel = n => blokken().some(b => b.datum === n.datum && b.begin === n.begin && b.wat === n.wat);
  const lijst = kandidaten.filter(n => !dubbel(n)).map(n => ({ n, r: toetsBlok(n) }))
    .sort((p, q) => (p.n.datum + p.n.begin).localeCompare(q.n.datum + q.n.begin));
  if (!lijst.length) return toast('Die blokken staan er al');
  const mee = lijst.filter(x => x.r.status !== 'weg');
  const rij = ({ n, r }) => `<div class="row line"><span style="width:22px">${r.status === 'ok' ? '✓' : r.status === 'kort' ? '✂' : '✗'}</span>
    <div class="grow"><div class="${r.status === 'weg' ? 'sub' : ''}">${dagKort(n.datum)} ${n.begin}–${n.eind} · ${esc(blokNaam(n))}</div>
    ${r.status === 'kort' ? `<div class="sub">wordt ${r.begin}–${r.eind} (${esc(r.reden)})</div>` : r.status === 'weg' ? `<div class="sub">overgeslagen: ${esc(r.reden)}</div>` : ''}</div></div>`;
  sheet(`<h3>${titel}</h3>
    <div class="note">✓ past · ✂ ingekort tot het vrije stuk · ✗ overgeslagen (plan die zelf ergens anders).</div>
    <div class="card" style="padding:4px 12px">${lijst.map(rij).join('')}</div>
    <button class="btn" id="oOk" ${mee.length ? '' : 'disabled'}>${mee.length} ${mee.length === 1 ? 'blok' : 'blokken'} overnemen</button>
    <button class="btn ghost" id="oAnn">Annuleren</button>`);
  $('#oAnn').onclick = closeSheet;
  $('#oOk').onclick = () => {
    const nieuw = mee.map(({ n, r }) => Object.assign({}, n, r.status === 'kort' ? { begin: r.begin, eind: r.eind } : {}));
    const k = $('#oOk'); tril(); k.classList.add('bezig'); k.textContent = 'Bezig met overnemen…'; $('#oAnn').classList.add('bezig');
    api('bewaarBlokken', nieuw).then(d => { D = d; closeSheet(); render(); toast(nieuw.length + (nieuw.length === 1 ? ' blok' : ' blokken') + ' overgenomen ✓'); })
      .catch(() => { k.classList.remove('bezig'); $('#oAnn').classList.remove('bezig'); k.textContent = 'Opnieuw proberen'; });
  };
}

/** Alle vaknamen: je vakken, losse deadlines/tentamens en vakken met open studietaken. */
function alleVakken(){
  const uit = D.vakken.map(v => v.vak);
  const bij = n => { n = String(n || '').trim(); if (n && !uit.some(x => x.toLowerCase() === n.toLowerCase())) uit.push(n); };
  losseStudie(vandaag()).forEach(x => bij(x.naam));
  (D.taken || []).filter(t => t.lijst === 'vak' && !t.klaar).forEach(t => bij(t.vak));
  return uit;
}
/** Vakken in jouw volgorde (belangrijkste eerst); vakken die nog niet in je volgorde staan komen onderaan. */
function vakPrio(){
  const alle = alleVakken(), vast = String(I().vakPrio || '').split('|').filter(Boolean);
  return vast.filter(v => alle.includes(v)).concat(alle.filter(v => !vast.includes(v)));
}
const openVakTaken = v => (D.taken || []).filter(t => t.lijst === 'vak' && t.vak === v && !t.klaar).sort((a, b) => a.volgorde - b.volgorde);
/** Wat eerst? Het bovenste vak met een open taak, en die taak. */
function eersteStudie(){
  for (const v of vakPrio()) { const t = openVakTaken(v)[0]; if (t) return { vak: v, taak: t }; }
  const v = vakPrio()[0];
  return v ? { vak: v, taak: null } : null;
}

/**
 * Afvinken = loggen. Studie en coderen: kiezen of de tijd van het blok meetelt (of dat je de timer al gebruikte).
 * Sport: telt als sportschool-dag. Taak en anders: alleen een vinkje.

function vinkBlokVraag(b){
  if (!b) return;
  if (b.klaar) return zetBlokKlaar(b, false);

  if (b.soort !== 'studie' && b.soort !== 'coderen') return zetBlokKlaar(b, true, false);
  const duur = uMin(blokUren(b)), eerst = eersteStudie();
  const kies = b.soort === 'studie' && !b.vak;
  sheet(`<h3>${esc(blokNaam(b))} afvinken</h3>
    <div class="note">${b.begin}–${b.eind} · ${dagKort(b.datum)}</div>
    ${kies ? `<label class="f">Voor welk vak telt deze tijd?</label><select id="vVak">${vakPrio().map(v =>
      `<option ${eerst && v === eerst.vak ? 'selected' : ''}>${esc(v)}</option>`).join('')}</select>` : ''}
    <div style="height:10px"></div>
    <button class="btn" id="vLog">Klaar, ${duur} bijtellen${b.soort === 'coderen' ? ' bij coderen' : ''}</button>
    <button class="btn sec" id="vZonder" style="margin-top:8px">Klaar, tijd al gelogd (timer)</button>

// ================= MAANDROOSTER (zoals de maandpagina van een papieren planner) =================
// Per dag een vak met wat er die dag is: vakantie/uitje, tentamens, deadlines, afspraken uit je extra agenda,
// diensten en je eigen blokken. Dat komt er allemaal vanzelf in. Klik op een dag: alles van die dag + iets toevoegen.
function maandItems(s){
  const uit = [];
  periodes().filter(p => p.van <= s && s <= p.tot).forEach(p => uit.push({ soort: 'periode', ico: p.soort === 'uitje' ? '🧳' : p.soort === 'zomer' ? '☀' : '🏖', tekst: p.naam, p }));
  D.tentamens.filter(t => t.datum === s).forEach(t => uit.push({ soort: 'tentamen', ico: '📚', tekst: t.vak + (t.tijd ? ' ' + t.tijd : ''), t }));
  D.deadlines.filter(d => d.datum === s).forEach(d => uit.push({ soort: 'deadline', ico: d.klaar ? '✓' : '⏰', tekst: deadlineNaam(d), klaar: d.klaar, d }));
  extraOp(s).filter(x => extraInMaand(x.agenda)).forEach(x => uit.push({ soort: 'extra', ico: '📅', tekst: (x.heleDag ? '' : x.begin + ' ') + x.titel, x }));
  dienstenOp(s).forEach(x => uit.push({ soort: 'werk', ico: '💼', tekst: W() + ' ' + x.begin, x }));
  const bl = blokken().filter(b => b.datum === s);
  if (bl.length) uit.push({ soort: 'blokken', ico: '▦', tekst: bl.length + (bl.length === 1 ? ' blok' : ' blokken') });
  return uit;
}
function maandRooster(ymS){
  const eerste = ymS + '-01', start = maandag(eerste), nu = vandaag();
  const weken = []; for (let ma = start; ma.slice(0, 7) <= ymS; ma = plus(ma, 7)) weken.push(ma);
  const kop = ['ma', 'di', 'wo', 'do', 'vr', 'za', 'zo'].map(d => `<div class="mdkop">${d}</div>`).join('');
  const cel = s => {
    const items = maandItems(s), anders = s.slice(0, 7) !== ymS, wd = dt(s).getDay();
    return `<div class="mdcel ${anders ? 'anders' : ''} ${s === nu ? 'vandaag' : ''} ${wd === 0 || wd === 6 ? 'weekend' : ''}" data-dag="${s}">
      <div class="mdnr">${dt(s).getDate()}</div>
      ${items.slice(0, 5).map(x => `<div class="mditem ${x.soort} ${x.klaar ? 'klaar' : ''}" title="${esc(x.tekst)}"><span class="mdico">${x.ico}</span><span class="mdtekst">${esc(x.tekst)}</span></div>`).join('')}
      ${items.length > 5 ? `<div class="mditem meer">+${items.length - 5}</div>` : ''}</div>`;

    ${weken.map(ma => `<div class="mdwk">${weekNr(ma)}</div>` + [...Array(7)].map((_, k) => cel(plus(ma, k))).join('')).join('')}</div>`;

// ================= TAKEN (studie-to-do, deze week, deze maand) =================
// lijst week/maand: eenmalig (periode = de week/maand waarvoor hij is) of herhalend (week, om de week, maand).
// Een eenmalige taak die niet af is, schuift door naar de volgende week/maand ("van vorige week").
// lijst vak: studietaken per vak, in de volgorde van je vakken (belangrijkste bovenaan).
const ymVan = s => s.slice(0, 7);
/** Begin van de periode waarin dag s valt, voor deze taak. */
function periodeStart(t, s){
  if (t.lijst === 'maand') return ymVan(s);
  if (t.herhaal === '2weken') {
    const begin = /^\d{4}-\d{2}-\d{2}$/.test(t.periode || '') ? maandag(t.periode) : maandag(s);
    const n = Math.floor(dagenTot(begin, maandag(s)) / 14);
    return plus(begin, n * 14);
  }
  return maandag(s);
}
/** Valt datum x in dezelfde periode als dag s? */
function zelfdePeriode(t, x, s){
  if (!x) return false;
  if (t.lijst === 'maand') return ymVan(x) === ymVan(s);
  if (t.herhaal === '2weken') { const p = periodeStart(t, s); return x >= p && x < plus(p, 14); }
  return maandag(x) === maandag(s);
}
// ---- Herhalen "na vaste tijd" (bijv. beddengoed): herhaal = "d28v3w" ----
// 28 = aantal dagen na de vorige keer, 3 = zoveel dagen van tevoren valt hij op, w = dagen dat je helemaal weg bent
// (uitje, Maand → 🧳) tellen niet mee. klaar = laatste keer gedaan; periode = de keer daarvoor (voor "weer open").
// Vaker gedaan? Afvinken mag altijd: de teller begint dan opnieuw.
function interval(t){
  const m = /^d(\d+)v(\d+)(w?)$/.exec(t && t.herhaal || '');
  return m ? { n: +m[1], v: +m[2], w: !!m[3] } : null;
}
/** Helemaal weg op dag s (uitje dat de hele dag beslaat)? Een halve dag weg telt niet. */
const volWeg = s => { const u = uitjeOp(s); return !!u && u.deel >= 0.99; };
/** Wanneer moet hij weer, en hoeveel dagen weg schoven hem op? null = nog nooit gedaan (dus nu). */
function intervalVolgende(t){
  const iv = interval(t); if (!iv || !t.klaar) return null;
  let s = t.klaar, telt = 0, weg = 0;
  for (let k = 0; k < 1000 && telt < iv.n; k++) { s = plus(s, 1); if (iv.w && volWeg(s)) weg++; else telt++; }
  return { datum: s, weg };
}
/** Hoe staat taak t ervoor op dag s? null = niet tonen. */
function taakStand(t, s){
  if (t.lijst === 'vak') return !t.klaar ? { klaar: false } : t.klaar === s ? { klaar: true } : null;
  const iv = interval(t);
  if (iv) {
    if (t.klaar === s) return { klaar: true, iv };
    const vo = intervalVolgende(t), d = vo ? dagenTot(s, vo.datum) : 0;
    return { klaar: false, iv, volgende: vo, dagen: d, later: d > iv.v };
  }
  const nuP = t.lijst === 'maand' ? ymVan(s) : maandag(s);
  const p = t.periode ? (t.lijst === 'maand' ? String(t.periode).slice(0, 7) : maandag(t.periode)) : nuP;
  if (p > nuP) return null;                                      // begint pas later
  if (t.herhaal) return { klaar: zelfdePeriode(t, t.klaar, s), herhaal: true };
  if (p === nuP) return { klaar: !!t.klaar };
  if (!t.klaar) return { klaar: false, oud: true };              // van een eerdere week/maand, nog niet af
  return zelfdePeriode(t, t.klaar, s) ? { klaar: true, oud: true } : null;
}
const HERHAAL_TEKST = { week: 'elke week', '2weken': 'om de week', maand: 'elke maand' };
const herhaalTekst = t => { const iv = interval(t); return iv ? `elke ${iv.n} dagen` + (iv.w ? ' (weg telt niet)' : '') : HERHAAL_TEKST[t.herhaal] || ''; };
/** "over 3 dagen", "vandaag", "2 dagen te laat", "nog nooit gedaan" */
function intervalTekst(st){
  if (st.klaar) return 'gedaan';
  if (!st.volgende) return 'nog niet afgevinkt: doe hem als het uitkomt';
  const d = st.dagen, w = st.volgende.weg ? ` (+${st.volgende.weg} ${st.volgende.weg === 1 ? 'dag' : 'dagen'} weg)` : '';
  if (d > st.iv.v) return `volgende keer ${dagKort(st.volgende.datum)}, over ${d} dagen${w}`;
  if (d > 0) return `over ${d} ${d === 1 ? 'dag' : 'dagen'} (${dagKort(st.volgende.datum)})${w}`;
  if (d === 0) return 'vandaag';
  return `${-d} ${d === -1 ? 'dag' : 'dagen'} te laat`;
}
function takenVan(lijst, s){
  return (D.taken || []).filter(t => t.lijst === lijst).map(t => ({ t, st: taakStand(t, s) })).filter(x => x.st)
    .sort((a, b) => a.st.klaar - b.st.klaar || (a.st.later ? 1 : 0) - (b.st.later ? 1 : 0) || a.t.volgorde - b.t.volgorde);
}
function taakRij(x){
  const { t, st } = x;
  const extra = [st.herhaal || st.iv ? '↻ ' + herhaalTekst(t) : '', st.iv ? intervalTekst(st) : '',
    st.oud && !st.klaar ? (t.lijst === 'maand' ? 'van vorige maand' : 'van vorige week') : '']
    .filter(Boolean).join(' · ');
  const laat = st.iv && !st.klaar && st.volgende && st.dagen < 0;
  return `<div class="dl taak ${st.klaar ? 'klaar' : ''} ${st.later ? 'later' : ''} ${laat ? 'urgent' : ''}"><button class="vink" data-tvink="${t.id}" aria-label="${st.klaar ? 'weer open' : 'klaar'}">${st.klaar ? '✓' : ''}</button>

}

      ${wk.map(taakRij).join('') || '<div class="note">Nog geen taken voor deze week.</div>'}
      <button class="btn ghost small" data-tnieuw="week" style="margin-top:4px">+ Taak voor deze week</button>

      ${mnd.map(taakRij).join('') || '<div class="note">Nog geen taken voor deze maand.</div>'}
      <button class="btn ghost small" data-tnieuw="maand" style="margin-top:4px">+ Taak voor deze maand</button></div></div>`;
}
function takenKnoppen(){

  };
  document.querySelectorAll('[data-op]').forEach(b => b.onclick = () => schuif(+b.dataset.op, -1));
  document.querySelectorAll('[data-neer]').forEach(b => b.onclick = () => schuif(+b.dataset.neer, 1));
}
/** Afvinken (of weer open). Bij herhalende taken telt de datum: klaar in deze periode = af tot de volgende. */
function vinkTaak(t){
  if (!t) return;
  if (interval(t)) return vinkInterval(t);
  const st = taakStand(t, rd) || { klaar: !!t.klaar }, oud = t.klaar;
  // datum van afvinken: vandaag, of (als je een andere week/maand bekijkt) een dag in die periode
  const datum = t.lijst === 'vak' || zelfdePeriode(Object.assign({}, t, { herhaal: t.herhaal }), vandaag(), rd) ? vandaag() : rd;
  const nieuw = Object.assign({}, t, { klaar: st.klaar ? '' : datum });
  const zet = x => { D.taken = D.taken.map(y => y.id === x.id ? x : y); render(); return api('bewaarTaak', x).then(d => { D = d; achtergrondRender(); }); };
  tril();
  zet(nieuw).then(() => { if (!st.klaar) toastActie('Afgevinkt ✓ ' + t.wat, 'Ongedaan maken', () => zet(Object.assign({}, t, { klaar: oud || '' })).catch(() => {})); })
    .catch(() => { D.taken = D.taken.map(y => y.id === t.id ? t : y); render(); });
}
/** Na-vaste-tijd-taak: vandaag gedaan (de teller begint opnieuw), of nog een keer tikken = weer open (de vorige keer telt weer). */
function vinkInterval(t){
  const nu = vandaag(), terug = t.klaar === nu;
  const nieuw = Object.assign({}, t, terug ? { klaar: t.periode || '', periode: '' } : { klaar: nu, periode: t.klaar || '' });
  const zet = x => { D.taken = D.taken.map(y => y.id === x.id ? x : y); render(); return api('bewaarTaak', x).then(d => { D = d; achtergrondRender(); }); };
  tril();
  zet(nieuw).then(() => { if (!terug) toastActie('Gedaan ✓ ' + t.wat + ' · volgende keer ' + dagKort(intervalVolgende(nieuw).datum), 'Ongedaan maken', () => zet(t).catch(() => {})); })
    .catch(() => { D.taken = D.taken.map(y => y.id === t.id ? t : y); render(); });
}
function openTaak(t, preset){
  if (!roosterKlaar()) return toast('Werk eerst je Code.gs bij (⚙︎ → Versie)');
  const nieuw = !t;
  t = Object.assign({ wat: '', lijst: 'week', vak: '', periode: '', herhaal: '', klaar: '' }, preset || {}, t || {});
  let lijst = t.lijst, herhaal = t.herhaal;
  const vakken = vakPrio();
  sheet(`<h3>${nieuw ? 'Nieuwe taak' : 'Taak wijzigen'}</h3>
    <label class="f">Wat</label><input id="tWat" value="${esc(t.wat)}" placeholder="bijv. financiën checken, opdracht 3 maken">
    <label class="f">Lijst</label><div class="seg" id="tLijst">
      ${[['week', 'Deze week'], ['maand', 'Deze maand'], ['vak', 'Studie (vak)']].map(([v, l]) => `<button data-v="${v}" class="${lijst === v ? 'on' : ''}">${l}</button>`).join('')}</div>
    <div id="tVakRij"><label class="f">Vak</label><select id="tVak">${vakken.map(v => `<option ${v === t.vak ? 'selected' : ''}>${esc(v)}</option>`).join('')}
      <option value="__nieuw">Ander vak…</option></select>
      <input id="tVakNieuw" placeholder="naam van het vak" style="display:none;margin-top:6px"></div>
    <div id="tHerRij"><label class="f">Herhalen</label><div class="seg" id="tHer"></div></div>
    <div id="tIvRij" class="card" style="margin-top:8px">
      <div class="row line"><div class="grow">Weer na … dagen (na de vorige keer)</div><input id="tIvN" inputmode="numeric" value="${(interval(t) || {}).n || ''}" style="width:72px;text-align:right"></div>
      <div class="row line"><div class="grow">Opvallen vanaf … dagen van tevoren</div><input id="tIvV" inputmode="numeric" value="${(interval(t) || {}).v ?? ''}" style="width:72px;text-align:right"></div>
      <div class="row line"><div class="grow">Dagen dat ik helemaal weg ben (uitje) tellen niet</div>
        <div class="seg small" id="tIvW" style="flex:none"><button data-v="1">Ja</button><button data-v="">Nee</button></div></div>
      <div class="row line"><div class="grow">Laatst gedaan</div><input type="date" id="tIvKlaar" value="${interval(t) ? t.klaar || '' : ''}" style="width:170px"></div>
      <div class="note">Vaker gedaan? Vink hem gewoon af: de teller begint dan opnieuw. Hij staat altijd in je lijst, grijs tot hij bijna weer moet.</div></div>
    <div style="height:12px"></div><button class="btn" id="tOk">Opslaan</button>
    ${nieuw ? '' : '<button class="btn danger" id="tDel" style="margin-top:8px">Verwijderen</button>'}
    <button class="btn ghost" id="tAnn">Annuleren</button>`);
  const teken = () => {
    $('#tVakRij').style.display = lijst === 'vak' ? '' : 'none';
    $('#tHerRij').style.display = lijst === 'vak' ? 'none' : '';
    const opties = (lijst === 'maand' ? [['', 'Nee'], ['maand', 'Elke maand']] : [['', 'Nee'], ['week', 'Elke week'], ['2weken', 'Om de week']])
      .concat([['d', 'Na vaste tijd']]);
    const keuzeH = interval({ herhaal }) ? 'd' : herhaal;
    if (!opties.some(o => o[0] === keuzeH)) herhaal = '';
    $('#tHer').innerHTML = opties.map(([v, l]) => `<button data-v="${v}" class="${(interval({ herhaal }) ? 'd' : herhaal) === v ? 'on' : ''}">${l}</button>`).join('');
    document.querySelectorAll('#tHer button').forEach(b => b.onclick = () => {
      if (b.dataset.v === 'd') { if (!interval({ herhaal })) { herhaal = lijst === 'maand' ? 'd28v3w' : 'd7v1'; zetIv(); } }
      else herhaal = b.dataset.v;
      teken(); });
    $('#tIvRij').style.display = lijst !== 'vak' && interval({ herhaal }) ? '' : 'none';
  };
  // velden van "na vaste tijd" vullen vanuit herhaal
  const zetIv = () => { const iv = interval({ herhaal }) || { n: 28, v: 3, w: true };
    $('#tIvN').value = iv.n; $('#tIvV').value = iv.v;
    document.querySelectorAll('#tIvW button').forEach(b => b.classList.toggle('on', (b.dataset.v === '1') === iv.w)); };
  document.querySelectorAll('#tIvW button').forEach(b => b.onclick = () => document.querySelectorAll('#tIvW button').forEach(y => y.classList.toggle('on', y === b)));
  zetIv();
  document.querySelectorAll('#tLijst button').forEach(b => b.onclick = () => {
    lijst = b.dataset.v; document.querySelectorAll('#tLijst button').forEach(y => y.classList.toggle('on', y === b)); teken(); });
  $('#tVak').onchange = () => { $('#tVakNieuw').style.display = $('#tVak').value === '__nieuw' ? '' : 'none'; };
  teken();
  $('#tAnn').onclick = closeSheet;
  $('#tOk').onclick = async () => {
    const wat = $('#tWat').value.trim(); if (!wat) return toast('Wat moet er gebeuren?');
    let vak = $('#tVak').value; if (vak === '__nieuw') vak = $('#tVakNieuw').value.trim();
    if (lijst === 'vak' && !vak) return toast('Kies een vak');
    // periode: bij een nieuwe taak (of een andere lijst) de week/maand die je nu bekijkt
    let periode = lijst === 'vak' ? '' : (!nieuw && lijst === t.lijst && t.periode) ? t.periode : lijst === 'maand' ? ymVan(rd) : maandag(rd);
    let her = lijst === 'vak' ? '' : herhaal, klaar = t.klaar;
    if (lijst !== 'vak' && interval({ herhaal })) {
      const n = Math.round(num($('#tIvN').value)), v = Math.round(num($('#tIvV').value) || 0);
      if (!(n >= 1 && n <= 999)) return toast('Na hoeveel dagen? (1–999)');
      if (!(v >= 0 && v <= 99 && v < n)) return toast('Opvallen: 0 tot ' + Math.min(99, n - 1) + ' dagen van tevoren');
      her = 'd' + n + 'v' + v + (document.querySelector('#tIvW button[data-v="1"].on') ? 'w' : '');
      const k = $('#tIvKlaar').value;
      if (k && k > vandaag()) return toast('Laatst gedaan kan niet in de toekomst liggen');
      if (k !== (interval(t) ? t.klaar || '' : '')) { klaar = k; periode = ''; }      // zelf aangepast: dat is de laatste keer
      else if (!interval(t)) { klaar = ''; periode = ''; }                            // net omgezet naar "na vaste tijd"
      else periode = t.periode || '';
    } else if (interval(t)) klaar = '';                                               // van "na vaste tijd" af: opnieuw beginnen
    const x = Object.assign({}, t, { wat, lijst, vak: lijst === 'vak' ? vak : '', periode, herhaal: her, klaar });
    const k = $('#tOk'); k.disabled = true; k.textContent = 'Opslaan…';
    try { D = await api('bewaarTaak', x); closeSheet(); render(); toast('Opgeslagen ✓'); }
    catch(e){ k.disabled = false; k.textContent = 'Opslaan'; }
  };
  if (!nieuw) $('#tDel').onclick = async () => {
    const k = $('#tDel'); if (!k.dataset.zeker) { k.dataset.zeker = 1; k.textContent = 'Tik nog een keer om te verwijderen'; return; }
    k.classList.add('bezig');
    try { D = await api('verwijderTaak', t.id); closeSheet(); render(); toast('Taak verwijderd'); } catch(e){ k.classList.remove('bezig'); }
  };
}

// ================= start =================
/** Haalt nieuwe/gewijzigde diensten uit je werkagenda (op de achtergrond). */
function werkSync(melden){
  if (I().werkImport !== 'aan') return;
  api('synchroniseerWerk').then(d => {
    const n = d.werkInfo ? d.werkInfo.wijzigingen : 0;
    D = d;
    achtergrondRender();
    if (melden && n) toast(n + (n===1?' dienst':' diensten') + ' bijgewerkt uit je werkagenda');
  }).catch(()=>{});
}
function koppelScherm(fout){
  const l = $('#loading'); if (l) l.remove();
  document.querySelector('nav').style.display = 'none';
  $('#title').textContent = 'Planner koppelen';
  $('#main').innerHTML = `<div class="setup"><div class="card">
    <div class="note" style="margin-top:0">Eenmalig: koppel de app aan je Google Sheet. Beide gegevens staan in je Apps Script (zie de uitleg).</div>
    <label class="f">Web-app-URL (eindigt op /exec)</label><input id="kUrl" placeholder="https://script.google.com/macros/s/…/exec" autocomplete="off">
    <label class="f">Geheime sleutel</label><input id="kSleutel" autocomplete="off">
    ${fout ? `<div class="alert">${esc(fout)}</div>` : ''}
    <div style="height:12px"></div><button class="btn" id="kOk">Koppelen</button></div></div>`;
  $('#kOk').onclick = async () => {
    const cfg = {url: $('#kUrl').value.trim(), sleutel: $('#kSleutel').value.trim()};
    if (!/^https:\/\/script\.google\.com\/.+\/exec$/.test(cfg.url)) return toast('Die URL klopt niet: hij moet eindigen op /exec');
    if (!cfg.sleutel) return toast('Vul de sleutel in');
    const b = $('#kOk'); b.disabled = true; b.textContent = 'Controleren…';
    try { const d = await roep('haalAlles', [], cfg); opslag.set(CFG_KEY, cfg); opslag.set(CACHE_KEY, d); location.reload(); }
    catch(e){ koppelScherm(/sleutel/i.test(e.message) ? 'De sleutel klopt niet.' : 'Koppelen lukte niet: ' + e.message); }
  };
}
function start(){
  if (!IN_GOOGLE && !opslag.get(CFG_KEY)) return koppelScherm();
  const cache = IN_GOOGLE ? null : opslag.get(CACHE_KEY);
  LESSEN = opslag.get(LES_KEY);                       // lessen van de vorige keer, tot de nieuwe binnen zijn
  EXTRA = opslag.get(EXTRA_KEY);
  if (cache) { D = cache; $('#loading').remove(); if (!herstelConcept()) render(); }      // direct de laatste stand tonen
  api('haalAlles').then(d => {
    D = d; const l = $('#loading'); if (l) l.remove();
    haalLessenOp();                                   // lessen: één keer, bij het opstarten
    haalExtraOp();                                    // extra agenda's (⚙︎), ook één keer
    if (!herstelConcept()) achtergrondRender();
    werkSync(true);
    verstuurWachtrij();
  }).catch(() => { const l = $('#loading');
    if (l) l.textContent = 'Laden lukte niet. Ververs de pagina.';
    else toast('Geen verbinding: je ziet de laatste stand. Invullen kan gewoon.'); });
}
start();
if (!IN_GOOGLE && 'serviceWorker' in navigator && location.protocol === 'https:')
  navigator.serviceWorker.register('sw.js').catch(()=>{});
</script>
