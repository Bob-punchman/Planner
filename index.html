<!DOCTYPE html>
<html lang="nl">
<head>
<title>Planner</title>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#f1f4f2">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Planner">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<style>
  :root{
    --bg:#f1f4f2; --card:#fff; --ink:#1e2a2c; --muted:#6a787b; --line:#dde4e1;
    --accent:#2c6e6a; --accent-soft:#d9ebe8; --plan:#9cc7c2;
    --ok:#2f7a4f; --ok-soft:#dbefe2; --warn:#b4432f; --warn-soft:#f6ddd7;
    --info:#355f8c; --info-soft:#dde8f4; --radius:14px;
    --field:#fff; --soft:#e3e9e7; --track:#e6ecea; --hl:#f3f8f7; --on-accent:#fff; --game:#6b4fb3;
    color-scheme: light;
  }
  /* Donker thema: eigen stappen, geen automatische omkering */
  html[data-thema="donker"]{
    --bg:#121718; --card:#1a2123; --ink:#e6edeb; --muted:#97a6a8; --line:#2b3537;
    --accent:#5fb3ad; --accent-soft:#1d3634; --plan:#2f5c58;
    --ok:#5cc489; --ok-soft:#163325; --warn:#f08a76; --warn-soft:#3b201b;
    --info:#93b9e6; --info-soft:#1a2939;
    --field:#222b2d; --soft:#283234; --track:#2c373a; --hl:#1f2c2b; --on-accent:#0d1716; --game:#a996ef;
    color-scheme: dark;
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html,body{margin:0;background:var(--bg);color:var(--ink);
    font:17px/1.4 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif}
  header{position:sticky;top:0;z-index:5;background:var(--bg);padding:calc(14px + env(safe-area-inset-top)) 16px 8px;
    display:flex;align-items:center;justify-content:space-between}
  header h1{font-size:24px;margin:0;font-weight:700;letter-spacing:-.01em}
  main{padding:0 14px 150px;max-width:680px;margin:0 auto}
  nav{position:fixed;bottom:0;left:0;right:0;z-index:6;background:var(--card);border-top:1px solid var(--line);
    display:flex;padding-bottom:env(safe-area-inset-bottom)}
  nav button{flex:1;border:0;background:none;padding:10px 0 12px;font:inherit;font-size:13px;color:var(--muted);
    display:flex;flex-direction:column;align-items:center;gap:2px;cursor:pointer}
  nav button .i{font-size:22px;line-height:1}
  nav button.on{color:var(--accent);font-weight:600}
  .card{background:var(--card);border:1px solid var(--line);border-radius:var(--radius);padding:14px;margin:10px 0}
  .row{display:flex;gap:10px;align-items:center}
  .grow{flex:1;min-width:0}
  .line{padding:8px 0;border-bottom:1px solid var(--line)}
  .line:last-of-type{border-bottom:0}
  label.f{display:block;font-size:14px;color:var(--muted);margin:10px 0 4px}
  input,select,textarea{width:100%;font:inherit;padding:11px 12px;border:1px solid var(--line);border-radius:10px;
    background:var(--field);color:var(--ink);appearance:none;-webkit-appearance:none}
  textarea{min-height:70px;resize:vertical}
  .btn{border:0;border-radius:12px;padding:13px 16px;font:inherit;font-weight:600;background:var(--accent);color:var(--on-accent);width:100%;cursor:pointer}
  .btn.sec{background:var(--accent-soft);color:var(--accent)}
  .btn.ghost{background:none;color:var(--muted);font-weight:500}
  .btn.danger{background:var(--warn-soft);color:var(--warn)}
  .btn.small{width:auto;padding:7px 11px;font-size:14px}
  .sticky{position:fixed;left:0;right:0;bottom:calc(64px + env(safe-area-inset-bottom));padding:10px 14px;
    background:linear-gradient(transparent,var(--bg) 30%);z-index:4}
  .sticky .btn{max-width:652px;margin:0 auto;display:block;box-shadow:0 4px 14px rgba(44,110,106,.3)}
  h2{font-size:15px;text-transform:uppercase;letter-spacing:.06em;color:var(--muted);margin:22px 4px 6px;font-weight:600}
  .name{font-weight:600}
  .sub{font-size:14px;color:var(--muted)}
  .note{font-size:14px;color:var(--muted);margin:6px 2px}
  .empty{color:var(--muted);text-align:center;padding:16px 8px}
  .badge{font-size:13px;padding:3px 9px;border-radius:99px;background:var(--ok-soft);color:var(--ok);white-space:nowrap;font-weight:600}
  .badge.none{background:var(--soft);color:var(--muted);font-weight:500}
  .list-item{display:flex;align-items:center;gap:10px;padding:12px 2px;border-bottom:1px solid var(--line);cursor:pointer}
  .list-item:last-child{border-bottom:0}
  .big{font-size:38px;font-weight:700;letter-spacing:-.02em;font-variant-numeric:tabular-nums;line-height:1.1}
  .unit{font-size:15px;font-weight:500;color:var(--muted);margin-left:4px;letter-spacing:0}
  .seg{display:flex;background:var(--soft);border-radius:11px;padding:3px;gap:3px}
  .seg button{flex:1;border:0;background:none;border-radius:9px;padding:9px 4px;font:inherit;font-size:15px;color:var(--muted);cursor:pointer}
  .seg button.on{background:var(--field);color:var(--ink);font-weight:600;box-shadow:0 1px 3px rgba(0,0,0,.08)}
  .seg.small button{padding:6px 14px}
  .alert,.okbox,.infobox{border-radius:12px;padding:10px 12px;font-size:15px;margin:10px 0}
  .alert{background:var(--warn-soft);color:var(--warn)}
  .okbox{background:var(--ok-soft);color:var(--ok)}
  .infobox{background:var(--info-soft);color:var(--info)}
  .daynav{display:flex;gap:8px;align-items:center;margin:6px 0}
  .nb{border:1px solid var(--line);background:var(--field);border-radius:10px;width:46px;height:46px;font-size:22px;color:var(--ink);flex:none;cursor:pointer}
  .daynav .lbl{flex:1;text-align:center;font-weight:600}
  .step{display:flex;align-items:center;gap:6px}
  .step button{width:40px;height:40px;border-radius:50%;border:1px solid var(--line);background:var(--field);font-size:22px;color:var(--accent);cursor:pointer}
  .sv{min-width:62px;text-align:center;font-weight:600;font-variant-numeric:tabular-nums}
  .ag{display:flex;gap:10px;padding:7px 0;border-bottom:1px solid var(--line);align-items:baseline}
  .ag:last-child{border-bottom:0}
  .ag .tijd{font-variant-numeric:tabular-nums;color:var(--muted);font-size:15px;min-width:96px}
  .ag.werk .grow{color:var(--accent);font-weight:600}
  .count{display:flex;align-items:center;gap:10px}
  .m{margin:10px 0}
  .mv{font-size:15px;font-variant-numeric:tabular-nums}
  .meter{height:9px;background:var(--track);border-radius:99px;overflow:hidden;margin-top:5px}
  .meter i{display:block;height:100%;background:var(--accent);border-radius:99px}
  .meter.good i{background:var(--ok)}
  .meter.bad i{background:var(--warn)}
  .track{position:relative;height:22px;background:var(--track);border-radius:8px;margin:34px 0 8px}
  .track i{position:absolute;top:0;bottom:0;left:0}
  .track i.gew{background:var(--accent);border-radius:8px 0 0 8px}
  .track i.gep{background:var(--plan)}
  .mark{position:absolute;top:-6px;bottom:-6px;width:2px;background:var(--ink);transform:translateX(-1px)}
  .mark b{position:absolute;bottom:100%;left:50%;transform:translateX(-50%);font-size:12px;white-space:nowrap;margin-bottom:2px}
  .mark.doel{background:var(--warn)}
  .mark.doel b{color:var(--warn)}
  .legend{display:flex;gap:14px;font-size:14px;color:var(--muted);flex-wrap:wrap}
  .legend span::before{content:"";display:inline-block;width:10px;height:10px;border-radius:3px;margin-right:5px;background:var(--accent)}
  .legend span.p::before{background:var(--plan)}
  table{width:100%;border-collapse:collapse;font-size:14px;font-variant-numeric:tabular-nums}
  th,td{text-align:right;padding:8px 3px;border-bottom:1px solid var(--line);white-space:nowrap}
  th:first-child,td:first-child{text-align:left}
  th{font-size:12px;color:var(--muted);font-weight:600}
  tr.tot td{font-weight:700;border-bottom:0}
  tr.vandaag td{background:var(--hl)}
  .mini{height:8px;background:var(--track);border-radius:99px;overflow:hidden;width:70px;display:inline-block;vertical-align:middle}
  .mini i{display:block;height:100%;background:var(--accent)}
  .sheet-bg{position:fixed;inset:0;background:rgba(30,42,44,.35);z-index:20;display:flex;align-items:flex-end}
  .sheet{background:var(--bg);width:100%;max-height:92vh;overflow:auto;border-radius:20px 20px 0 0;
    padding:18px 16px calc(20px + env(safe-area-inset-bottom));max-width:680px;margin:0 auto}
  .sheet h3{margin:0 0 6px;font-size:21px}
  .toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(140px + env(safe-area-inset-bottom));
    background:var(--ink);color:var(--bg);padding:11px 18px;border-radius:12px;z-index:30;font-size:15px;max-width:90vw}
  .loading{position:fixed;inset:0;display:grid;place-items:center;color:var(--muted);background:var(--bg);z-index:50}
  .gear{border:0;background:none;font-size:24px;color:var(--muted);padding:4px;cursor:pointer}
  details summary{list-style:none;cursor:pointer;color:var(--accent);font-weight:600;padding:12px 4px}
  details summary::-webkit-details-marker{display:none}
  .chips{display:flex;gap:6px;flex-wrap:wrap}
  .chip{border:1px solid var(--line);background:var(--field);border-radius:99px;padding:8px 13px;font:inherit;font-size:15px;color:var(--accent);cursor:pointer}
  .chip.game{color:var(--game)}
  .big.neg{color:var(--warn)}
  .timer{border-color:var(--accent);background:var(--hl)}
  .vakrow input{width:auto}
  .list-item.vervallen .name{text-decoration:line-through;color:var(--muted)}
  .badge.warn{background:var(--warn-soft);color:var(--warn)}
  .dl{display:flex;gap:10px;align-items:center;padding:9px 0;border-bottom:1px solid var(--line)}
  .dl:last-child{border-bottom:0}
  .dl .wanneer{font-size:13px;font-weight:600;white-space:nowrap}
  .dl.urgent .wanneer{color:var(--warn)}
  .vink{width:34px;height:34px;border-radius:50%;border:2px solid var(--line);background:var(--field);flex:none;cursor:pointer;color:var(--ok);font-size:17px}
  .setup{max-width:520px;margin:40px auto;padding:0 16px}
  .chip.code{color:var(--info)}
  .tabelwrap{overflow-x:auto}
  .grafiek{position:relative}
  .grafiek svg{display:block;width:100%;height:auto;overflow:visible}
  .grafiek .gt{font-weight:600;margin-bottom:2px}
  .grafiek .gs{font-size:13px;color:var(--muted);margin-bottom:6px}
  .grafiek .ax{font-size:11px;fill:var(--muted)}
  .grafiek .grid{stroke:var(--line);stroke-width:1}
  .grafiek .ref{stroke:var(--muted);stroke-width:1.5;stroke-dasharray:4 4}
  .grafiek .tick{stroke:var(--ink);stroke-width:2;stroke-linecap:round}
  .grafiek [data-i]{cursor:pointer}
  .legenda{display:flex;flex-wrap:wrap;gap:4px 12px;font-size:13px;color:var(--muted);margin:2px 0 6px}
  .legenda span{display:inline-flex;align-items:center;gap:5px}
  .legenda i{width:10px;height:10px;border-radius:3px;display:inline-block}
  .legenda i.lijn{height:0;border-top:2px solid var(--ink);border-radius:0;width:12px}
  .legenda i.stip{height:0;border-top:2px dashed var(--muted);border-radius:0;width:12px}
  .tip{position:absolute;pointer-events:none;background:var(--ink);color:var(--bg);font-size:13px;padding:6px 9px;border-radius:8px;
    white-space:nowrap;transform:translate(-50%,-100%);display:none;z-index:3;line-height:1.35}
  .x{border:0;background:none;color:var(--warn);font-size:20px;padding:4px 8px;cursor:pointer}
</style>
<script>
  // thema meteen toepassen (voordat de app tekent): licht, donker of systeem
  (function(){ var k = 'systeem'; try { k = JSON.parse(localStorage.getItem('planner-thema')) || 'systeem'; } catch(e){}
    var d = k === 'donker' || (k === 'systeem' && window.matchMedia && matchMedia('(prefers-color-scheme: dark)').matches);
    document.documentElement.setAttribute('data-thema', d ? 'donker' : 'licht'); })();
</script>
<!--TEST-HEAD-->
</head>
<body>
<!--TEST-BODY-->
<div class="loading" id="loading">Even laden…</div>
<header><h1 id="title">Vandaag</h1><button class="gear" id="gear" aria-label="Instellingen">⚙︎</button></header>
<main id="main"></main>
<div id="stickyHost"></div>
<nav id="nav">
  <button data-v="vandaag"><span class="i">✓</span>Vandaag</button>
  <button data-v="diensten"><span class="i">€</span>Diensten</button>
  <button data-v="maand"><span class="i">▤</span>Maand</button>
  <button data-v="week"><span class="i">◷</span>Week</button>
  <button data-v="trends"><span class="i">↗</span>Trends</button>
</nav>
<div id="sheetHost"></div>

<script>
// ================= data & helpers =================
let D = null;          // alle gegevens uit de spreadsheet
let view = 'vandaag';
const LES = {};        // lessen per week (sleutel: maandag)
const DAGEN = ['zo','ma','di','wo','do','vr','za'];
const DAGEN_LANG = ['zondag','maandag','dinsdag','woensdag','donderdag','vrijdag','zaterdag'];
const MAANDEN = ['jan','feb','mrt','apr','mei','jun','jul','aug','sep','okt','nov','dec'];
const MAANDEN_LANG = ['januari','februari','maart','april','mei','juni','juli','augustus','september','oktober','november','december'];
const $ = s => document.querySelector(s);
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const pad = n => String(n).padStart(2,'0');
const fmt = d => d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate());
const vandaag = () => fmt(new Date());
const dt = s => new Date(s+'T12:00:00');
const plus = (s,n) => { const d=dt(s); d.setDate(d.getDate()+n); return fmt(d); };
const maandag = s => plus(s, -((dt(s).getDay()+6)%7));
const weekNr = s => { const d=dt(s); d.setDate(d.getDate()+3-((d.getDay()+6)%7)); const j=new Date(d.getFullYear(),0,4,12);
  return 1+Math.round(((d-j)/864e5-3+((j.getDay()+6)%7))/7); };
const dagKort = s => { const d=dt(s); return DAGEN[d.getDay()]+' '+d.getDate()+' '+MAANDEN[d.getMonth()]; };
const dagenTot = (van,tot) => Math.round((dt(tot)-dt(van))/864e5);
const u = n => (Math.round(n*100)/100).toLocaleString('nl-NL',{maximumFractionDigits:2});
const euro = n => '€ '+Math.round(n).toLocaleString('nl-NL');
const euroC = n => '€ '+n.toLocaleString('nl-NL',{minimumFractionDigits:2,maximumFractionDigits:2});
const num = s => Number(String(s).replace(',','.'));
const mins = t => { const [h,m]=String(t||'0:0').split(':').map(Number); return (h||0)*60+(m||0); };
const ymPlus = (ym,n) => { let [y,m]=ym.split('-').map(Number); m+=n; while(m>12){m-=12;y++;} while(m<1){m+=12;y--;} return y+'-'+pad(m); };
const ymNaam = ym => { const [y,m]=ym.split('-').map(Number); return MAANDEN_LANG[m-1]+' '+y; };
const I = () => D.instellingen;

function brutoU(d){ let b=mins(d.begin), e=mins(d.eind); if (e<=b) e+=1440; return (e-b)/60; }
function nettoU(d){ return Math.max(0, brutoU(d)-(Number(d.pauze)||0)/60); }
function isLaat(d){ const b=mins(d.begin), e=mins(d.eind); return e<=b || e>=23*60; }
function stdPauze(br){ return br > I().pauzeVanaf ? I().pauzeMin : 0; }
const telt = x => x.status !== 'vervallen';
function dienstenOp(s){ return D.diensten.filter(x=>x.datum===s && telt(x)).sort((a,b)=>a.begin.localeCompare(b.begin)); }
function tarief(uren){ const i=I(); return uren>=i.grens2 ? i.loon2 : uren>=i.grens1 ? i.loon1 : i.loonBasis; }
function maandInfo(ym){
  const ds = D.diensten.filter(x=>x.datum.startsWith(ym+'-') && telt(x));
  const tot = ds.reduce((t,x)=>t+nettoU(x),0);
  const gew = ds.filter(x=>x.status==='gewerkt').reduce((t,x)=>t+nettoU(x),0);
  const g = D.maanddoelen.find(m=>m.maand===ym);
  const bruto = ds.reduce((t,x)=>t+nettoU(x)*(x.toeslag||100)/100,0) * tarief(tot);
  return { ds, tot, gew, doel: g?g.doel:I().maandDoel, minimum: g?g.minimum:I().maandMinimum, bruto, tarief: tarief(tot) };
}
function grensTekst(uren){
  const i=I();
  for (const g of [i.grens1, i.grens2]) if (uren<g && g-uren<=3)
    return `<div class="alert">Net onder de ${g}-grens: nog ${u(g-uren)} u en je krijgt een hoger uurloon over álle uren.</div>`;
  return '';
}
function volgendTentamen(vanaf){
  return D.tentamens.filter(t=>t.datum>=vanaf).sort((a,b)=>(a.datum+a.tijd).localeCompare(b.datum+b.tijd))[0];
}

// Werkt op twee manieren: binnen Google (google.script.run) of als losse app (fetch met geheime sleutel).
const IN_GOOGLE = !!(window.google && google.script && google.script.run);
const CFG_KEY = 'planner-koppeling', CACHE_KEY = 'planner-cache';
const opslag = { get(k){ try { return JSON.parse(localStorage.getItem(k)); } catch(e){ return null; } },
                 set(k,v){ try { localStorage.setItem(k, JSON.stringify(v)); } catch(e){} },
                 weg(k){ try { localStorage.removeItem(k); } catch(e){} } };
function roep(fn, args, cfg){
  if (IN_GOOGLE) return new Promise((res, rej) => google.script.run.withSuccessHandler(res).withFailureHandler(rej)[fn](...args));
  cfg = cfg || opslag.get(CFG_KEY);
  if (!cfg) return Promise.reject(new Error('Niet gekoppeld'));
  return fetch(cfg.url, { method:'POST', headers:{'Content-Type':'text/plain;charset=utf-8'},
                          body: JSON.stringify({sleutel: cfg.sleutel, fn, args}) })
    .then(r => r.json()).then(j => { if (!j.ok) throw new Error(j.fout || 'Onbekende fout'); return j.data; });
}
// Offline: deze schrijfacties worden bewaard en later verstuurd als er geen verbinding is.
const OFFLINE_FN = ['bewaarDag', 'bewaarReflectie', 'bewaarDeadline'], WACHT_KEY = 'planner-wachtrij';
const isNetwerkFout = e => /Failed to fetch|NetworkError|Load failed|network/i.test(e && e.message || String(e));
function lokaal(fn, a){             // laat de wijziging meteen zien, ook zonder verbinding
  const d = JSON.parse(JSON.stringify(D));
  if (fn === 'bewaarDag') {
    d.dagen = d.dagen.filter(x => x.datum !== a.datum);
    if (Number(a.gamen) || a.sport || a.notitie || Number(a.coderen) || Number(a.slaap) || a.bedtijd || a.opstaan)
      d.dagen.push({datum:a.datum, gamen:Number(a.gamen)||0, sport:!!a.sport, notitie:a.notitie||'', coderen:Number(a.coderen)||0,
                    slaap:Number(a.slaap)||0, bedtijd:a.bedtijd||'', opstaan:a.opstaan||''});
    const vakken = Object.keys(a.studie || {});
    d.studie = d.studie.filter(x => !(x.datum === a.datum && vakken.includes(x.vak)));
    vakken.forEach(v => { if (Number(a.studie[v]) > 0) d.studie.push({id:a.datum+'|'+v, datum:a.datum, vak:v, uren:Number(a.studie[v])}); });
  } else if (fn === 'bewaarReflectie') {
    d.reflecties = d.reflecties.filter(r => r.week !== a.week).concat([Object.assign({}, a)]);
  } else if (fn === 'bewaarDeadline') {
    const x = Object.assign({}, a, {id: a.id || 'nieuw-' + Date.now()});
    d.deadlines = d.deadlines.filter(y => y.id !== x.id).concat([x]);
  }
  return d;
}
async function verstuurWachtrij(){
  const rij = opslag.get(WACHT_KEY) || [];
  if (!rij.length || IN_GOOGLE) return;
  for (let n = 0; n < rij.length; n++) {
    try { await roep(rij[n].fn, rij[n].args); }
    catch(e) { opslag.set(WACHT_KEY, rij.slice(n)); return; }   // nog steeds offline: later opnieuw
  }
  opslag.weg(WACHT_KEY);
  try { D = await roep('haalAlles', []); opslag.set(CACHE_KEY, D); inv = null;
        if (!document.querySelector('.sheet-bg')) render(); toast('Offline wijzigingen opgeslagen ✓'); } catch(e) {}
}
window.addEventListener('online', verstuurWachtrij);
function api(fn, ...args){
  if (!IN_GOOGLE && OFFLINE_FN.includes(fn) && (opslag.get(WACHT_KEY) || []).length) return inWachtrij(fn, args);
  return roep(fn, args).catch(e => {
    if (!IN_GOOGLE && OFFLINE_FN.includes(fn) && isNetwerkFout(e)) return inWachtrij(fn, args);
    throw e;
  }).then(d => {
    if (!IN_GOOGLE && d && d.diensten) opslag.set(CACHE_KEY, d);   // laatste stand bewaren: app opent direct
    return d;
  }).catch(e => {
    const m = e.message || String(e);
    toast(isNetwerkFout(e) ? 'Geen verbinding. Probeer het zo opnieuw.' : 'Er ging iets mis: ' + m);
    throw e;
  });
}
function inWachtrij(fn, args){
  const rij = opslag.get(WACHT_KEY) || []; rij.push({fn, args}); opslag.set(WACHT_KEY, rij);
  const d = lokaal(fn, args[0]); opslag.set(CACHE_KEY, d);
  setTimeout(() => toast('Offline bewaard. Wordt verstuurd zodra je verbinding hebt.'), 2900);
  setTimeout(verstuurWachtrij, 3000);   // misschien is de verbinding er alweer
  return Promise.resolve(d);
}
function toast(t){ const el=document.createElement('div'); el.className='toast'; el.textContent=t; document.body.appendChild(el); setTimeout(()=>el.remove(),2800); }

/** Lessen van een week; haalt ze één keer op uit de agenda en tekent daarna opnieuw. */
function lessenWeek(ma){
  if (LES[ma] === undefined) {
    LES[ma] = null;
    api('haalLessen', ma, plus(ma,6))
      .then(r => { LES[ma] = r; if (!document.querySelector('.sheet-bg')) render(); })
      .catch(() => { LES[ma] = {fout:'Lessen laden uit de agenda lukte niet.'}; render(); });
  }
  return LES[ma];
}
function lessenOp(s){ const w=lessenWeek(maandag(s)); if (!w || w.fout) return w; return {lessen: w.lessen.filter(l=>l.datum===s)}; }

function basisDoel(){ const s = D.vakken.reduce((t,v)=>t+v.weekdoel,0); return s || 15; }
/** Toetsweekmodus: eerstvolgend tentamen binnen X dagen vanaf datum s (of in de week vanaf maandag s). */
function toetsweek(s, weekVanaf, dagen){
  const n = dagen || Number(I().toetsweekDagen) || 0; if (!n) return null;
  const eind = weekVanaf ? plus(s, 6) : s;
  // "alleen indien nodig" telt niet mee: haal hem weg met "Niet nodig", of pas de opmerking aan als je hem wél moet maken
  const t = D.tentamens.filter(t => !/indien nodig/i.test(t.opmerking||'') && t.datum >= s && dagenTot(eind, t.datum) <= n)
    .sort((a,b)=>(a.datum+a.tijd).localeCompare(b.datum+b.tijd))[0];
  return t ? { t, dagen: dagenTot(s, t.datum) } : null;
}
/** Doelen voor een week: in toetsweekmodus hoger studiedoel (extra uren naar het tentamenvak) en minder gamen. */
function doelen(modus){
  const i = I(), basis = basisDoel(), perVak = {};
  D.vakken.forEach(v => perVak[v.vak] = v.weekdoel);
  if (!modus) return { studie: basis, perVak, gameMax: i.gameMax };
  const studie = Math.max(basis, Number(i.toetsweekStudie) || basis), extra = studie - basis;
  const raak = D.vakken.filter(v => modus.t.vak.toLowerCase().includes(v.vak.toLowerCase()));
  raak.forEach(v => perVak[v.vak] += extra / raak.length);
  return { studie, perVak, gameMax: Math.min(i.gameMax, Number(i.toetsweekGameMax) || i.gameMax) };
}
function toetsBanner(m, d){
  return m ? `<div class="infobox">📚 <b>Toetsweekmodus</b>: ${esc(m.t.vak)} op ${dagKort(m.t.datum)}. Studiedoel ${u(d.studie)} u, max ${u(d.gameMax)} u gamen. Liefst geen diensten.</div>` : '';
}
function studieOp(s){ const o={}; D.studie.filter(x=>x.datum===s).forEach(x=>o[x.vak]=(o[x.vak]||0)+x.uren); return o; }
function weekStats(ma){
  const w = lessenWeek(ma);
  const perVak = {};
  const dagen = [...Array(7)].map((_,i) => {
    const s = plus(ma,i), r = D.dagen.find(x=>x.datum===s) || {}, ds = dienstenOp(s), st = studieOp(s);
    Object.keys(st).forEach(v => perVak[v] = (perVak[v]||0) + st[v]);
    return { s, studie:Object.values(st).reduce((a,b)=>a+b,0), gamen:r.gamen||0, sport:!!r.sport, coderen:r.coderen||0, slaap:r.slaap||0, bedtijd:r.bedtijd||'',
             werk: ds.reduce((t,x)=>t+nettoU(x),0),
             les: w && w.lessen ? w.lessen.filter(l=>l.datum===s).reduce((t,l)=>t+l.uren,0) : null,
             laat: ds.some(isLaat) };
  });
  const som = k => dagen.reduce((t,d)=>t+(d[k]||0),0);
  const studie = som('studie'), gamen = som('gamen');
  const modus = toetsweek(ma, true), doel = doelen(modus);
  const verdiend = Math.min(doel.gameMax, studie / (I().verdienPer || 2));
  const slaapDagen = dagen.filter(d => d.slaap > 0);
  return { dagen, perVak, studie, gamen, verdiend, gameOver: verdiend - gamen, modus, doel, coderen: som('coderen'),
           slaapGem: slaapDagen.length ? slaapDagen.reduce((t,d)=>t+d.slaap,0) / slaapDagen.length : null, slaapN: slaapDagen.length,
           bedGem: (b => b.length ? b.reduce((t,x)=>t+bedUur(x.bedtijd),0) / b.length : null)(dagen.filter(d => d.bedtijd)),
           sport:dagen.filter(d=>d.sport).length, werk:som('werk'),
           les: w && w.lessen ? som('les') : null, laat: dagen.filter(d=>d.laat).length };
}
function vakMeters(ws){
  const namen = D.vakken.map(v=>v.vak).concat(Object.keys(ws.perVak).filter(v=>!D.vakken.some(x=>x.vak===v)));
  return namen.map(v => { const doel = ws.doel.perVak[v] || 0, val = ws.perVak[v]||0;
    return meter(esc(v), val, doel || val || 1, u(val)+(doel?' / '+u(doel):'')+' u'); }).join('');
}
function meter(label, val, doel, txt, isMax){
  const pct = Math.min(100, doel ? val/doel*100 : 0);
  const cls = isMax ? (val>doel ? 'bad' : '') : (val>=doel ? 'good' : '');
  return `<div class="m"><div class="row"><div class="grow">${label}</div><div class="mv">${txt}</div></div>
    <div class="meter ${cls}"><i style="width:${pct}%"></i></div></div>`;
}

const LOS = ['gamen', 'coderen', 'slaap'];
/** Slaapduur uit bedtijd en opstaan (bedtijd mag vóór of na middernacht zijn). */
function slaapUren(bed, op){
  if (!bed || !op) return 0;
  let m = mins(op) - mins(bed); if (m <= 0) m += 1440;
  return Math.round(m / 60 * 100) / 100;
}
/** Bedtijd als getal voor gemiddelden en grafieken: na middernacht telt door (00:30 → 24,5). */
const bedUur = t => { const m = mins(t); return (m < 12*60 ? m + 1440 : m) / 60; };
const uurTekst = h => { const m = Math.round(h*60) % 1440; return pad(Math.floor(m/60)) + ':' + pad(m%60); };   // velden die niet bij een vak horen

// ================= DEADLINES =================
function deadlineNaam(d){ return (d.vak ? d.vak + ': ' : '') + d.wat; }
function wanneer(vanaf, d){
  const n = dagenTot(vanaf, d.datum);
  return n < 0 ? (-n)+' d te laat' : n === 0 ? 'vandaag '+(d.tijd||'') : n === 1 ? 'morgen '+(d.tijd||'') : 'over '+n+' dagen';
}
function deadlineKaart(s){
  const open = D.deadlines.filter(d => !d.klaar && dagenTot(s, d.datum) <= 14).sort((a,b)=>(a.datum+a.tijd).localeCompare(b.datum+b.tijd));
  const later = D.deadlines.filter(d => !d.klaar && dagenTot(s, d.datum) > 14).length;
  return `<h2>Deadlines</h2><div class="card">
    ${open.map(d => `<div class="dl ${dagenTot(s,d.datum)<=2?'urgent':''}"><button class="vink" data-dk="${d.id}" aria-label="klaar">✓</button>
      <div class="grow" data-de="${d.id}" style="cursor:pointer"><div class="name">${esc(deadlineNaam(d))}</div><div class="sub">${dagKort(d.datum)} · ${esc(d.tijd||'')}</div></div>
      <div class="wanneer">${wanneer(s,d)}</div></div>`).join('') || '<div class="note">Geen deadlines in de komende 2 weken.</div>'}
    <div class="row" style="margin-top:6px"><button class="btn ghost small" id="dlAlle">Alle deadlines${later?' (+'+later+' later)':''}</button>
      <div class="grow"></div><button class="btn sec small" id="dlNieuw">+ Deadline</button></div></div>`;
}
function deadlineKnoppen(){
  document.querySelectorAll('[data-dk]').forEach(b => b.onclick = async () => {
    const d = D.deadlines.find(x=>x.id===b.dataset.dk);
    D = await api('bewaarDeadline', Object.assign({}, d, {klaar:true})); render(); toast('Afgevinkt ✓ ' + deadlineNaam(d));
  });
  document.querySelectorAll('[data-de]').forEach(el => el.onclick = () => openDeadline(D.deadlines.find(x=>x.id===el.dataset.de)));
  if ($('#dlNieuw')) $('#dlNieuw').onclick = () => openDeadline(null);
  if ($('#dlAlle')) $('#dlAlle').onclick = () => alleDeadlines();
}
function alleDeadlines(){

  const srt = l => l.sort((a,b)=>(a.datum+a.tijd).localeCompare(b.datum+b.tijd));

/** Beoordeelt een dag voor een extra dienst. null = niet geschikt. */
function dagAdvies(s){
  if (dienstenOp(s).length) return null;
  if (['12-31','01-01'].includes(s.slice(5))) return null;                         // oud & nieuw vrij
  if (D.tentamens.some(t => t.datum === s || t.datum === plus(s,1))) return null;  // tentamen of dag ervoor
  const w = lessenWeek(maandag(s));
  if (w === null) return { s, laden: true };
  const les = w && w.lessen ? w.lessen.filter(l => l.datum === s) : [];
  const begin = les.reduce((m,l) => !m || l.begin < m ? l.begin : m, ''), eind = les.reduce((m,l) => l.eind > m ? l.eind : m, '');
  let wat, score;
  if (!les.length) { wat = 'hele dag vrij'; score = 3; }
  else if (mins(eind) <= 16*60+30) { wat = 'na je les (tot ' + eind + ')'; score = 2; }
  else if (mins(begin) >= 13*60) { wat = 'ochtend (les vanaf ' + begin + ')'; score = 1; }
  else return null;
  const op = [];
  if (dt(s).getDay() === 3) { op.push("borrel 's avonds"); score -= 0.5; }
  const m = toetsweek(s, false, Math.min(7, Number(I().toetsweekDagen) || 7));   // jouw regel: de week ervóór geen diensten
  if (m) { op.push(m.t.vak + ' over ' + m.dagen + ' d'); score -= 2; }
  const dl = D.deadlines.find(d => !d.klaar && (d.datum === s || d.datum === plus(s,1)));
  if (dl) { op.push('deadline ' + (dl.datum === s ? 'vandaag' : 'morgen')); score -= 1; }
  if (dienstenOp(plus(s,-1)).some(isLaat)) op.push('na late dienst: niet vroeg');
  return { s, wat, op, score };
}
function dienstzoeker(ym, mi){
  const nu = vandaag();
  if (ym < nu.slice(0,7)) return '';
  const doelU = mi.tot < mi.minimum ? mi.minimum : mi.doel;
  if (mi.tot >= mi.doel) return '';
  const tekort = doelU - mi.tot, diensten = Math.max(1, Math.ceil(tekort / 6));
  const dagen = []; let s = ym + '-01'; if (s <= nu) s = plus(nu, 1);
  for (; s.startsWith(ym); s = plus(s, 1)) { const a = dagAdvies(s); if (a) dagen.push(a); }
  const laden = dagen.some(a => a.laden);
  const goed = dagen.filter(a => !a.laden).sort((a,b) => b.score - a.score || a.s.localeCompare(b.s)).slice(0, 8);
  const label = sc => sc >= 2 ? ['', 'goed'] : sc >= 1 ? ['none', 'kan'] : ['warn', 'liever niet'];
  return `<h2>Dienstzoeker</h2><div class="card">
    <div class="name">Nog ${u(tekort)} u tot je ${mi.tot < mi.minimum ? 'minimum' : 'doel'} (${doelU} u) · ±${diensten} ${diensten===1?'dienst':'diensten'} van 6 u</div>
    ${mi.tot < mi.minimum && mi.doel > mi.minimum ? `<div class="sub">Tot je doel van ${mi.doel} u: nog ${u(mi.doel - mi.tot)} u</div>` : ''}
    ${laden ? '<div class="note">Lessen laden…</div>' : ''}
    ${goed.map(a => { const [c,l] = label(a.score); return `<div class="list-item" style="cursor:default"><div class="grow">
      <div class="name">${dagKort(a.s)}</div><div class="sub">${esc(a.wat)}${a.op.length ? ' · ' + esc(a.op.join(' · ')) : ''}</div></div>
      <span class="badge ${c}">${l}</span></div>`; }).join('') || (laden ? '' : '<div class="empty">Geen geschikte dagen meer deze maand.</div>')}
    <div class="note">Kijk in de Sjiek-app welke diensten er op deze dagen open staan. Nieuwe diensten komen vanzelf in de planner.</div></div>`;
}

let wk = maandag(vandaag()), refl = null;
function weekTekst(ws){
  const i = I(), zo = plus(wk,6), mi = maandInfo(wk.slice(0,7));
  return [
    `Weekreflectie week ${weekNr(wk)} (${dagKort(wk)} – ${dagKort(zo)})`,
    (ws.modus ? `Toetsweekmodus: ${ws.modus.t.vak} op ${dagKort(ws.modus.t.datum)}\n` : '') + `Zelfstudie: ${u(ws.studie)} u (doel ${u(ws.doel.studie)})` + (Object.keys(ws.perVak).length ? ' — ' + Object.keys(ws.perVak).map(v=>v+' '+u(ws.perVak[v])+' u').join(', ') : ''),
    `Sportschool: ${ws.sport}× (doel ${i.sportDoel})`,
    `Gamen: ${u(ws.gamen)} u (verdiend ${u(ws.verdiend)} u)`,
    `Coderen (leerlijn): ${u(ws.coderen)} u (doel ${u(i.codeerDoel)})`,
    ws.slaapGem !== null ? `Slaap: gemiddeld ${u(Math.round(ws.slaapGem*10)/10)} u per nacht (${ws.slaapN} nachten ingevuld)` + (ws.bedGem!==null ? `, gemiddeld naar bed om ${uurTekst(ws.bedGem)}` : '') : '',
    `Sjiek: ${u(ws.werk)} u deze week · ${ymNaam(wk.slice(0,7))} totaal ${u(mi.tot)} u (doel ${mi.doel})`,
    ws.les!==null ? `Lessen: ${u(ws.les)} u` : '',
    `Wat ging goed: ${refl.goed || '-'}`,
    `Wat kan beter: ${refl.beter || '-'}`,
    `Focus volgende week: ${refl.focus || '-'}`,
  ].filter(Boolean).join('\n');
}
function renderWeek(){
  const i = I(), zo = plus(wk,6), nu = vandaag();
  const ws = weekStats(wk);
  $('#title').textContent = 'Week ' + weekNr(wk);
  if (!refl || refl.week !== wk) { const r = D.reflecties.find(x=>x.week===wk) || {};
    refl = {week:wk, goed:r.goed||'', beter:r.beter||'', focus:r.focus||''}; }
  const begonnen = wk <= nu, bezig = begonnen && nu <= zo;
  const sig = [];
  if (begonnen) {
    sig.push(ws.studie >= ws.doel.studie ? ['okbox','Studiedoel gehaald.']
      : [bezig?'infobox':'alert', `Zelfstudie ${u(ws.studie)} van ${u(ws.doel.studie)} u${bezig?` — nog ${u(ws.doel.studie-ws.studie)} u te gaan`:''}.`]);
    const achter = D.vakken.filter(v => ws.doel.perVak[v.vak] && (ws.perVak[v.vak]||0) < ws.doel.perVak[v.vak]);
    if (!bezig && achter.length) sig.push(['alert', 'Achter op: ' + achter.map(v=>`${esc(v.vak)} (${u(ws.perVak[v.vak]||0)}/${u(ws.doel.perVak[v.vak])} u)`).join(', ') + '.']);
    sig.push(ws.sport >= i.sportDoel ? ['okbox','Sportdoel gehaald.']
      : [bezig?'infobox':'alert', `Sportschool ${ws.sport} van ${i.sportDoel}×${bezig?` — nog ${i.sportDoel-ws.sport} te gaan`:''}.`]);
    if (ws.gameOver < 0) sig.push(['alert', `${u(-ws.gameOver)} u meer gegamed dan verdiend.`]);
  }
  if (ws.slaapGem !== null && ws.slaapN >= 3 && ws.slaapGem < i.slaapDoel - 0.5)
    sig.push(['infobox', `Je slaapt gemiddeld ${u(Math.round(ws.slaapGem*10)/10)} u, onder je doel van ${u(i.slaapDoel)} u.`]);
  if (ws.werk > 20) sig.push(['alert', `${u(ws.werk)} u Sjiek deze week: check of studie, sport en rust niet in het gedrang komen.`]);
  if (ws.laat) sig.push(['infobox', `${ws.laat} late dienst${ws.laat>1?'en':''}: plan de ochtend erna rustig.`]);
  const dls = D.deadlines.filter(d => !d.klaar && d.datum >= wk && d.datum <= zo);
  if (dls.length) sig.push(['infobox', 'Deadlines deze week: ' + dls.map(d => esc(deadlineNaam(d)) + ' (' + dagKort(d.datum) + ')').join(', ') + '.']);
  if (ws.modus && ws.werk > 0) sig.push(['alert', `Toetsweekmodus en toch ${u(ws.werk)} u Sjiek: check of je genoeg studietijd overhoudt.`]);

  $('#main').innerHTML = `

    <div class="daynav"><button class="nb" id="wPrev" aria-label="vorige week">‹</button>
      <div class="lbl">${dagKort(wk)} – ${dagKort(zo)}</div><button class="nb" id="wNext" aria-label="volgende week">›</button></div>
    <div class="card">
      ${meter('<b>Zelfstudie</b>', ws.studie, ws.doel.studie, u(ws.studie)+' / '+u(ws.doel.studie)+' u')}
      <div style="padding-left:12px;border-left:3px solid var(--line);margin:4px 0 10px">${vakMeters(ws)}</div>
      ${meter('Sportschool', ws.sport, i.sportDoel, ws.sport+' / '+i.sportDoel+'×')}
      ${meter('Gamen (van verdiend)', ws.gamen, Math.max(ws.verdiend, 0.01), u(ws.gamen)+' / '+u(ws.verdiend)+' u', true)}
      ${meter('Coderen', ws.coderen, i.codeerDoel, u(ws.coderen)+' / '+u(i.codeerDoel)+' u')}
      <div class="row line" style="border-top:1px solid var(--line);margin-top:6px"><div class="grow">Slaap gemiddeld</div><div class="name">${ws.slaapGem===null?'–':u(Math.round(ws.slaapGem*10)/10)+' u'}</div></div>
      <div class="row line"><div class="grow">Gemiddeld naar bed</div><div class="name">${ws.bedGem===null?'–':uurTekst(ws.bedGem)}</div></div>
      <div class="row line"><div class="grow">Sjiek</div><div class="name">${u(ws.werk)} u</div></div>
      <div class="row line"><div class="grow">Lessen (agenda)</div><div class="name">${ws.les===null?'…':u(ws.les)+' u'}</div></div>
    </div>
    ${sig.map(([c,t]) => `<div class="${c}">${t}</div>`).join('')}
    <div class="card"><div class="tabelwrap"><table>
      <tr><th>Dag</th><th>Les</th><th>Studie</th><th>Game</th><th>Code</th><th>Sport</th><th>Sjiek</th><th>Slaap</th></tr>
      ${ws.dagen.map(d => `<tr data-d="${d.s}" style="cursor:pointer" class="${d.s===nu?'vandaag':''}">
        <td>${DAGEN[dt(d.s).getDay()]} ${dt(d.s).getDate()}</td><td>${d.les===null?'…':d.les?u(d.les):'–'}</td>
        <td>${d.studie?u(d.studie):'–'}</td><td>${d.gamen?u(d.gamen):'–'}</td><td>${d.coderen?u(d.coderen):'–'}</td><td>${d.sport?'✓':'–'}</td>
        <td>${d.werk?u(d.werk)+(d.laat?' ☾':''):'–'}</td><td>${d.slaap?u(d.slaap):'–'}</td></tr>`).join('')}
      <tr class="tot"><td>Totaal</td><td>${ws.les===null?'…':u(ws.les)}</td><td>${u(ws.studie)}</td><td>${u(ws.gamen)}</td><td>${u(ws.coderen)}</td><td>${ws.sport}×</td><td>${u(ws.werk)}</td>
        <td>${ws.slaapGem===null?'–':'⌀ '+u(Math.round(ws.slaapGem*10)/10)}</td></tr>
    </table></div><div class="note">Tik op een dag om hem in te vullen. ☾ = late dienst.</div></div>
    <h2>Reflectie</h2>
    <div class="card">
      <label class="f" style="margin-top:0">Wat ging goed?</label><textarea id="rGoed">${esc(refl.goed)}</textarea>
      <label class="f">Wat kan beter?</label><textarea id="rBeter">${esc(refl.beter)}</textarea>
      <label class="f">Focus volgende week</label><textarea id="rFocus">${esc(refl.focus)}</textarea>
      <div style="height:10px"></div>
      <button class="btn sec" id="rKopie">Kopieer weekoverzicht voor Claude</button>
    </div>`;
  $('#stickyHost').innerHTML = `<div class="sticky"><button class="btn" id="rOpslaan">Reflectie opslaan</button></div>`;
  $('#wPrev').onclick = () => { wk = plus(wk,-7); renderWeek(); };
  $('#wNext').onclick = () => { wk = plus(wk,7); renderWeek(); };
  document.querySelectorAll('tr[data-d]').forEach(tr => tr.onclick = () => { dag = tr.dataset.d; view = 'vandaag'; render(); window.scrollTo(0,0); });
  [['rGoed','goed'],['rBeter','beter'],['rFocus','focus']].forEach(([id,k]) => $('#'+id).oninput = e => refl[k] = e.target.value);
  $('#rKopie').onclick = async () => {

      sheet(`<h3>Weekoverzicht</h3><div class="note">Kopiëren lukte niet automatisch. Selecteer de tekst en kopieer hem zelf.</div>

    catch(e){ render(); }
  };
}

    if (!b.dataset.zeker) { b.dataset.zeker = 1; b.textContent = 'zeker?'; b.style.fontSize = '14px'; return; }
    D = await api('verwijderTentamen', b.dataset.del); render(); openInstellingen(); toast('Tentamen verwijderd');
  });
  $('#tAdd').onclick = async () => {
    const t = {datum:$('#tDatum').value, tijd:$('#tTijd').value, vak:$('#tVak').value.trim(), opmerking:$('#tOpm').value.trim()};
    if (!t.datum || !t.vak) return toast('Vul in elk geval datum en vak in');
    D = await api('bewaarTentamen', t); render(); openInstellingen(); toast('Tentamen toegevoegd ✓');
  };
}

// ================= THEMA =================
function pasThemaToe(){
  const k = opslag.get('planner-thema') || 'systeem';
  const donker = k === 'donker' || (k === 'systeem' && window.matchMedia && matchMedia('(prefers-color-scheme: dark)').matches);
  document.documentElement.dataset.thema = donker ? 'donker' : 'licht';
  const m = document.querySelector('meta[name="theme-color"]'); if (m) m.content = donker ? '#121718' : '#f1f4f2';
}
if (window.matchMedia) { try { matchMedia('(prefers-color-scheme: dark)').addEventListener('change', () => { pasThemaToe(); if (D) render(); }); } catch(e){} }
pasThemaToe();

// ================= GRAFIEKEN (eigen SVG, geen library) =================
// Kleuren: gevalideerd categorisch palet, per thema eigen stappen (licht/donker).
const PAL = { licht:['#2a78d6','#eb6834','#1baf7a','#eda100','#e87ba4','#008300','#6250d6','#e34948'],
              donker:['#3987e5','#d95926','#199e70','#c98500','#d55181','#0ca30c','#9085e9','#e66767'] };
const ZACHT = { licht:'#86b6ef', donker:'#184f95' };   // lichtere stap van dezelfde blauwe tint (gepland)
const donker = () => document.documentElement.dataset.thema === 'donker';
const kleur = n => PAL[donker() ? 'donker' : 'licht'][n];
const GRAF = {};
function mooiMax(v){ const p = Math.pow(10, Math.floor(Math.log10(v))); for (const f of [1,2,2.5,4,5,10]) if (f*p >= v) return f*p; return 10*p; }
function rond(x, y, w, h, r){ r = Math.min(r, h, w/2); if (h <= 0) return '';
  return `M${x},${y+h}V${y+r}Q${x},${y} ${x+r},${y}H${x+w-r}Q${x+w},${y} ${x+w},${y+r}V${y+h}Z`; }
function legenda(items){ return items.length < 2 && !items.some(x => x.soort) ? '' : `<div class="legenda">${items.map(x =>
  `<span><i class="${x.soort||''}" style="${x.kleur?'background:'+x.kleur:''}"></i>${esc(x.naam)}</span>`).join('')}</div>`; }
function tabel(kop, rijen){ return `<details><summary>Als tabel</summary><div class="tabelwrap"><table><tr>${kop.map(k=>`<th>${esc(k)}</th>`).join('')}</tr>
  ${rijen.map(r => `<tr>${r.map(c=>`<td>${c}</td>`).join('')}</tr>`).join('')}</table></div></details>`; }

/** Staafgrafiek (optioneel gestapeld), met streepjes (bijv. doel per week) en referentielijnen. */
function staven(id, o){
  const W = 340, H = 170, L = 28, R = 6, T = 14, B = 22, pw = W-L-R, ph = H-T-B, n = o.labels.length;
  const tot = o.labels.map((_,i) => o.series.reduce((t,s) => t + (s.waarden[i]||0), 0));
  const max = mooiMax(Math.max(1, ...tot, ...(o.refs||[]).map(r=>r.waarde), ...(o.streep ? o.streep.waarden.filter(v=>v!=null) : [])) * 1.05);
  const y = v => T + ph - v/max*ph, slot = pw/n, bw = Math.min(26, slot*0.6);
  let svg = [0, max/2, max].map(v => `<line class="grid" x1="${L}" x2="${W-R}" y1="${y(v)}" y2="${y(v)}"/><text class="ax" x="${L-5}" y="${y(v)+4}" text-anchor="end">${u(v)}</text>`).join('');
  o.labels.forEach((lab, i) => {
    const x = L + i*slot + (slot-bw)/2; let acc = 0;
    const seg = o.series.map(s => ({ s, v: s.waarden[i]||0 })).filter(z => z.v > 0);
    seg.forEach((z, k) => {
      const yb = y(acc) - (acc > 0 ? 2 : 0), yt = y(acc + z.v), h = yb - yt;       // 2px ruimte tussen segmenten
      svg += k === seg.length-1 ? `<path d="${rond(x, yt, bw, h, 4)}" fill="${z.s.kleur}"/>` : `<rect x="${x}" y="${yt}" width="${bw}" height="${Math.max(0,h)}" fill="${z.s.kleur}"/>`;
      acc += z.v;
    });
    if (o.streep && o.streep.waarden[i] != null) svg += `<line class="tick" x1="${x-3}" x2="${x+bw+3}" y1="${y(o.streep.waarden[i])}" y2="${y(o.streep.waarden[i])}"/>`;
    if (n <= 12 || i % 2 === 0) svg += `<text class="ax" x="${x+bw/2}" y="${H-6}" text-anchor="middle">${esc(lab)}</text>`;
    svg += `<rect data-i="${i}" x="${L+i*slot}" y="${T}" width="${slot}" height="${ph}" fill="transparent"/>`;
  });
  // referentielijnen; het label staat in de legenda, alleen 'inline' labels links in de grafiek
  (o.refs||[]).forEach(r => svg += `<line class="ref" x1="${L}" x2="${W-R}" y1="${y(r.waarde)}" y2="${y(r.waarde)}"/>`
    + (r.inline ? `<text class="ax" x="${L+4}" y="${y(r.waarde)-4}">${esc(r.label)}</text>` : ''));
  GRAF[id] = { n, tip: i => `<b>${esc(o.labels[i])}</b>` + o.series.map(s => `<br>${esc(s.naam)}: ${u(s.waarden[i]||0)} ${o.eenheid||''}`).join('')
    + (o.streep && o.streep.waarden[i] != null ? `<br>${esc(o.streep.naam)}: ${u(o.streep.waarden[i])} ${o.eenheid||''}` : ''), x: i => (L + (i+0.5)*slot)/W, y: i => y(tot[i])/H };
  const leg = o.series.map(s => ({naam:s.naam, kleur:s.kleur})).concat(o.streep ? [{naam:o.streep.naam, soort:'lijn'}] : [])
    .concat((o.refs||[]).length ? [{naam: o.refs.every(r=>r.inline) ? 'bonusgrenzen' : o.refs.map(r=>r.label).join(' / '), soort:'stip'}] : []);
  return `<div class="card grafiek" data-g="${id}"><div class="gt">${esc(o.titel)}</div>${o.sub?`<div class="gs">${esc(o.sub)}</div>`:''}
    ${legenda(leg)}<svg viewBox="0 0 ${W} ${H}" role="img" aria-label="${esc(o.titel)}">${svg}</svg><div class="tip"></div>
    ${tabel(['', ...o.series.map(s=>s.naam), ...(o.streep?[o.streep.naam]:[])],
      o.labels.map((l,i) => [esc(l), ...o.series.map(s => u(s.waarden[i]||0)), ...(o.streep ? [o.streep.waarden[i]==null?'–':u(o.streep.waarden[i])] : [])]))}</div>`;
}

/** Lijngrafiek met gaten waar niets is ingevuld. */
function lijn(id, o){
  const W = 340, H = 160, L = 28, R = 6, T = 14, B = 22, pw = W-L-R, ph = H-T-B, n = o.labels.length;
  const vals = o.waarden.filter(v => v != null);
  const lo = Math.max(0, Math.floor(Math.min(...vals, ...(o.refs||[]).map(r=>r.waarde)) - 1)), hi = Math.ceil(Math.max(...vals, ...(o.refs||[]).map(r=>r.waarde)) + 0.5);
  const y = v => T + ph - (v-lo)/(hi-lo)*ph, x = i => L + (n === 1 ? pw/2 : i*pw/(n-1));
  let svg = [lo, (lo+hi)/2, hi].map(v => `<line class="grid" x1="${L}" x2="${W-R}" y1="${y(v)}" y2="${y(v)}"/><text class="ax" x="${L-5}" y="${y(v)+4}" text-anchor="end">${o.fmt ? o.fmt(v) : u(Math.round(v*10)/10)}</text>`).join('');
  (o.refs||[]).forEach(r => svg += `<line class="ref" x1="${L}" x2="${W-R}" y1="${y(r.waarde)}" y2="${y(r.waarde)}"/>`);
  let pad = '', vorige = false;
  o.waarden.forEach((v, i) => { if (v == null) { vorige = false; return; } pad += (vorige ? 'L' : 'M') + x(i) + ',' + y(v); vorige = true; });
  svg += `<path d="${pad}" fill="none" stroke="${o.kleur}" stroke-width="2" stroke-linejoin="round"/>`;
  o.waarden.forEach((v, i) => { if (v != null) svg += `<circle cx="${x(i)}" cy="${y(v)}" r="4" fill="${o.kleur}" stroke="var(--card)" stroke-width="2"/>`; });
  o.labels.forEach((lab, i) => { if (i % 2 === 0 || i === n-1) svg += `<text class="ax" x="${x(i)}" y="${H-6}" text-anchor="middle">${esc(lab)}</text>`;
    svg += `<rect data-i="${i}" x="${x(i) - pw/(2*Math.max(1,n-1))}" y="${T}" width="${pw/Math.max(1,n-1)}" height="${ph}" fill="transparent"/>`; });
  const toon = v => o.fmt ? o.fmt(v) : u(v) + ' ' + (o.eenheid||'');
  GRAF[id] = { n, tip: i => `<b>${esc(o.labels[i])}</b><br>${o.waarden[i]==null ? 'niet ingevuld' : toon(o.waarden[i])}`,
               x: i => x(i)/W, y: i => (o.waarden[i]==null ? T+ph/2 : y(o.waarden[i]))/H };
  return `<div class="card grafiek" data-g="${id}"><div class="gt">${esc(o.titel)}</div>${o.sub?`<div class="gs">${esc(o.sub)}</div>`:''}
    ${(o.refs||[]).length ? legenda([{naam:o.reeks||'per nacht', kleur:o.kleur}, {naam:o.refs.map(r=>r.label).join(' / '), soort:'stip'}]) : ''}
    <svg viewBox="0 0 ${W} ${H}" role="img" aria-label="${esc(o.titel)}">${svg}</svg><div class="tip"></div>
    ${tabel(['', o.eenheid || ''], o.labels.map((l,i) => [esc(l), o.waarden[i]==null?'–':(o.fmt ? o.fmt(o.waarden[i]) : u(o.waarden[i]))]))}</div>`;
}
/** Tik of beweeg over een staaf/punt: waarde tonen. */
function grafiekTips(){
  document.querySelectorAll('.grafiek').forEach(g => {
    const info = GRAF[g.dataset.g], tip = g.querySelector('.tip'), svg = g.querySelector('svg');
    const toon = i => { const r = svg.getBoundingClientRect(), gr = g.getBoundingClientRect();
      tip.innerHTML = info.tip(i); tip.style.display = 'block';
      tip.style.left = (r.left - gr.left + info.x(i)*r.width) + 'px'; tip.style.top = (r.top - gr.top + info.y(i)*r.height - 8) + 'px'; };
    g.querySelectorAll('[data-i]').forEach(el => { el.onpointerenter = () => toon(+el.dataset.i); el.onclick = () => toon(+el.dataset.i); });
    svg.onpointerleave = () => tip.style.display = 'none';
  });
}

// ================= TRENDS =================
function weekCijfers(ma){       // zoals weekStats, maar zonder lessen op te halen
  const perVak = {}; let gamen = 0, sport = 0, coderen = 0, studie = 0;
  for (let i = 0; i < 7; i++) {
    const s = plus(ma, i), r = D.dagen.find(x => x.datum === s) || {}, st = studieOp(s);
    Object.keys(st).forEach(v => { perVak[v] = (perVak[v]||0) + st[v]; studie += st[v]; });
    gamen += r.gamen || 0; coderen += r.coderen || 0; if (r.sport) sport++;
  }
  const doel = doelen(toetsweek(ma, true));
  return { perVak, studie, gamen, sport, coderen, doel, verdiend: Math.min(doel.gameMax, studie / (I().verdienPer || 2)) };
}
let trendWeken = 8;
function renderTrends(){
  $('#title').textContent = 'Trends';
  const i = I(), nu = vandaag();
  const weken = []; for (let k = trendWeken-1; k >= 0; k--) weken.push(plus(maandag(nu), -7*k));
  const wc = weken.map(weekCijfers), lab = weken.map(ma => 'wk ' + weekNr(ma));
  // vakken: vaste volgorde = volgorde bij ⚙︎ (kleur volgt het vak, niet de rangorde); meer dan 5 → "Overig"
  const alle = D.vakken.map(v => v.vak).concat([...new Set(wc.flatMap(w => Object.keys(w.perVak)))].filter(v => !D.vakken.some(x => x.vak === v)));
  const eigen = alle.slice(0, 5), rest = alle.slice(5);
  const reeksen = eigen.map((v, k) => ({ naam: v, kleur: kleur(k), waarden: wc.map(w => w.perVak[v] || 0) }));
  if (rest.length) reeksen.push({ naam: 'Overig', kleur: kleur(7), waarden: wc.map(w => rest.reduce((t,v) => t + (w.perVak[v]||0), 0)) });
  // Sjiek per maand: laatste 6 maanden + volgende
  const mnd = []; for (let k = -5; k <= 1; k++) mnd.push(ymPlus(nu.slice(0,7), k));
  const mi = mnd.map(maandInfo);
  // slaap: laatste 14 nachten
  const nachten = []; for (let k = 13; k >= 0; k--) nachten.push(plus(nu, -k));
  const slaap = nachten.map(s => { const r = D.dagen.find(x => x.datum === s); return r && r.slaap ? r.slaap : null; });
  const bed = nachten.map(s => { const r = D.dagen.find(x => x.datum === s); return r && r.bedtijd ? bedUur(r.bedtijd) : null; });
  const leeg = !wc.some(w => w.studie || w.gamen || w.sport || w.coderen);
  $('#main').innerHTML = `
    <div class="seg" style="margin:10px 0">${[4,8,12].map(n => `<button data-tw="${n}" class="${n===trendWeken?'on':''}">${n} weken</button>`).join('')}</div>
    ${leeg ? '<div class="infobox">Nog weinig ingevuld. De grafieken vullen zich vanzelf als je je dagen invult.</div>' : ''}
    ${staven('studie', { titel: 'Zelfstudie per week', sub: 'Per vak · streepje = je weekdoel (hoger in toetsweekmodus)', labels: lab, series: reeksen, eenheid: 'u',
       streep: { naam: 'doel', waarden: wc.map(w => w.doel.studie) } })}
    ${staven('gamen', { titel: 'Gamen per week', sub: 'Streepje = verdiende gametijd', labels: lab, eenheid: 'u',
       series: [{ naam: 'gegamed', kleur: kleur(1), waarden: wc.map(w => w.gamen) }], streep: { naam: 'verdiend', waarden: wc.map(w => w.verdiend) } })}
    ${staven('sport', { titel: 'Sportschool per week', labels: lab, eenheid: '×',
       series: [{ naam: 'keer', kleur: kleur(2), waarden: wc.map(w => w.sport) }], refs: [{ waarde: i.sportDoel, label: 'doel ' + i.sportDoel + '×' }] })}
    ${staven('coderen', { titel: 'Coderen per week', labels: lab, eenheid: 'u',
       series: [{ naam: 'uren', kleur: kleur(6), waarden: wc.map(w => w.coderen) }], refs: [{ waarde: i.codeerDoel, label: 'doel ' + u(i.codeerDoel) + ' u' }] })}
    ${slaap.some(v => v != null) ? lijn('slaap', { titel: 'Slaap per nacht', sub: 'Laatste 14 nachten', labels: nachten.map(s => String(dt(s).getDate())),
       waarden: slaap, eenheid: 'u', kleur: kleur(0), refs: [{ waarde: i.slaapDoel, label: 'doel ' + u(i.slaapDoel) + ' u' }] })
       : '<div class="card"><div class="gt">Slaap per nacht</div><div class="note">Nog niets ingevuld. Vul bij Vandaag in hoe laat je naar bed ging en wakker werd.</div></div>'}
    ${bed.some(v => v != null) ? lijn('bed', { titel: 'Hoe laat naar bed', sub: 'Laatste 14 nachten (datum = de ochtend erna)', labels: nachten.map(s => String(dt(s).getDate())),
       waarden: bed, kleur: kleur(6), fmt: uurTekst }) : ''}
    ${staven('sjiek', { titel: 'Sjiek-uren per maand', sub: 'Netto, na pauze', labels: mnd.map(m => MAANDEN[Number(m.slice(5))-1]), eenheid: 'u',
       series: [{ naam: 'gewerkt', kleur: kleur(0), waarden: mi.map(x => x.gew) }, { naam: 'gepland', kleur: ZACHT[donker()?'donker':'licht'], waarden: mi.map(x => x.tot - x.gew) }],
       refs: [{ waarde: i.grens1, label: String(i.grens1), inline: true }, { waarde: i.grens2, label: String(i.grens2), inline: true }] })}`;
  document.querySelectorAll('[data-tw]').forEach(b => b.onclick = () => { trendWeken = +b.dataset.tw; renderTrends(); });
  grafiekTips();
}

// ================= sheet (pop-up van onderen) =================
function sheet(html){
  $('#sheetHost').innerHTML = `<div class="sheet-bg"><div class="sheet">${html}</div></div>`;
  $('.sheet-bg').onclick = e => { if (e.target.classList.contains('sheet-bg')) closeSheet(); };

function closeSheet(){ $('#sheetHost').innerHTML = ''; }

// ================= start =================
/** Haalt nieuwe/gewijzigde diensten uit je Sjiek-agenda (op de achtergrond). */
function sjiekSync(melden){
  if (I().sjiekImport !== 'aan') return;
  api('synchroniseerSjiek').then(d => {
    const n = d.sjiekInfo ? d.sjiekInfo.wijzigingen : 0;
    D = d; inv = null;
    if (!document.querySelector('.sheet-bg')) render();
    if (melden && n) toast(n + (n===1?' dienst':' diensten') + ' bijgewerkt uit je Sjiek-agenda');
  }).catch(()=>{});
}
function koppelScherm(fout){
  const l = $('#loading'); if (l) l.remove();
  document.querySelector('nav').style.display = 'none';
  $('#title').textContent = 'Planner koppelen';
  $('#main').innerHTML = `<div class="setup"><div class="card">
    <div class="note" style="margin-top:0">Eenmalig: koppel de app aan je Google Sheet. Beide gegevens staan in je Apps Script (zie de uitleg).</div>
    <label class="f">Web-app-URL (eindigt op /exec)</label><input id="kUrl" placeholder="https://script.google.com/macros/s/…/exec" autocomplete="off">
    <label class="f">Geheime sleutel</label><input id="kSleutel" autocomplete="off">
    ${fout ? `<div class="alert">${esc(fout)}</div>` : ''}
    <div style="height:12px"></div><button class="btn" id="kOk">Koppelen</button></div></div>`;
  $('#kOk').onclick = async () => {
    const cfg = {url: $('#kUrl').value.trim(), sleutel: $('#kSleutel').value.trim()};
    if (!/^https:\/\/script\.google\.com\/.+\/exec$/.test(cfg.url)) return toast('Die URL klopt niet: hij moet eindigen op /exec');
    if (!cfg.sleutel) return toast('Vul de sleutel in');
    const b = $('#kOk'); b.disabled = true; b.textContent = 'Controleren…';
    try { const d = await roep('haalAlles', [], cfg); opslag.set(CFG_KEY, cfg); opslag.set(CACHE_KEY, d); location.reload(); }
    catch(e){ koppelScherm(/sleutel/i.test(e.message) ? 'De sleutel klopt niet.' : 'Koppelen lukte niet: ' + e.message); }
  };
}
function start(){
  if (!IN_GOOGLE && !opslag.get(CFG_KEY)) return koppelScherm();
  const cache = IN_GOOGLE ? null : opslag.get(CACHE_KEY);
  if (cache) { D = cache; $('#loading').remove(); render(); }      // direct de laatste stand tonen
  api('haalAlles').then(d => {
    D = d; inv = null; const l = $('#loading'); if (l) l.remove();
    if (!document.querySelector('.sheet-bg')) render();
    sjiekSync(true);
    verstuurWachtrij();
  }).catch(() => { const l = $('#loading');
    if (l) l.textContent = 'Laden lukte niet. Ververs de pagina.';
    else toast('Geen verbinding: je ziet de laatste stand. Invullen kan gewoon.'); });
}
start();
if (!IN_GOOGLE && 'serviceWorker' in navigator && location.protocol === 'https:')
  navigator.serviceWorker.register('sw.js').catch(()=>{});
