<!DOCTYPE html>
<html lang="nl">
<head>
<title>Planner</title>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#f1f4f2">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Planner">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<style>
  :root{
    --bg:#f1f4f2; --card:#fff; --ink:#1e2a2c; --muted:#6a787b; --line:#dde4e1;
    --accent:#2c6e6a; --accent-soft:#d9ebe8; --plan:#9cc7c2;
    --ok:#2f7a4f; --ok-soft:#dbefe2; --warn:#b4432f; --warn-soft:#f6ddd7;
    --info:#355f8c; --info-soft:#dde8f4; --radius:14px;
    --field:#fff; --soft:#e3e9e7; --track:#e6ecea; --hl:#f3f8f7; --on-accent:#fff; --game:#6b4fb3; --extra:#c0587e;
    color-scheme: light;
  }
  /* Donker thema: eigen stappen, geen automatische omkering */
  html[data-thema="donker"]{
    --bg:#121718; --card:#1a2123; --ink:#e6edeb; --muted:#97a6a8; --line:#2b3537;
    --accent:#5fb3ad; --accent-soft:#1d3634; --plan:#2f5c58;
    --ok:#5cc489; --ok-soft:#163325; --warn:#f08a76; --warn-soft:#3b201b;
    --info:#93b9e6; --info-soft:#1a2939;
    --field:#222b2d; --soft:#283234; --track:#2c373a; --hl:#1f2c2b; --on-accent:#0d1716; --game:#a996ef; --extra:#ef8fb3;
    color-scheme: dark;
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html,body{margin:0;background:var(--bg);color:var(--ink);
    font:17px/1.4 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif}
  header{position:sticky;top:0;z-index:5;background:var(--bg);padding:calc(14px + env(safe-area-inset-top)) 16px 8px;
    display:flex;align-items:center;justify-content:space-between}
  header h1{font-size:24px;margin:0;font-weight:700;letter-spacing:-.01em}
  main{padding:0 14px 150px;max-width:680px;margin:0 auto}
  nav{position:fixed;bottom:0;left:0;right:0;z-index:6;background:var(--card);border-top:1px solid var(--line);
    display:flex;padding-bottom:env(safe-area-inset-bottom)}
  nav button{flex:1;border:0;background:none;padding:10px 0 12px;font:inherit;font-size:13px;color:var(--muted);
    display:flex;flex-direction:column;align-items:center;gap:2px;cursor:pointer}
  nav button .i{font-size:22px;line-height:1}
  nav button.on{color:var(--accent);font-weight:600}
  .card{background:var(--card);border:1px solid var(--line);border-radius:var(--radius);padding:14px;margin:10px 0}
  .row{display:flex;gap:10px;align-items:center}
  .grow{flex:1;min-width:0}
  .line{padding:8px 0;border-bottom:1px solid var(--line)}
  .line:last-of-type{border-bottom:0}
  label.f{display:block;font-size:14px;color:var(--muted);margin:10px 0 4px}
  input,select,textarea{width:100%;font:inherit;padding:11px 12px;border:1px solid var(--line);border-radius:10px;
    background:var(--field);color:var(--ink);appearance:none;-webkit-appearance:none}
  textarea{min-height:70px;resize:vertical}
  .btn{border:0;border-radius:12px;padding:13px 16px;font:inherit;font-weight:600;background:var(--accent);color:var(--on-accent);width:100%;cursor:pointer}
  .btn.sec{background:var(--accent-soft);color:var(--accent)}
  .btn.ghost{background:none;color:var(--muted);font-weight:500}
  .btn.danger{background:var(--warn-soft);color:var(--warn)}
  .btn.small{width:auto;padding:7px 11px;font-size:14px}
  .sticky{position:fixed;left:0;right:0;bottom:calc(64px + env(safe-area-inset-bottom));padding:10px 14px;
    background:linear-gradient(transparent,var(--bg) 30%);z-index:4}
  .autostatus{font-weight:400;margin-left:6px}
  .autostatus.fout{color:#c0392b;text-decoration:underline;cursor:pointer}
  .sticky .btn{max-width:652px;margin:0 auto;display:block;box-shadow:0 4px 14px rgba(44,110,106,.3)}
  h2{font-size:15px;text-transform:uppercase;letter-spacing:.06em;color:var(--muted);margin:22px 4px 6px;font-weight:600}
  .name{font-weight:600}
  .sub{font-size:14px;color:var(--muted)}
  .note{font-size:14px;color:var(--muted);margin:6px 2px}
  .empty{color:var(--muted);text-align:center;padding:16px 8px}
  .badge{font-size:13px;padding:3px 9px;border-radius:99px;background:var(--ok-soft);color:var(--ok);white-space:nowrap;font-weight:600}
  .badge.none{background:var(--soft);color:var(--muted);font-weight:500}
  .list-item{display:flex;align-items:center;gap:10px;padding:12px 2px;border-bottom:1px solid var(--line);cursor:pointer}
  .list-item:last-child{border-bottom:0}
  .big{font-size:38px;font-weight:700;letter-spacing:-.02em;font-variant-numeric:tabular-nums;line-height:1.1}
  .unit{font-size:15px;font-weight:500;color:var(--muted);margin-left:4px;letter-spacing:0}
  .seg{display:flex;background:var(--soft);border-radius:11px;padding:3px;gap:3px}
  .seg button{flex:1;border:0;background:none;border-radius:9px;padding:9px 4px;font:inherit;font-size:15px;color:var(--muted);cursor:pointer}
  .seg button.on{background:var(--field);color:var(--ink);font-weight:600;box-shadow:0 1px 3px rgba(0,0,0,.08)}
  .seg.small button{padding:6px 14px}
  .alert,.okbox,.infobox{border-radius:12px;padding:10px 12px;font-size:15px;margin:10px 0}
  .alert{background:var(--warn-soft);color:var(--warn)}
  .okbox{background:var(--ok-soft);color:var(--ok)}
  .infobox{background:var(--info-soft);color:var(--info)}
  .daynav{display:flex;gap:8px;align-items:center;margin:6px 0}
  .nb{border:1px solid var(--line);background:var(--field);border-radius:10px;width:46px;height:46px;font-size:22px;color:var(--ink);flex:none;cursor:pointer}
  .daynav .lbl{flex:1;text-align:center;font-weight:600}
  .step{display:flex;align-items:center;gap:6px}
  .step button{width:40px;height:40px;border-radius:50%;border:1px solid var(--line);background:var(--field);font-size:22px;color:var(--accent);cursor:pointer}
  .sv{min-width:62px;text-align:center;font-weight:600;font-variant-numeric:tabular-nums}
  .ag{display:flex;gap:10px;padding:7px 0;border-bottom:1px solid var(--line);align-items:baseline}
  .ag:last-child{border-bottom:0}
  .ag .tijd{font-variant-numeric:tabular-nums;color:var(--muted);font-size:15px;min-width:96px}
  .ag.werk .grow{color:var(--accent);font-weight:600}
  .count{display:flex;align-items:center;gap:10px}
  .m{margin:10px 0}
  .mv{font-size:15px;font-variant-numeric:tabular-nums}
  .meter{height:9px;background:var(--track);border-radius:99px;overflow:hidden;margin-top:5px}
  .meter i{display:block;height:100%;background:var(--accent);border-radius:99px}
  .meter.good i{background:var(--ok)}
  .meter.bad i{background:var(--warn)}
  .track{position:relative;height:22px;background:var(--track);border-radius:8px;margin:34px 0 8px}
  .track i{position:absolute;top:0;bottom:0;left:0}
  .track i.gew{background:var(--accent);border-radius:8px 0 0 8px}
  .track i.gep{background:var(--plan)}
  .mark{position:absolute;top:-6px;bottom:-6px;width:2px;background:var(--ink);transform:translateX(-1px)}
  .mark b{position:absolute;bottom:100%;left:50%;transform:translateX(-50%);font-size:12px;white-space:nowrap;margin-bottom:2px}
  .mark.doel{background:var(--warn)}
  .mark.doel b{color:var(--warn)}
  .legend{display:flex;gap:14px;font-size:14px;color:var(--muted);flex-wrap:wrap}
  .legend span::before{content:"";display:inline-block;width:10px;height:10px;border-radius:3px;margin-right:5px;background:var(--accent)}
  .legend span.p::before{background:var(--plan)}
  table{width:100%;border-collapse:collapse;font-size:14px;font-variant-numeric:tabular-nums}
  th,td{text-align:right;padding:8px 3px;border-bottom:1px solid var(--line);white-space:nowrap}
  th:first-child,td:first-child{text-align:left}
  th{font-size:12px;color:var(--muted);font-weight:600}
  tr.tot td{font-weight:700;border-bottom:0}
  tr.vandaag td{background:var(--hl)}
  .mini{height:8px;background:var(--track);border-radius:99px;overflow:hidden;width:70px;display:inline-block;vertical-align:middle}
  .mini i{display:block;height:100%;background:var(--accent)}
  .sheet-bg{position:fixed;inset:0;background:rgba(30,42,44,.35);z-index:20;display:flex;align-items:flex-end}
  .sheet{background:var(--bg);width:100%;max-height:92vh;overflow:auto;border-radius:20px 20px 0 0;
    padding:18px 16px calc(20px + env(safe-area-inset-bottom));max-width:680px;margin:0 auto}
  .sheet h3{margin:0 0 6px;font-size:21px}
  /* kop die bovenaan blijft staan tijdens het scrollen (instellingen), met een sluitknop */
  .sheet-kop{position:sticky;top:-18px;z-index:3;background:var(--bg);display:flex;align-items:flex-start;gap:10px;
    margin:-18px -16px 6px;padding:14px 16px 8px;border-bottom:1px solid var(--line)}
  .sheet-kop .x{font-size:28px;line-height:1;color:var(--muted);padding:2px 8px;flex:none}
  .inst-groep{font-size:17px;font-weight:700;margin:22px 2px 0;padding-bottom:4px;border-bottom:2px solid var(--accent-soft)}
  .inst-kol > .inst-groep:first-child{margin-top:8px}
  .exrow{padding:8px 0;border-bottom:1px solid var(--line)}
  .exrow:last-child{border-bottom:0}
  /* pc: instellingen breed, in drie kolommen (School | Werk en agenda's | Jij en de app) */
  @media (min-width: 900px){
    .sheet.breed-sheet{max-width:min(1500px, 96vw);border-radius:20px 20px 0 0}
    .inst-grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:22px;align-items:start}
  }
  @media (min-width: 900px) and (max-width: 1299px){ .inst-grid{grid-template-columns:repeat(2,minmax(0,1fr))} }
  .dlkop{background:none;border:0;padding:0;font:inherit;color:inherit;letter-spacing:inherit;text-transform:inherit;cursor:pointer}
  .dlmeer{display:block;width:100%;text-align:left;padding:8px 0 2px;white-space:normal}
  .toast.actie{display:flex;align-items:center;gap:12px;pointer-events:auto}
  .toastknop{background:none;border:0;color:inherit;font:inherit;font-weight:700;text-decoration:underline;padding:6px 2px;cursor:pointer}
  .toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(140px + env(safe-area-inset-bottom));
    background:var(--ink);color:var(--bg);padding:11px 18px;border-radius:12px;z-index:30;font-size:15px;max-width:90vw}
  .loading{position:fixed;inset:0;display:grid;place-items:center;color:var(--muted);background:var(--bg);z-index:50}
  .gear{border:0;background:none;font-size:24px;color:var(--muted);padding:4px;cursor:pointer}
  details summary{list-style:none;cursor:pointer;color:var(--accent);font-weight:600;padding:12px 4px}
  details summary::-webkit-details-marker{display:none}
  .chips{display:flex;gap:6px;flex-wrap:wrap}
  .chip{border:1px solid var(--line);background:var(--field);border-radius:99px;padding:8px 13px;font:inherit;font-size:15px;color:var(--accent);cursor:pointer}
  .chip.game{color:var(--game)}
  .big.neg{color:var(--warn)}
  .timer{border-color:var(--accent);background:var(--hl)}
  /* knoppen voelen ingedrukt aan; .bezig = wacht nog op de server */
  .btn,.chip,.nb,.step button,.vink,.seg button{transition:transform .08s ease,opacity .15s}
  .btn:active,.chip:active,.nb:active,.step button:active,.vink:active,.seg button:active{transform:scale(.94)}
  .bezig{opacity:.55;pointer-events:none}
  .timer.pauze{border-style:dashed}
  .timer.pauze #tKlok{animation:knipper 1.4s ease-in-out infinite}
  @keyframes knipper{50%{opacity:.35}}
  .vakrow input{width:auto}
  .list-item.vervallen .name{text-decoration:line-through;color:var(--muted)}
  .badge.warn{background:var(--warn-soft);color:var(--warn)}
  .dl{display:flex;gap:10px;align-items:center;padding:9px 0;border-bottom:1px solid var(--line)}
  .dl:last-child{border-bottom:0}
  .dl .wanneer{font-size:13px;font-weight:600;white-space:nowrap}
  .dl.urgent .wanneer{color:var(--warn)}
  .vink{width:34px;height:34px;border-radius:50%;border:2px solid var(--line);background:var(--field);flex:none;cursor:pointer;color:var(--ok);font-size:17px}
  .setup{max-width:520px;margin:40px auto;padding:0 16px}
  .chip.code{color:var(--info)}
  .tabelwrap{overflow-x:auto}
  .grafiek{position:relative}
  .grafiek svg{display:block;width:100%;height:auto;overflow:visible}
  .grafiek .gt{font-weight:600;margin-bottom:2px}
  .grafiek .gs{font-size:13px;color:var(--muted);margin-bottom:6px}
  .grafiek .ax{font-size:11px;fill:var(--muted)}
  .grafiek .grid{stroke:var(--line);stroke-width:1}
  .grafiek .ref{stroke:var(--muted);stroke-width:1.5;stroke-dasharray:4 4}
  .grafiek .tick{stroke:var(--ink);stroke-width:2;stroke-linecap:round}
  .grafiek [data-i]{cursor:pointer}
  .legenda{display:flex;flex-wrap:wrap;gap:4px 12px;font-size:13px;color:var(--muted);margin:2px 0 6px}
  .legenda span{display:inline-flex;align-items:center;gap:5px}
  .legenda i{width:10px;height:10px;border-radius:3px;display:inline-block}
  .legenda i.lijn{height:0;border-top:2px solid var(--ink);border-radius:0;width:12px}
  .legenda i.stip{height:0;border-top:2px dashed var(--muted);border-radius:0;width:12px}
  .tip{position:absolute;pointer-events:none;background:var(--ink);color:var(--bg);font-size:13px;padding:6px 9px;border-radius:8px;
    white-space:nowrap;transform:translate(-50%,-100%);display:none;z-index:3;line-height:1.35}
  input.tijd{font-variant-numeric:tabular-nums;text-align:center;cursor:pointer}
  input.tijd::placeholder, input.datum::placeholder{color:var(--muted);opacity:.7;letter-spacing:.08em}
  .kiezer-bg{position:fixed;inset:0;background:rgba(0,0,0,.35);z-index:40;display:flex;align-items:flex-end}
  .kiezer{background:var(--bg);width:100%;max-width:680px;margin:0 auto;border-radius:20px 20px 0 0;
    padding:16px 16px calc(16px + env(safe-area-inset-bottom))}
  .kiezer .kop{display:flex;align-items:baseline;justify-content:space-between;margin-bottom:6px}
  .kiezer .groot{font-size:34px;font-weight:700;font-variant-numeric:tabular-nums;letter-spacing:-.01em}
  .kiezer .groot span{display:inline-block;min-width:1.25em;text-align:center;border-bottom:3px solid transparent;cursor:pointer}
  .kiezer .groot span.leeg{color:var(--muted);opacity:.5}
  .kiezer .groot span.actief{border-bottom-color:var(--accent)}
  .kiezer .rooster.m60{grid-template-columns:repeat(10,1fr);gap:4px}
  .kiezer .rooster.m60 button{padding:8px 0;font-size:14px}
  .kiezer .rooster{display:grid;gap:6px;margin:8px 0 12px}
  .kiezer .rooster.u{grid-template-columns:repeat(6,1fr)}
  .kiezer .rooster.m{grid-template-columns:repeat(6,1fr)}
  .kiezer .rooster button{border:1px solid var(--line);background:var(--field);color:var(--ink);border-radius:10px;padding:11px 0;
    font:inherit;font-size:16px;font-variant-numeric:tabular-nums;cursor:pointer}
  .kiezer .rooster button.on{background:var(--accent);border-color:var(--accent);color:var(--on-accent);font-weight:600}
  .kiezer .lbl{font-size:13px;color:var(--muted);text-transform:uppercase;letter-spacing:.06em}
  .datumveld{display:flex;gap:6px;align-items:stretch;position:relative;min-width:0}
  .datumveld input.datum{flex:1;min-width:0;font-variant-numeric:tabular-nums}
  .datumveld input.datum.fout{border-color:var(--warn);background:var(--warn-soft)}
  .datumveld .kal{flex:none;width:46px;border:1px solid var(--line);border-radius:10px;background:var(--field);color:var(--ink);font-size:18px;cursor:pointer}
  .datumveld input.native{position:absolute;right:0;bottom:0;width:46px;height:100%;opacity:0;pointer-events:none}
  input.tijd.fout{border-color:var(--warn);background:var(--warn-soft)}
  .x{border:0;background:none;color:var(--warn);font-size:20px;padding:4px 8px;cursor:pointer}
  /* ===== Indeling (vaste kolommen) ===== */
  .vkaarten{display:grid;column-gap:16px;align-items:start}
  .vkol{min-width:0;min-height:40px}
  .vblok{min-width:0;margin-bottom:12px}
  .vblok > .vinhoud > :first-child{margin-top:0}
  .vblok > .vinhoud > h2:first-child{margin-top:8px}
  .kopplek{visibility:hidden}                       /* onzichtbaar kopje, zodat de bovenste kaarten op één lijn beginnen */
  .vblok.uit,.vblok.leeg{display:none}
  .vkaarten.indelen{align-items:stretch}               /* tijdens indelen: kolommen even hoog, zodat je overal in een kolom kunt loslaten */
  .vkaarten.indelen .vkol{min-height:160px;border-radius:12px;background:var(--soft);padding:6px 6px 60px}
  .vkaarten.indelen .vblok{display:block;outline:2px dashed var(--line);outline-offset:3px;border-radius:12px;cursor:grab}
  .vkaarten.indelen .vblok.uit{opacity:.4}
  .vkaarten.indelen .vblok.sleept{opacity:.25}
  .vkaarten.indelen .vinhoud{pointer-events:none}
  .blokbalk{display:flex;align-items:center;gap:4px;margin:4px 0 2px;font-size:13px}
  .blokbalk .greep{cursor:grab;padding:0 6px 0 2px;color:var(--muted);font-size:16px}
  .blokbalk .bnaam{flex:1;color:var(--muted);font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .indelbalk{position:sticky;top:60px;z-index:4}
  /* ===== Maandrooster ===== */
  .md{display:grid;grid-template-columns:30px repeat(7,minmax(0,1fr));gap:4px}
  .mdkop{font-size:12px;color:var(--muted);text-align:center;padding:2px 0;font-weight:600;text-transform:uppercase}
  .mdwk{font-size:11px;color:var(--muted);padding-top:6px;text-align:right;padding-right:4px}
  .mdcel{background:var(--card);border:1px solid var(--line);border-radius:10px;min-height:118px;padding:4px 5px;cursor:pointer;min-width:0;overflow:hidden}
  .mdcel:hover{border-color:var(--accent)}
  .mdcel.weekend{background:var(--hl)}
  .mdcel.anders{opacity:.45}
  .mdcel.vandaag{outline:2px solid var(--accent);outline-offset:-1px}
  .mdnr{font-size:13px;font-weight:700;margin-bottom:2px}
  .mditem{display:flex;gap:4px;font-size:12px;line-height:1.3;margin-top:2px;border-radius:5px;padding:1px 4px;background:var(--soft);min-width:0}
  .mditem .mdtekst{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .mditem.periode{background:var(--ok-soft)} .mditem.tentamen{background:var(--info-soft)} .mditem.deadline{background:var(--warn-soft)}
  .mditem.werk{background:var(--accent-soft)} .mditem.klaar .mdtekst{text-decoration:line-through;color:var(--muted)}
  .mditem.blokken,.mditem.meer{background:transparent;color:var(--muted)}
  /* telefoon: vakjes klein, alleen de pictogrammen */
  @media (max-width: 899px){
    .md{grid-template-columns:18px repeat(7,minmax(0,1fr));gap:2px}
    .mdcel{min-height:64px;padding:3px}
    .mditem{display:inline-flex;padding:0;background:transparent !important;margin:0}
    .mditem .mdtekst,.mditem.blokken,.mditem.meer{display:none}
  }
  /* ===== Rooster ===== */
  /* breed scherm: het weekrooster gebruikt maximaal 95% van de breedte; de andere schermen (kaarten naast elkaar)
     maximaal 1600 pixels, dat zijn drie kolommen. De datum/week-navigatie blijft compact in het midden. */
  main.breed{max-width:95%;padding-left:0;padding-right:0}
  main.midden{max-width:1600px}
  main.breed > .daynav, main.midden > .daynav, main.breed .rooster-hoofd > .daynav{max-width:900px;margin-left:auto;margin-right:auto}
  .rooster-zij h2:first-child{margin-top:6px}
  /* to-do onder het rooster, zoals onderaan een Passion Planner-week: breed scherm Studie-to-do | Persoonlijke to-do
     naast elkaar, smal (telefoon) onder elkaar */
  .rooster-zij{margin-top:14px}
  .todo-sub{font-size:13px;font-weight:700;color:var(--muted);text-transform:uppercase;letter-spacing:.04em;margin:10px 0 2px}
  .todo-sub:first-child{margin-top:0}
  @media (min-width: 900px){
    .rooster-zij{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:18px;align-items:start}
  }
  .wk{display:grid;grid-template-columns:46px repeat(7,minmax(0,1fr));background:var(--card);border:1px solid var(--line);
    border-radius:var(--radius);overflow:hidden}
  .wkkop{padding:6px 5px;border-left:1px solid var(--line);border-bottom:1px solid var(--line);font-size:14px;cursor:pointer;min-width:0}
  .wkkop.leeg{border-left:0;cursor:default}
  .wkkop.vandaag,.dagkol.vandaag{background:var(--hl)}

<script>
// ================= versie =================
// Verhoog bij elke wijziging (jjjj.mm.dd, eventueel met -2, -3 als er op één dag meer updates zijn).
const APP_VERSIE = '2026.11.25-25';
const SERVER_MIN = '2026.11.25-9';   // deze app verwacht minstens deze Code.gs-versie (rooster, lessen verbergen, extra agenda, gat tussen lessen, reistijd, taken na vaste tijd, basisweek)

// ================= data & helpers =================
let D = null;          // alle gegevens uit de spreadsheet
let view = 'vandaag';
const DAGEN = ['zo','ma','di','wo','do','vr','za'];
const DAGEN_LANG = ['zondag','maandag','dinsdag','woensdag','donderdag','vrijdag','zaterdag'];
const MAANDEN = ['jan','feb','mrt','apr','mei','jun','jul','aug','sep','okt','nov','dec'];
const MAANDEN_LANG = ['januari','februari','maart','april','mei','juni','juli','augustus','september','oktober','november','december'];
const $ = s => document.querySelector(s);
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const pad = n => String(n).padStart(2,'0');
const fmt = d => d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate());
const vandaag = () => fmt(new Date());
const dt = s => new Date(s+'T12:00:00');
const plus = (s,n) => { const d=dt(s); d.setDate(d.getDate()+n); return fmt(d); };
const maandag = s => plus(s, -((dt(s).getDay()+6)%7));
const weekNr = s => { const d=dt(s); d.setDate(d.getDate()+3-((d.getDay()+6)%7)); const j=new Date(d.getFullYear(),0,4,12);
  return 1+Math.round(((d-j)/864e5-3+((j.getDay()+6)%7))/7); };
const dagKort = s => { const d=dt(s); return DAGEN[d.getDay()]+' '+d.getDate()+' '+MAANDEN[d.getMonth()]; };
const dagenTot = (van,tot) => Math.round((dt(tot)-dt(van))/864e5);
const u = n => (Math.round(n*100)/100).toLocaleString('nl-NL',{maximumFractionDigits:2});
const euro = n => '€ '+Math.round(n).toLocaleString('nl-NL');
const euroC = n => '€ '+n.toLocaleString('nl-NL',{minimumFractionDigits:2,maximumFractionDigits:2});
const num = s => Number(String(s).replace(',','.'));
const hhmm = m => { m = ((Math.round(m) % 1440) + 1440) % 1440; return pad(Math.floor(m / 60)) + ':' + pad(m % 60); };
const mins = t => { const [h,m]=String(t||'0:0').split(':').map(Number); return (h||0)*60+(m||0); };
const ymPlus = (ym,n) => { let [y,m]=ym.split('-').map(Number); m+=n; while(m>12){m-=12;y++;} while(m<1){m+=12;y--;} return y+'-'+pad(m); };
const ymNaam = ym => { const [y,m]=ym.split('-').map(Number); return MAANDEN_LANG[m-1]+' '+y; };
const I = () => D.instellingen;
/** Naam van je werk zoals je hem bij ⚙︎ invult (staat alleen in je eigen sheet, niet in de code). */
const W = () => (D && D.instellingen && D.instellingen.werkNaam) || 'Werk';

function brutoU(d){ let b=mins(d.begin), e=mins(d.eind); if (e<=b) e+=1440; return (e-b)/60; }
function nettoU(d){ return Math.max(0, brutoU(d)-(Number(d.pauze)||0)/60); }
function isLaat(d){ const b=mins(d.begin), e=mins(d.eind); return e<=b || e>=23*60; }
function stdPauze(br){ return br > I().pauzeVanaf ? I().pauzeMin : 0; }
const telt = x => x.status !== 'vervallen';
function dienstenOp(s){ return D.diensten.filter(x=>x.datum===s && telt(x)).sort((a,b)=>a.begin.localeCompare(b.begin)); }
function tarief(uren){ const i=I(); return uren>=i.grens2 ? i.loon2 : uren>=i.grens1 ? i.loon1 : i.loonBasis; }
function maandInfo(ym){
  const ds = D.diensten.filter(x=>x.datum.startsWith(ym+'-') && telt(x));
  const tot = ds.reduce((t,x)=>t+nettoU(x),0);
  const gew = ds.filter(x=>x.status==='gewerkt').reduce((t,x)=>t+nettoU(x),0);
  const g = D.maanddoelen.find(m=>m.maand===ym);
  const bruto = ds.reduce((t,x)=>t+nettoU(x)*(x.toeslag||100)/100,0) * tarief(tot);
  // geen eigen doel voor deze maand: standaard maanddoel + extra uren in vakantieweken (⚙︎ → Vakanties)
  const extra = g ? 0 : Math.round(werkExtra(ym));
  return { ds, tot, gew, doel: g?g.doel:I().maandDoel + extra, extra, minimum: g?g.minimum:I().maandMinimum, bruto, tarief: tarief(tot) };
}
function grensTekst(uren){
  const i=I();
  for (const g of [i.grens1, i.grens2]) if (g > 0 && uren<g && g-uren<=3)
    return `<div class="alert">Net onder de ${g}-grens: nog ${u(g-uren)} u en je krijgt een hoger uurloon over álle uren.</div>`;
  return '';
}
/** Komende tentamens vanaf een datum, op volgorde. Vandaag telt een tentamen niet meer mee zodra de begintijd voorbij is. */
function komendeTentamens(vanaf){
  const nu = new Date(), nuMin = nu.getHours()*60 + nu.getMinutes();
  const voorbij = t => t.datum === vandaag() && t.tijd && mins(t.tijd) <= nuMin;
  return D.tentamens.filter(t => t.datum >= vanaf && !voorbij(t)).sort((a,b)=>(a.datum+a.tijd).localeCompare(b.datum+b.tijd));
}
function volgendTentamen(vanaf){ return komendeTentamens(vanaf)[0]; }

// Werkt op twee manieren: binnen Google (google.script.run) of als losse app (fetch met geheime sleutel).
const IN_GOOGLE = !!(window.google && google.script && google.script.run);
const CFG_KEY = 'planner-koppeling', CACHE_KEY = 'planner-cache';
const opslag = { get(k){ try { return JSON.parse(localStorage.getItem(k)); } catch(e){ return null; } },
                 set(k,v){ try { localStorage.setItem(k, JSON.stringify(v)); } catch(e){} },
                 weg(k){ try { localStorage.removeItem(k); } catch(e){} } };
function roep(fn, args, cfg){
  if (IN_GOOGLE) return new Promise((res, rej) => google.script.run.withSuccessHandler(res).withFailureHandler(rej)[fn](...args));
  cfg = cfg || opslag.get(CFG_KEY);
  if (!cfg) return Promise.reject(new Error('Niet gekoppeld'));
  return fetch(cfg.url, { method:'POST', headers:{'Content-Type':'text/plain;charset=utf-8'},
                          body: JSON.stringify({sleutel: cfg.sleutel, fn, args}) })
    .then(r => r.json()).then(j => { if (!j.ok) throw new Error(j.fout || 'Onbekende fout'); return j.data; });
}
// Offline: deze schrijfacties worden bewaard en later verstuurd als er geen verbinding is.
const OFFLINE_FN = ['bewaarDag', 'bewaarReflectie', 'bewaarDeadline', 'bewaarDienst', 'bewaarPeriode', 'verwijderPeriode', 'bewaarKlaar', 'verwijderKlaar'], WACHT_KEY = 'planner-wachtrij';
const isNetwerkFout = e => /Failed to fetch|NetworkError|Load failed|network/i.test(e && e.message || String(e));
function lokaal(fn, a){             // laat de wijziging meteen zien, ook zonder verbinding
  const d = JSON.parse(JSON.stringify(D));
  if (fn === 'bewaarDag') {
    d.dagen = d.dagen.filter(x => x.datum !== a.datum);
    if (Number(a.gamen) || a.sport || a.notitie || Number(a.coderen) || Number(a.slaap) || a.bedtijd || a.opstaan)
      d.dagen.push({datum:a.datum, gamen:Number(a.gamen)||0, sport:!!a.sport, notitie:a.notitie||'', coderen:Number(a.coderen)||0,
                    slaap:Number(a.slaap)||0, bedtijd:a.bedtijd||'', opstaan:a.opstaan||''});
    const vakken = Object.keys(a.studie || {});
    d.studie = d.studie.filter(x => !(x.datum === a.datum && vakken.includes(x.vak)));
    vakken.forEach(v => { if (Number(a.studie[v]) > 0) d.studie.push({id:a.datum+'|'+v, datum:a.datum, vak:v, uren:Number(a.studie[v])}); });
  } else if (fn === 'bewaarReflectie') {
    d.reflecties = d.reflecties.filter(r => r.week !== a.week).concat([Object.assign({}, a)]);
  } else if (fn === 'bewaarDeadline') {
    const x = Object.assign({}, a, {id: a.id || 'nieuw-' + Date.now()});
    d.deadlines = d.deadlines.filter(y => y.id !== x.id).concat([x]);
  } else if (fn === 'bewaarPeriode') {  // uitje of vakantie toevoegen/wijzigen zonder bereik
    const x = Object.assign({vertrek: '', terug: ''}, a, {id: a.id || 'nieuw-' + Date.now()});
    d.periodes = (d.periodes || []).filter(y => y.id !== x.id).concat([x]);
  } else if (fn === 'bewaarKlaar') {
    d.klaar = (d.klaar || []).filter(y => y.id !== a.id).concat([Object.assign({}, a)]);
  } else if (fn === 'verwijderKlaar') {
    d.klaar = (d.klaar || []).filter(y => y.id !== a);
  } else if (fn === 'verwijderPeriode') {
    d.periodes = (d.periodes || []).filter(y => y.id !== a);
  } else if (fn === 'bewaarDienst') {   // bijv. "Gewerkt?" afvinken op locatie zonder bereik
    const oud = d.diensten.find(y => y.id === a.id) || {};
    const x = Object.assign({}, oud, a, {pauze: Number(a.pauze) || 0, toeslag: Number(a.toeslag) || 100, status: a.status || 'gepland'});
    d.diensten = d.diensten.filter(y => y.id !== x.id).concat([x]);
  }
  return d;
}
async function verstuurWachtrij(){
  const rij = opslag.get(WACHT_KEY) || [];
  if (!rij.length || IN_GOOGLE) return;
  for (let n = 0; n < rij.length; n++) {
    try { await roep(rij[n].fn, rij[n].args); }
    catch(e) { opslag.set(WACHT_KEY, rij.slice(n)); return; }   // nog steeds offline: later opnieuw
  }
  opslag.weg(WACHT_KEY);
  try { D = await roep('haalAlles', []); opslag.set(CACHE_KEY, D); inv = null;
        achtergrondRender(); toast('Offline wijzigingen opgeslagen ✓'); } catch(e) {}
}
window.addEventListener('online', verstuurWachtrij);
function api(fn, ...args){
  if (!IN_GOOGLE && OFFLINE_FN.includes(fn) && (opslag.get(WACHT_KEY) || []).length) return inWachtrij(fn, args);
  return roep(fn, args).catch(e => {
    if (!IN_GOOGLE && OFFLINE_FN.includes(fn) && isNetwerkFout(e)) return inWachtrij(fn, args);
    throw e;
  }).then(d => {
    if (!IN_GOOGLE && d && d.diensten) opslag.set(CACHE_KEY, d);   // laatste stand bewaren: app opent direct
    return d;
  }).catch(e => {
    const m = e.message || String(e);
    toast(isNetwerkFout(e) ? 'Geen verbinding. Probeer het zo opnieuw.' : 'Er ging iets mis: ' + m);
    throw e;
  });
}
function inWachtrij(fn, args){
  // nieuw item zonder id: nu al een tijdelijk id geven, dat ook naar de server gaat.
  // Anders krijgt hij lokaal een ander id dan op de server, en komt hij na nog een wijziging dubbel in de sheet.
  if ((fn === 'bewaarDeadline' || fn === 'bewaarDienst' || fn === 'bewaarPeriode') && args[0] && !args[0].id)
    args = [Object.assign({}, args[0], {id: 'nieuw-' + Date.now()})].concat(args.slice(1));
  const rij = opslag.get(WACHT_KEY) || []; rij.push({fn, args}); opslag.set(WACHT_KEY, rij);
  const d = lokaal(fn, args[0]); opslag.set(CACHE_KEY, d);
  setTimeout(() => toast('Offline bewaard. Wordt verstuurd zodra je verbinding hebt.'), 2900);
  setTimeout(verstuurWachtrij, 3000);   // misschien is de verbinding er alweer
  return Promise.resolve(d);
}
function toast(t){ const el=document.createElement('div'); el.className='toast'; el.textContent=t; document.body.appendChild(el); setTimeout(()=>el.remove(),2800); }
/** Melding met een knop (bijv. "Ongedaan maken"), blijft ms milliseconden staan. */
function toastActie(t, knop, fn, ms = 6000){
  document.querySelectorAll('.toast.actie').forEach(x => x.remove());
  const el = document.createElement('div'); el.className = 'toast actie';
  el.innerHTML = `<span></span><button class="toastknop"></button>`;
  el.firstChild.textContent = t; el.lastChild.textContent = knop;
  el.lastChild.onclick = () => { el.remove(); fn(); };
  document.body.appendChild(el); setTimeout(() => el.remove(), ms);
}

/** Lessen worden alleen bij het opstarten opgehaald: 2 weken terug t/m ±2 maanden vooruit, in één keer. */
const LES_KEY = 'planner-lessen';
let LESSEN = null;                       // { van, tot, lessen } of { fout }
function lesBereik(){ const ma = maandag(vandaag()); return { van: plus(ma, -14), tot: plus(ma, 9*7 - 1) }; }
function haalLessenOp(){
  const b = lesBereik();
  if (!LESSEN) LESSEN = opslag.get(LES_KEY);          // laatste stand, ook zonder internet
  return api('haalLessen', b.van, b.tot)
    .then(r => { LESSEN = r.fout ? { fout: r.fout } : Object.assign({}, b, r); if (!r.fout) opslag.set(LES_KEY, LESSEN); achtergrondRender(); })
    .catch(() => { if (!LESSEN) LESSEN = { fout: 'Lessen laden uit de agenda lukte niet.' }; achtergrondRender(); });
}
function lessenWeek(ma){
  if (!LESSEN) return null;                            // nog bezig met ophalen
  if (LESSEN.fout) return { fout: LESSEN.fout };
  if (ma < maandag(LESSEN.van) || ma > LESSEN.tot)     // buiten wat bij het opstarten is opgehaald
    return { lessen: [], buiten: true };
  const regels = D ? lesRegels() : [];
  const lijst = LESSEN.lessen.filter(l => l.datum >= ma && l.datum <= plus(ma, 6) && !lesVerborgen(l, regels));
  // Zelfde titel op dezelfde dag en ze overlappen (andere groep, tentamen met/zonder verlenging): alleen de langste tonen.
  // Even lang (precies dubbel)? Dan de eerste.
  const duur = l => minuten(l).e - minuten(l).b;
  return { lessen: lijst.filter((l, i) => !lijst.some((x, j) => j !== i && x.datum === l.datum && x.titel === l.titel
    && minuten(x).b < minuten(l).e && minuten(x).e > minuten(l).b && (duur(x) > duur(l) || (duur(x) === duur(l) && j < i)))) };
}
function lessenOp(s){ const w=lessenWeek(maandag(s)); if (!w || w.fout) return w; return {lessen: w.lessen.filter(l=>l.datum===s), buiten: w.buiten}; }

/** Extra agenda's (⚙︎ → Werk en agenda), bijv. van een vereniging: alleen om te tonen in Rooster en Agenda.
 *  Ze tellen niet mee in je studieplan. Opgehaald bij het opstarten, voor dezelfde periode als de lessen. */
const EXTRA_KEY = 'planner-extra-agenda';
let EXTRA = null;                        // { van, tot, items, fout }
function haalExtraOp(){
  if (!D || !String(I().extraAgenda || '').trim()) { EXTRA = null; opslag.weg(EXTRA_KEY); return Promise.resolve(); }
  const b = lesBereik();
  return api('haalExtraAgenda', b.van, b.tot)
    .then(r => { EXTRA = Object.assign({}, b, r); opslag.set(EXTRA_KEY, EXTRA); achtergrondRender(); })
    .catch(() => { if (!EXTRA) EXTRA = { items: [], fout: 'Extra agenda laden lukte niet.' }; achtergrondRender(); });
}
const extraOp = s => (EXTRA && EXTRA.items || []).filter(x => x.datum === s);
/**
 * Hoeveel uur van je actieve dag (⚙︎) gaat op dag s op aan afspraken uit je extra agenda's (instelling extraTelt = aan).
 * Afspraak met tijd: het deel binnen je actieve dag. Meerdaagse afspraak met tijden: eerste dag "vanaf", laatste dag "tot",
 * de dagen ertussen helemaal. Afspraken van een hele dag zonder tijd (bijv. een herinnering) tellen niet mee.
 */
// ================= REISTIJD =================
// Vaste reistijd vóór en na een afspraak, zodat die niet als vrije tijd telt.
// - School: ⚙︎ → Studietijd → reistijd naar school (enkele reis): vóór de eerste en na de laatste les van de dag.
// - Regels (⚙︎ → Reistijd, instelling reisRegels, JSON [{tekst, min}]): komt de tekst voor in de locatie van een dienst
//   of de titel van een afspraak uit een extra agenda, dan komt er min minuten reizen vóór én na. De eerste regel die past telt.
function reisRegels(){
  try { const r = JSON.parse(I().reisRegels || '[]'); return Array.isArray(r) ? r.filter(x => x && String(x.tekst || '').trim() && Number(x.min) > 0) : []; }
  catch (e) { return []; }

    d.frac = d.studieAf ? 1 : Math.min(1, d.gedaan / p);
    d.gameVrij = d.gameDeel * d.frac;
    d.saldoIn = saldo;
    d.wacht = saldo > 0 && !d.studieAf ? saldo : 0;                // staat klaar zodra je studie van die dag af is
    d.gameBeschikbaar = d.gameVrij + (saldo > 0 ? (d.studieAf ? saldo : 0) : saldo) - d.gamed;
    saldo += d.gameVrij - d.gamed;
  });
  const tot = (lijst, k) => lijst.reduce((x, d) => x + d[k], 0);
  const totNu = dagen.filter(d => d.s <= nu);
  const doel = tot(dagen, 'doel'), perVak = {};
  vakken.forEach(v => perVak[v] = dagen.reduce((x, d) => x + d.perVak[v], 0));
  return { ma, dagen, doel, perVak, zelf, les: lesTot, tekort, tekortNu,

           dienst: tot(dagen, 'dienst'), vrij: tot(dagen, 'vrij'),
           ruimte: tot(dagen, 'vrij') - doel - tekort,               // uren die er nog bij kunnen zonder dat je studie in de knel komt

const dagPlan = s => weekPlan(maandag(s)).dagen.find(d => d.s === s);
/** Vrije gametijd die je vandaag nog hebt (uren, kan negatief zijn = voorschot). Lopende timer telt niet mee. */

/**
 * Doelen voor één dag, in de vorm die de rest van de app gebruikt (meters, meldingen, week- en maandtotaal).
 * gameMax = gametijd die je verdient met studeren; gameVrij = vrije gametijd (vakantie).

function dagDoel(s){
  const d = dagPlan(s);
  return { studie: d.doel, perVak: d.perVak, gameMax: d.school ? d.gameDeel : 0, gameVrij: d.school ? 0 : d.gameDeel,

/** Doelen voor een reeks dagen (week of maand) = de optelsom van de dagdoelen. */
function doelenVoor(van, aantal){
  const som = { studie: 0, gameMax: 0, gameVrij: 0, perVak: {}, modus: null, modusDagen: 0, dagen: aantal, tentamens: [],
                beschikbaar: 0, vakantieDagen: 0, vakanties: [], uitjeDagen: 0, uitjes: [] };
  for (let n = 0; n < aantal; n++) {
    const d = dagDoel(plus(van, n));
    som.studie += d.studie; som.gameMax += d.gameMax; som.gameVrij += d.gameVrij; som.beschikbaar += d.beschikbaar;
    if (d.vakantie) { som.vakantieDagen++; if (!som.vakanties.includes(d.vakantie)) som.vakanties.push(d.vakantie); }
    if (d.uitje) { som.uitjeDagen++; d.uitje.lijst.forEach(p => { if (!som.uitjes.includes(p)) som.uitjes.push(p); }); }
    Object.keys(d.perVak).forEach(v => som.perVak[v] = (som.perVak[v] || 0) + d.perVak[v]);
    if (d.modus) {
      som.modusDagen++; if (!som.modus) som.modus = d.modus;
      d.modus.alle.forEach(x => { if (!som.tentamens.includes(x.t)) som.tentamens.push(x.t); });
    }
  }
  return som;
}

let timerBezig = false;
function verstreken(t){ return Math.max(0, (t.pauzeStart || Date.now()) - t.start - (Number(t.pauzeMs) || 0)); }

/**
 * Studie die niet bij een vak hoort: open deadlines en komende tentamens waarvan het vak niet bij ⚙︎ → Vakken staat.
 * Daar kun je ook een timer voor starten; de tijd telt als studie (dag, week, gametijd), los van de vakken.
 * Naam = het vak van de deadline/het tentamen, of bij een deadline zonder vak de omschrijving.
 */
const LOS_DAGEN = 28, LOS_TE_LAAT = 7;    // komende 4 weken; een open deadline nog 7 dagen na de datum
function losseStudie(nu = vandaag()){
  const gezien = new Set(D.vakken.map(v => v.vak.trim().toLowerCase())), uit = [];
  const voegToe = (naam, soort, datum) => {
    naam = String(naam || '').trim(); const k = naam.toLowerCase();
    if (!naam || gezien.has(k)) return;
    gezien.add(k); uit.push({ naam, soort, datum });
  };
  D.deadlines.filter(d => !d.klaar && dagenTot(nu, d.datum) <= LOS_DAGEN && dagenTot(nu, d.datum) >= -LOS_TE_LAAT)
    .forEach(d => voegToe(d.vak || d.wat, 'deadline', d.datum));
  komendeTentamens(nu).filter(t => dagenTot(nu, t.datum) <= LOS_DAGEN).forEach(t => voegToe(t.vak, 'tentamen', t.datum));
  return uit.sort((a, b) => a.datum.localeCompare(b.datum));
}

/** Timer meteen op het scherm aanpassen, daarna naar de server. Lukt dat niet, dan terug naar hoe het was. */
async function timerActie(knop, nieuweTimer, melding, fn, ...args){
  if (timerBezig) return;
  tril(); if (knop) knop.classList.add('bezig');
  const oud = D.timer;
  timerBezig = true; D.timer = nieuweTimer; render(); if (melding) toast(melding);
  try { D = await api(fn, ...args); }
  catch(e){ D.timer = oud; }            // api() heeft de foutmelding al getoond
  finally { timerBezig = false; achtergrondRender(); }
}

      <label class="f">Opslaan als (minuten)</label><input id="tMin" inputmode="numeric" value="${minuten}">
      ${minuten > 240 ? '<div class="alert">Dat is lang. Vergeten te stoppen? Pas de minuten aan.</div>' : ''}
      <div class="note">Wordt opgeteld bij de dag waarop de timer startte.</div>
      <div style="height:12px"></div><button class="btn" id="tOk">Opslaan</button><button class="btn ghost" id="tTerug">Timer laten lopen</button>`);
    $('#tTerug').onclick = closeSheet;

      const m = num($('#tMin').value); if (isNaN(m) || m < 0) return toast('Vul minuten in');
      const btn = $('#tOk'); btn.disabled = true; btn.textContent = 'Opslaan…'; tril();

let dag = vandaag(), inv = null;
/** Hoe een dag er in de sheet uitziet (om te zien of er iets niet is opgeslagen). */
function opgeslagenInv(dag){
  const r = D.dagen.find(x=>x.datum===dag);
  const studie = {}; D.vakken.forEach(v => studie[v.vak] = 0); Object.assign(studie, studieOp(dag));
  return { dag, studie, gamen:r?r.gamen:0, sport:r?r.sport:false, notitie:r?(r.notitie||''):'', coderen:r?(r.coderen||0):0, slaap:r?(r.slaap||0):0,
          bedtijd:r?(tijdOfLeeg(r.bedtijd)):'', opstaan:r?(tijdOfLeeg(r.opstaan)):'', wakker: r ? wakkerUit(r) : 0 };
}
/**
 * 's Nachts wakker geweest (minuten). Wordt niet apart opgeslagen: het is het verschil tussen
 * de tijd in bed (bedtijd → opstaan) en de opgeslagen slaap. Zo hoeft de server niets te veranderen.
 */
function wakkerUit(r){
  const bed = tijdOfLeeg(r.bedtijd), op = tijdOfLeeg(r.opstaan), sl = Number(r.slaap) || 0;
  if (!bed || !op || !sl) return 0;
  const m = Math.round((slaapUren(bed, op) - sl) * 60);
  return m >= 1 ? m : 0;
}
/** "60", "45" of "1:15" → minuten */
function minutenUit(v){
  const s = String(v || '').trim(); if (!s) return 0;
  const m = s.match(/^(\d{1,2}):(\d{2})$/); if (m) return +m[1] * 60 + +m[2];
  const n = Math.round(num(s)); return isNaN(n) || n < 0 ? 0 : n;
}
/** Tekst onder de slaaptijden. */
function slaapTekst(){
  if (!(inv.bedtijd && inv.opstaan)) return inv.slaap ? uMin(inv.slaap) + ' slaap (zonder tijden ingevuld)' : 'Vul beide tijden in, dan rekent de app je slaap uit.';
  return '= ' + uMin(inv.slaap) + ' slaap' + (inv.wakker ? ` (${uMin(slaapUren(inv.bedtijd, inv.opstaan))} in bed − ${uMin(inv.wakker / 60)} wakker)` : '');
}
/** "23:59", "23:59:00" of een volledige datum-tijd → "23:59"; iets onherkenbaars → "" */
function tijdOfLeeg(v){
  const s = String(v || ''); const m = s.match(/(\d{1,2}):(\d{2})/);
  return m ? pad(+m[1]) + ':' + m[2] : '';
}
let invBasis = '', toonWakker = false;   // toonWakker: veld "'s nachts wakker" open geklikt   // hoe de dag eruitzag toen je hem opende: zo zien we of je iets hebt veranderd
function laadInv(){ inv = opgeslagenInv(dag); invBasis = JSON.stringify(inv); toonWakker = false; }
const viesDag = () => !!(D && inv && JSON.stringify(inv) !== invBasis);
/** Nieuwe gegevens binnen (bijv. van je andere apparaat)? Alleen overnemen als je niets aan het veranderen bent. */
function verversInv(){ if (inv && !viesDag() && !bezig()) laadInv(); }
const dagPayload = () => ({datum:inv.dag, studie:inv.studie, gamen:inv.gamen, sport:inv.sport, notitie:inv.notitie,
                           coderen:inv.coderen, slaap:inv.slaap, bedtijd:inv.bedtijd, opstaan:inv.opstaan});
const vakNamen = () => Object.keys(inv.studie);
const LOS = ['gamen', 'coderen', 'slaap'];
/** Slaapduur uit bedtijd en opstaan (bedtijd mag vóór of na middernacht zijn). */
function slaapUren(bed, op){
  if (!bed || !op) return 0;
  let m = mins(op) - mins(bed); if (m <= 0) m += 1440;
  return Math.round(m / 60 * 100) / 100;
}
/** Bedtijd als getal voor gemiddelden en grafieken: na middernacht telt door (00:30 → 24,5). */
const bedUur = t => { const m = mins(t); return (m < 12*60 ? m + 1440 : m) / 60; };
/** 7,0333 → "7 u 2 min" (voor slaap leest dat beter dan decimalen) */
/** Uren als "2 u 50 min", "35 min" of "3 u" (afgerond op hele minuten). */
const uMin = h => {
  const m = Math.round(Math.abs(Number(h) || 0) * 60), teken = h < 0 && m ? '−' : '';
  if (m < 60) return teken + (m ? m + ' min' : '0 u');
  return teken + Math.floor(m/60) + ' u' + (m % 60 ? ' ' + (m % 60) + ' min' : '');
};
/** Doelen: afgerond op 5 minuten, zodat er geen "2 u 51 min" staat. */
const uD = h => uMin(Math.round((Number(h) || 0) * 12) / 12);
const uurTekst = h => { const m = Math.round(h*60) % 1440; return pad(Math.floor(m/60)) + ':' + pad(m%60); };   // velden die niet bij een vak horen
const invGet = k => LOS.includes(k) ? inv[k] : inv.studie[vakNamen()[+k.slice(1)]];
const invSet = (k,v) => { if (LOS.includes(k)) inv[k] = v; else inv.studie[vakNamen()[+k.slice(1)]] = v; };
function stepper(k, label){
  return `<div class="row line"><div class="grow">${label}</div><div class="step">
    <button data-k="${k}" data-d="-0.5" aria-label="minder">−</button><span class="sv" data-typ="${k}" style="cursor:pointer;text-decoration:underline dotted">${uMin(invGet(k))}</span>
    <button data-k="${k}" data-d="0.5" aria-label="meer">+</button></div></div>`;
}

// ================= STUDIEPLAN EN GAMETIJD (Vandaag) =================
/** Kaart met het studieplan van dag s per vak, met "Klaar"-knoppen. */
function planKaart(s){
  if (!D.vakken.length) return '';
  const wp = weekPlan(maandag(s)), d = wp.dagen.find(x => x.s === s), nu = vandaag();
  const plan = s >= nu ? d.plan : d.perVak, tot = s >= nu ? d.planTot : d.doel;
  const rij = v => {
    const k = klaarOp(v, s), p = plan[v] || 0, g = d.gedaanVak[v] || 0;
    if (p < 0.01 && g < 0.01 && !k) return '';
    return `<div class="m"><div class="row"><div class="grow">${esc(v)}${k ? ` <span class="badge">✓ klaar${k.tot > s ? ' t/m ' + dagKort(k.tot) : ''}</span>` : ''}</div>
        <div class="mv">${uMin(g)}${k ? '' : ' / ' + uD(p)}</div>
        ${k ? `<button class="btn ghost small" data-klaarweg="${esc(k.id)}">ongedaan</button>` : `<button class="btn sec small" data-klaar="${esc(v)}">Klaar</button>`}</div>
      ${k ? '' : `<div class="meter ${g >= p - 0.01 ? 'good' : ''}"><i style="width:${p > 0.01 ? Math.min(100, g / p * 100) : 100}%"></i></div>`}</div>`;
  };
  // studie buiten je vakken (timer voor een losse deadline/tentamen): telt mee in het totaal, geen eigen doel
  // vandaag en later: ook open deadlines/tentamens die niet bij je vakken horen, zonder doel (zie losseStudie)
  const los = s >= nu ? losseStudie(s) : [], losNamen = los.map(x => x.naam);
  const extra = Object.keys(d.gedaanVak).filter(v => !D.vakken.some(x => x.vak === v) && !losNamen.includes(v) && d.gedaanVak[v] >= 0.01);
  const startKnop = v => s === nu && !D.timer ? `<button class="btn sec small" data-tv="${esc(v)}" aria-label="timer starten">▶</button>` : '';
  const extraRij = (v, sub) => `<div class="m"><div class="row"><div class="grow">${esc(v)} <span class="sub">${sub}</span></div>
      <div class="mv">${uMin(d.gedaanVak[v] || 0)}</div>${startKnop(v)}</div></div>`;
  const rijen = D.vakken.map(v => rij(v.vak)).join('')
    + los.map(x => extraRij(x.naam, (x.soort === 'tentamen' ? '📚 tentamen ' : '⏰ deadline ') + dagKort(x.datum) + ' · extra')).join('')
    + extra.map(v => extraRij(v, '(extra)')).join('');
  const meld = [];
  if (d.allesKlaar) meld.push(['okbox', 'Alles klaar 🎉 De rest van de dag is vrij, en je gametijd ook.']);
  else if (d.school && tot > 0.01 && d.gedaan >= tot - 0.01) meld.push(['okbox', 'Studie van deze dag af ✓ Je gametijd is vrij.']);
  const tekort = s === nu ? wp.tekortNu : s > nu ? wp.tekort : 0;
  if (tekort) meld.push(['alert', `Je studie past deze week niet: ±${uD(tekort)} te weinig tijd${wp.dienst ? ` (${u(wp.dienst)} u diensten deze week)` : ''}. Schuif of ruil een dienst als het kan.`]);
  if (d.school && d.gewicht > 0 && d.lesOnbekend) meld.push(['note', 'Lesrooster van deze dag onbekend: je studiedoel kan te hoog zijn.']);
  const leeg = !d.school ? (d.vak.soort === 'zomer' ? 'Zomervakantie: geen studie gepland.' : 'Vakantie: geen studie meer gepland.')
             : d.gewicht === 0 ? 'Weekend: geen studie gepland (⚙︎ → Studie).' : 'Geen studie gepland.';
  return `<h2>Studieplan ${s === nu ? 'vandaag' : dagKort(s)} <span class="sub">${uMin(d.gedaan)} / ${uD(tot)}</span></h2>
    <div class="card">${rijen || `<div class="note" style="margin:0">${leeg}</div>`}
      ${meld.map(([c, t]) => `<div class="${c}">${t}</div>`).join('')}
      <div class="note">Klaar = niets meer te doen voor dat vak. De tijd gaat naar je andere vakken; is alles klaar, dan is het vrije tijd.</div></div>`;
}
function planKnoppen(s){
  document.querySelectorAll('[data-klaar]').forEach(b => b.onclick = () => {
    const v = b.dataset.klaar;
    sheet(`<h3>${esc(v)} klaar</h3>
      <div class="note">Niets meer te doen voor dit vak? De tijd gaat naar je andere vakken. Is alles klaar, dan is het vrije tijd en telt het niet als achterstand.</div>
      <div style="height:8px"></div><button class="btn" id="kDag">Klaar voor ${s === vandaag() ? 'vandaag' : dagKort(s)}</button>
      <label class="f">Of klaar tot en met</label><input type="date" id="kTot" value="${plus(s, 1)}">
      <button class="btn sec" id="kTotOk" style="margin-top:8px">Klaar tot deze datum</button>
      <button class="btn ghost" id="kAnn">Annuleren</button>`);
    const bewaar = async tot => {
      if (!tot || tot < s) return toast('Kies een datum vanaf ' + dagKort(s));
      try { D = await api('bewaarKlaar', { id: v + '|' + s, vak: v, van: s, tot }); closeSheet(); render(); tril(); toast(v + ' klaar ✓'); } catch(e){}
    };
    $('#kDag').onclick = () => bewaar(s);
    $('#kTotOk').onclick = () => bewaar($('#kTot').value);
    $('#kAnn').onclick = closeSheet;
  });
  document.querySelectorAll('[data-klaarweg]').forEach(b => b.onclick = async () => {
    b.classList.add('bezig');
    try { D = await api('verwijderKlaar', b.dataset.klaarweg); render(); toast('Weer open'); } catch(e){ b.classList.remove('bezig'); }
  });
}
/** Gametijd van dag s: vrijgespeeld naar rato van je studieplan, plus wat er van eerdere dagen doorschuift. */
function gameKaart(s){
  const wp = weekPlan(maandag(s)), d = wp.dagen.find(x => x.s === s), g = wp.game, nu = vandaag();
  if (s > nu) return `<div class="card"><div class="sub">Gametijd ${dagKort(s)}</div><div class="note" style="margin:4px 0 0">Dagdeel ${uD(d.gameDeel)}. Komt die dag vrij naarmate je studie af is.</div></div>`;
  const over = d.gameBeschikbaar;
  const uitleg = !d.school ? 'Vakantie: vrij tot je daglimiet.' : d.studieAf ? 'Je studie is af: je dagdeel is helemaal vrij.'
               : `${procent(d.frac)} van je studieplan gedaan, dus ${procent(d.frac)} van je dagdeel vrij.`;
  const saldo = d.saldoIn > 0.01 ? (d.studieAf ? `Plus ${uMin(d.saldoIn)} doorgeschoven van eerdere dagen.` : `Nog ${uMin(d.saldoIn)} van eerdere dagen staat klaar zodra je studie af is.`)
              : d.saldoIn < -0.01 ? `Min ${uMin(-d.saldoIn)} voorschot van eerdere dagen.` : '';
  return `<div class="card"><div class="row"><div class="grow"><div class="sub">Gametijd ${s === nu ? 'vandaag' : dagKort(s)}</div>
      <div class="sub">vrijgespeeld ${uMin(d.gameVrij)} van ${uD(d.gameDeel)} · gebruikt ${uMin(d.gamed)}</div></div>
      <div class="big ${over < 0 ? 'neg' : ''}">${uMin(over)}<span class="unit">over</span></div></div>
    <div class="note" style="margin:6px 0 0">${uitleg}${saldo ? ' ' + saldo : ''} Deze week ${uMin(g.gamed)} van max ${uD(g.max)}.</div></div>`;
}

// ================= DEADLINES =================
function deadlineNaam(d){ return (d.vak ? d.vak + ': ' : '') + d.wat; }
function wanneer(vanaf, d){
  const n = dagenTot(vanaf, d.datum);
  return n < 0 ? (-n)+' d te laat' : n === 0 ? 'vandaag '+(d.tijd||'') : n === 1 ? 'morgen '+(d.tijd||'') : 'over '+n+' dagen';
}
/**
 * Deadlinekaart. Ingeklapt (standaard) zie je alleen wat binnen 2 dagen moet (of te laat is);
 * de rest zit achter "▸ nog X". Uitgeklapt zie je alles van de komende 2 weken. Wordt per apparaat onthouden.
 */
const DL_OPEN_KEY = 'planner-deadlines-open';
function deadlineKaart(s){
  const open = D.deadlines.filter(d => !d.klaar && dagenTot(s, d.datum) <= 14).sort((a,b)=>(a.datum+a.tijd).localeCompare(b.datum+b.tijd));
  const later = D.deadlines.filter(d => !d.klaar && dagenTot(s, d.datum) > 14).length;
  const uit = opslag.get(DL_OPEN_KEY) === '1';
  const urgent = open.filter(d => dagenTot(s, d.datum) <= 2);
  const zicht = uit ? open : urgent, verborgen = open.length - zicht.length;
  const kop = open.length ? `<button class="dlkop" id="dlKlap" aria-expanded="${uit}">${uit ? '▾' : '▸'} Deadlines <span class="sub">(${open.length})</span></button>` : 'Deadlines';
  return `<h2>${kop}</h2><div class="card">
    ${zicht.map(d => `<div class="dl ${dagenTot(s,d.datum)<=2?'urgent':''}"><button class="vink" data-dk="${d.id}" aria-label="klaar">✓</button>
      <div class="grow" data-de="${d.id}" style="cursor:pointer"><div class="name">${esc(deadlineNaam(d))}</div><div class="sub">${dagKort(d.datum)} · ${esc(d.tijd||'')}</div></div>
      <div class="wanneer">${wanneer(s,d)}</div></div>`).join('')}
    ${!open.length ? '<div class="note">Geen deadlines in de komende 2 weken.</div>'
      : verborgen ? `<button class="btn ghost small dlmeer" id="dlMeer">▸ nog ${verborgen} ${verborgen === 1 ? 'deadline' : 'deadlines'} deze 2 weken${!zicht.length ? ` · eerstvolgende ${esc(deadlineNaam(open[0]))}, ${wanneer(s, open[0])}` : ''}</button>`
      : uit && urgent.length < open.length ? `<button class="btn ghost small dlmeer" id="dlMeer">▴ minder tonen</button>` : ''}
    <div class="row" style="margin-top:6px"><button class="btn ghost small" id="dlAlle">Alle deadlines${later?' (+'+later+' later)':''}</button>
      <div class="grow"></div><button class="btn sec small" id="dlNieuw">+ Deadline</button></div></div>`;
}
function deadlineKnoppen(){
  document.querySelectorAll('[data-dk]').forEach(b => b.onclick = () => {
    const d = D.deadlines.find(x=>x.id===b.dataset.dk);
    if (!d || b.classList.contains('bezig')) return;
    tril(); b.classList.add('bezig');
    zetDeadlineKlaar(d, true);
    toastActie('Afgevinkt ✓ ' + deadlineNaam(d), 'Ongedaan maken', () => { zetDeadlineKlaar(d, false); toast('Weer open: ' + deadlineNaam(d)); });
  });
  document.querySelectorAll('[data-de]').forEach(el => el.onclick = () => openDeadline(D.deadlines.find(x=>x.id===el.dataset.de)));
  if ($('#dlNieuw')) $('#dlNieuw').onclick = () => openDeadline(null);
  const klap = () => { opslag.set(DL_OPEN_KEY, opslag.get(DL_OPEN_KEY) === '1' ? '0' : '1'); render(); };
  if ($('#dlKlap')) $('#dlKlap').onclick = klap;
  if ($('#dlMeer')) $('#dlMeer').onclick = klap;
  if ($('#dlAlle')) $('#dlAlle').onclick = () => alleDeadlines();
}
/**
 * Deadline af- of weer aanvinken. Het scherm verandert meteen (optimistisch); de server krijgt het daarna.
 * Verzoeken voor dezelfde deadline gaan na elkaar, en alleen het antwoord op de laatste actie telt.
 */
const dlRij = {}, dlLaatste = {};
function zetDeadlineKlaar(d, klaar){
  const x = Object.assign({}, d, {klaar});
  const nr = (dlLaatste[d.id] || 0) + 1; dlLaatste[d.id] = nr;
  D.deadlines = D.deadlines.map(y => y.id === d.id ? x : y); render();
  dlRij[d.id] = (dlRij[d.id] || Promise.resolve()).then(() => api('bewaarDeadline', x)).then(res => {
    if (dlLaatste[d.id] === nr) { D = res; achtergrondRender(); }
  }).catch(() => {
    if (dlLaatste[d.id] === nr) { D.deadlines = D.deadlines.map(y => y.id === d.id ? Object.assign({}, y, {klaar: !klaar}) : y); render(); }
  });
}
function alleDeadlines(){
  const nu = vandaag();
  const srt = l => l.sort((a,b)=>(a.datum+a.tijd).localeCompare(b.datum+b.tijd));
  const open = srt(D.deadlines.filter(d=>!d.klaar)), klaar = srt(D.deadlines.filter(d=>d.klaar)).reverse();
  const rij = d => `<div class="list-item" data-de="${d.id}"><div class="grow"><div class="name" style="${d.klaar?'text-decoration:line-through;color:var(--muted)':''}">${esc(deadlineNaam(d))}</div>
    <div class="sub">${dagKort(d.datum)} ${d.datum.slice(0,4)} · ${esc(d.tijd||'')}</div></div><div class="sub">${d.klaar?'klaar':wanneer(nu,d)}</div></div>`;
  sheet(`<h3>Deadlines</h3>
    <div class="card" style="padding:4px 12px">${open.map(rij).join('') || '<div class="empty">Geen openstaande deadlines.</div>'}</div>
    ${klaar.length ? `<details><summary>Klaar (${klaar.length})</summary><div class="card" style="padding:4px 12px">${klaar.map(rij).join('')}</div></details>` : ''}
    <button class="btn" id="adNieuw">+ Deadline</button><button class="btn sec" id="adMeer" style="margin-top:8px">+ Meerdere tegelijk (lijst plakken)</button><button class="btn ghost" id="adDicht">Sluiten</button>`);
  document.querySelectorAll('.sheet [data-de]').forEach(el => el.onclick = () => openDeadline(D.deadlines.find(x=>x.id===el.dataset.de), true));
  $('#adNieuw').onclick = () => openDeadline(null, true);
  $('#adMeer').onclick = () => meerdereDeadlines(true);
  $('#adDicht').onclick = closeSheet;
}

      <div class="grow"><label class="f">Tijd</label><input type="time" id="eTijd" value="${d.tijd}"></div></div>
    ${nieuw?'':`<label class="f">Status</label><div class="seg" id="eKlaar"><button data-v="0" class="${!d.klaar?'on':''}">Open</button><button data-v="1" class="${d.klaar?'on':''}">Klaar</button></div>`}
    <div class="note">Herinnering in je agenda: ${I().deadlineDagen} dag(en) van tevoren om ${I().deadlineTijd} en op de dag zelf om ${I().deadlineDagTijd} (aan te passen bij ⚙︎).</div>
    <div style="height:10px"></div><button class="btn" id="eOk">Opslaan</button>
    ${nieuw?'':'<button class="btn danger" id="eDel" style="margin-top:8px">Verwijderen</button>'}
    <button class="btn ghost" id="eAnn">Annuleren</button>`);
  let klaar = d.klaar;
  document.querySelectorAll('#eKlaar button').forEach(b => b.onclick = () => { klaar = b.dataset.v==='1';
    document.querySelectorAll('#eKlaar button').forEach(y => y.classList.toggle('on', y===b)); });
  $('#eVak').onchange = e => $('#eVakAnder').style.display = e.target.value==='__ander' ? 'block' : 'none';

  if (!nieuw) $('#eDel').onclick = async () => {
    const k = $('#eDel'); if (!k.dataset.zeker) { k.dataset.zeker = 1; k.textContent = 'Tik nog een keer om te verwijderen'; return; }
    D = await api('verwijderDeadline', d.id); render(); terug(); toast('Deadline verwijderd'); };
  $('#eOk').onclick = async () => {
    const vak = $('#eVak').value==='__ander' ? $('#eVakAnder').value.trim() : $('#eVak').value;
    const x = {id:d.id, wat:$('#eWat').value.trim(), vak, datum:$('#eDatum').value, tijd:$('#eTijd').value || '23:59', klaar};
    if (!x.wat || !x.datum) return toast('Vul in elk geval in wat en wanneer');
    const btn = $('#eOk'); btn.disabled = true; btn.textContent = 'Opslaan…';
    try { D = await api('bewaarDeadline', x); render(); terug(); toast('Deadline opgeslagen ✓'); }
    catch(e){ btn.disabled = false; btn.textContent = 'Opslaan'; }
  };
}

// ================= MEERDERE DEADLINES TEGELIJK =================
/**
 * Leest een geplakte lijst: één deadline per regel. Herkent o.a.
 *   24-11 Verslag week 1            24-11-2026 23:59 Verslag
 *   2026-11-24 17:00 Presentatie    ma 24 nov 12:00 - Quiz H3
 *   24/11<TAB>17:00<TAB>Opdracht    (kolommen uit Excel/Sheets)
 * Zonder jaar: dit jaar, of volgend jaar als de datum al meer dan 2 maanden voorbij is.
 */
function leesDeadlineRegels(tekst, stdTijd){
  const nu = vandaag(), jaar = +nu.slice(0,4);
  return String(tekst || '').split(/\r?\n/).map(r => r.trim()).filter(Boolean).map(regel => {
    let r = regel.replace(/\t+/g, ' ').replace(/^(ma|di|wo|do|vr|za|zo)[a-z]*\.?,?\s+/i, '');
    let d, m, y, mt;
    if ((mt = r.match(/^(\d{4})-(\d{1,2})-(\d{1,2})/))) { y = +mt[1]; m = +mt[2]; d = +mt[3]; }
    else if ((mt = r.match(/^(\d{1,2})[-\/.](\d{1,2})(?:[-\/.](\d{2,4}))?(?![\d:])/))) { d = +mt[1]; m = +mt[2]; y = mt[3] ? +mt[3] : null; }
    else if ((mt = r.match(/^(\d{1,2})\s+([a-z]{3})[a-z]*\.?(?:\s+(\d{4}))?/i)) && MAANDEN.includes(mt[2].toLowerCase().replace('maa','mrt'))) {
      d = +mt[1]; m = MAANDEN.indexOf(mt[2].toLowerCase().replace('maa','mrt')) + 1; y = mt[3] ? +mt[3] : null; }
    else return { regel, fout: 'geen datum gevonden aan het begin' };
    if (y !== null && y < 100) y += 2000;
    r = r.slice(mt[0].length).trim();
    let tijd = stdTijd || '23:59';
    const tm = r.match(/^(?:om\s+)?(\d{1,2})[:.](\d{2})(?:\s*uur)?/i);
    if (tm && +tm[1] < 24 && +tm[2] < 60) { tijd = pad(+tm[1]) + ':' + tm[2]; r = r.slice(tm[0].length).trim(); }
    const wat = r.replace(/^[-–—:|,·]+\s*/, '').trim();
    const maak = yy => `${yy}-${pad(m)}-${pad(d)}`;
    if (y === null) { y = jaar; if (dagenTot(maak(y), nu) > 60) y++; }
    const datum = maak(y), t = new Date(y, m - 1, d);
    if (t.getMonth() !== m - 1 || t.getDate() !== d) return { regel, fout: 'datum bestaat niet' };
    if (!wat) return { regel, fout: 'geen omschrijving' };
    return { regel, datum, tijd, wat };
  });
}

  };

// Tabbladnaam (zoals in de sheet) → waar die gegevens in D staan.
const EXPORT_TABS = { Diensten: 'diensten', Dagen: 'dagen', Studie: 'studie', Vakken: 'vakken', Reflectie: 'reflecties',
                      Maanddoelen: 'maanddoelen', Tentamens: 'tentamens', Deadlines: 'deadlines', Periodes: 'periodes' };
/** Bestand laten downloaden dat in het geheugen is gemaakt (Blob), zonder server. */
function downloadBestand(naam, inhoud, type){
  const url = URL.createObjectURL(new Blob([inhoud], { type: type + ';charset=utf-8' }));
  const a = document.createElement('a'); a.href = url; a.download = naam; document.body.appendChild(a); a.click();
  setTimeout(() => { URL.revokeObjectURL(url); a.remove(); }, 1000);
  toast('Gedownload: ' + naam);
}
/**
 * Lijst objecten → CSV zoals Nederlandse Excel/LibreOffice het verwacht: puntkomma tussen kolommen,
 * komma in getallen, UTF-8 met BOM (anders worden ë en € rare tekens). Cellen met ; " of een regelovergang tussen aanhalingstekens.
 */
function naarCsv(rijen){
  const kol = [...new Set(rijen.flatMap(r => Object.keys(r)))];
  const cel = v => {
    const s = v === null || v === undefined ? '' : typeof v === 'number' ? String(v).replace('.', ',')
            : typeof v === 'boolean' ? (v ? 'ja' : '') : typeof v === 'object' ? JSON.stringify(v) : String(v);
    return /[;"\r\n]/.test(s) ? '"' + s.replace(/"/g, '""') + '"' : s;
  };
  return '\ufeff' + [kol.join(';')].concat(rijen.map(r => kol.map(k => cel(r[k])).join(';'))).join('\r\n');
}

// ================= TENTAMENS PLAKKEN =================
/**
 * Zelfde herkenning als bij deadlines (datum vooraan, optionele tijd), de rest is het vak.
 * Tekst tussen haakjes aan het eind wordt de opmerking: "26-01 13:30 Wiskunde (herkansing)".
 * Een tijdvak als "09:00-11:00" mag: de eindtijd wordt overgeslagen.
 */
function leesTentamenRegels(tekst){
  return leesDeadlineRegels(tekst, '-').map(x => {
    if (x.fout) return x.fout === 'geen omschrijving' ? Object.assign({}, x, { fout: 'geen vak' }) : x;
    let vak = x.wat.replace(/^[-–]?\s*\d{1,2}[:.]\d{2}\s*[-–:|]?\s*/, '');
    const m = vak.match(/^(.*?)\s*\(([^)]*)\)\s*$/);
    vak = (m ? m[1] : vak).trim();
    if (!vak) return { regel: x.regel, fout: 'geen vak' };
    return { regel: x.regel, datum: x.datum, tijd: x.tijd === '-' ? '' : x.tijd, vak, opmerking: m ? m[2].trim() : '' };
  });
}

// ================= SCHOOLVAKANTIES PLAKKEN =================
/**
 * Leest een geplakt vakantierooster: één vakantie per regel, met een naam en één of twee datums. Herkent o.a.
 *   Kerstvakantie 21-12-2026 t/m 01-01-2027      Voorjaarsvakantie: 15 feb 2027 - 19 feb 2027
 *   Herfstvakantie 19 t/m 23 oktober 2026         Zomervakantie<TAB>12-07-2027<TAB>20-08-2027
 * Zonder jaar: dit jaar, of volgend jaar als de datum al meer dan 2 maanden voorbij is.
 * "zomer" in de naam (hoofdletters maken niet uit) = zomervakantie.
 */
const MAAND_RE = '(jan|feb|maa|mrt|apr|mei|jun|jul|aug|sep|okt|nov|dec)[a-z]*\\.?';
const maandNr = t => { const k = t.toLowerCase().slice(0,3).replace('maa','mrt'); return MAANDEN.indexOf(k) + 1; };
function leesVakantieRegels(tekst){
  const nu = vandaag(), jaarNu = +nu.slice(0,4);
  return String(tekst || '').split(/\r?\n/).map(r => r.trim()).filter(Boolean).map(regel => {
    let r = regel.replace(/\t+/g, ' ');
    const data = [];                                            // { d, m, y } in volgorde
    // "19 t/m 23 oktober 2026" (twee dagen, één maand)
    const kort = new RegExp('\\b(\\d{1,2})\\s*(?:t\\/m|tm|tot en met|tot|-|–)\\s*(\\d{1,2})\\s+' + MAAND_RE + '(?:\\s+(\\d{4}))?', 'i');
    let mt = r.match(kort);
    if (mt) {
      const m = maandNr(mt[3]), y = mt[4] ? +mt[4] : null;
      data.push({ d: +mt[1], m, y }, { d: +mt[2], m, y }); r = r.replace(mt[0], ' ');
    } else {
      const los = new RegExp('\\b(\\d{4})-(\\d{1,2})-(\\d{1,2})|\\b(\\d{1,2})[-\\/.](\\d{1,2})(?:[-\\/.](\\d{2,4}))?|\\b(\\d{1,2})\\s+' + MAAND_RE + '(?:\\s+(\\d{4}))?', 'gi');
      r = r.replace(los, (...g) => {
        if (g[1]) data.push({ d: +g[3], m: +g[2], y: +g[1] });
        else if (g[4]) data.push({ d: +g[4], m: +g[5], y: g[6] ? +g[6] : null });
        else data.push({ d: +g[7], m: maandNr(g[8]), y: g[9] ? +g[9] : null });
        return ' ';
      });
    }
    const naam = r.replace(/\b(t\/m|tm|tot en met|tot|van)\b/gi, ' ').replace(/\b(maandag|dinsdag|woensdag|donderdag|vrijdag|zaterdag|zondag|ma|di|wo|do|vr|za|zo)\b\.?/gi, ' ')
      .replace(/[-–—:|,·()]+/g, ' ').replace(/\s+/g, ' ').trim();
    if (!data.length) return { regel, fout: 'geen datum gevonden' };
    if (!naam) return { regel, fout: 'geen naam' };
    const [a, b] = [data[0], data[1] || data[0]];
    [a, b].forEach(x => { if (x.y !== null && x.y < 100) x.y += 2000; });
    if (a.y === null) a.y = b.y !== null ? b.y - (b.m < a.m ? 1 : 0) : null;
    const iso = x => x.y + '-' + pad(x.m) + '-' + pad(x.d);
    if (a.y === null) { a.y = jaarNu; if (dagenTot(iso(a), nu) > 60) a.y++; }
    if (b.y === null) { b.y = a.y; if (iso(b) < iso(a)) b.y++; }
    for (const x of [a, b]) { const t = new Date(x.y, x.m - 1, x.d); if (!x.m || t.getMonth() !== x.m - 1 || t.getDate() !== x.d) return { regel, fout: 'datum bestaat niet' }; }
    if (iso(b) < iso(a)) return { regel, fout: 'einddatum vóór begindatum' };
    return { regel, naam, van: iso(a), tot: iso(b), soort: isZomerNaam(naam) ? 'zomer' : 'vakantie' };
  });
}

/** Avonden die je vrijhoudt (⚙︎), bijv. ['wo']. */
const vrijeAvondenLijst = () => String(I().vrijeAvonden || '').split(',').map(x => x.trim()).filter(Boolean);
const vrijeAvond = s => vrijeAvondenLijst().includes(DAGEN[dt(s).getDay()]);
/** Beoordeelt een dag voor een extra dienst. null = niet geschikt. */
function dagAdvies(s){
  if (dienstenOp(s).length) return null;
  const weg = uitjeOp(s);
  if (weg && weg.deel >= 0.999) return null;                                       // je bent de hele dag weg
  if (['12-31','01-01'].includes(s.slice(5))) return null;                         // oud & nieuw vrij
  if (D.tentamens.some(t => t.datum === s || t.datum === plus(s,1))) return null;  // tentamen of dag ervoor
  const w = lessenWeek(maandag(s));
  if (w === null) return { s, laden: true };
  const les = w && w.lessen ? w.lessen.filter(l => l.datum === s) : [];
  const onbekend = !!(w && (w.buiten || w.fout));
  const begin = les.reduce((m,l) => !m || l.begin < m ? l.begin : m, ''), eind = les.reduce((m,l) => l.eind > m ? l.eind : m, '');
  let wat, score;
  if (!les.length) { wat = 'hele dag vrij'; score = 3; }
  else if (mins(eind) <= 16*60+30) { wat = 'na je les (tot ' + eind + ')'; score = 2; }
  else if (mins(begin) >= 13*60) { wat = 'ochtend (les vanaf ' + begin + ')'; score = 1; }
  else return null;
  const op = [];
  if (onbekend) { op.push('lesrooster onbekend, check het zelf'); score -= 0.5; }
  if (vrijeAvond(s)) { op.push("avond houd je vrij"); score -= 0.5; }
  if (weg) { op.push('weg: ' + weg.lijst.map(p => p.naam).join(', ')); score -= 1; }
  const ruimte = weekPlan(maandag(s)).ruimte;                 // past je studie die week nog met een dienst van ±6 u erbij?
  if (ruimte < 6) { op.push(ruimte <= 0 ? 'studie past die week al niet' : 'studie past dan niet meer'); score -= 2; }
  const m = toetsweek(s, false, Math.min(7, Number(I().toetsweekDagen) || 7));   // jouw regel: de week ervóór geen diensten
  if (m) { op.push(m.t.vak + ' over ' + m.dagen + ' d'); score -= 2; }
  const vk = vakantieOp(s);                                   // vakantie zonder tentamen in de buurt: goede dag voor extra uren
  if (vk && !m) { op.push(vk.soort === 'zomer' ? 'zomervakantie' : 'vakantie'); score += 0.5; }
  const dl = D.deadlines.find(d => !d.klaar && (d.datum === s || d.datum === plus(s,1)));
  if (dl) { op.push('deadline ' + (dl.datum === s ? 'vandaag' : 'morgen')); score -= 1; }
  if (dienstenOp(plus(s,-1)).some(isLaat)) op.push('na late dienst: niet vroeg');
  // afspraken uit je extra agenda's (⚙︎): noemen, en bij "tellen mee" een lagere score
  const ex = extraOp(s);
  if (ex.length) { op.push(ex.map(x => x.titel + (x.heleDag ? '' : ' ' + x.begin + '–' + x.eind)).join(', ')); if (ex.some(x => extraTeltMee(x.agenda))) score -= 1; }
  return { s, wat, op, score };
}

function dienstzoeker(ym, mi){
  const nu = vandaag();
  if (ym < nu.slice(0,7)) return '';
  const doelU = mi.tot < mi.minimum ? mi.minimum : mi.doel;
  if (mi.tot >= mi.doel) return '';
  const tekort = doelU - mi.tot, diensten = Math.max(1, Math.ceil(tekort / 6));
  const dagen = []; let s = ym + '-01'; if (s <= nu) s = plus(nu, 1);
  for (; s.startsWith(ym); s = plus(s, 1)) { const a = dagAdvies(s); if (a) dagen.push(a); }
  const laden = dagen.some(a => a.laden);
  const goed = dagen.filter(a => !a.laden).sort((a,b) => b.score - a.score || a.s.localeCompare(b.s)).slice(0, 8);
  const label = sc => sc >= 2 ? ['', 'goed'] : sc >= 1 ? ['none', 'kan'] : ['warn', 'liever niet'];
  return `<h2>Dienstzoeker</h2><div class="card">
    <div class="name">Nog ${u(tekort)} u tot je ${mi.tot < mi.minimum ? 'minimum' : 'doel'} (${doelU} u) · ±${diensten} ${diensten===1?'dienst':'diensten'} van 6 u</div>
    ${mi.tot < mi.minimum && mi.doel > mi.minimum ? `<div class="sub">Tot je doel van ${mi.doel} u: nog ${u(mi.doel - mi.tot)} u</div>` : ''}
    ${laden ? '<div class="note">Lessen laden…</div>' : ''}
    ${goed.map(a => { const [c,l] = label(a.score); return `<div class="list-item" style="cursor:default"><div class="grow">
      <div class="name">${dagKort(a.s)}</div><div class="sub">${esc(a.wat)}${a.op.length ? ' · ' + esc(a.op.join(' · ')) : ''}</div></div>
      <span class="badge ${c}">${l}</span></div>`; }).join('') || (laden ? '' : '<div class="empty">Geen geschikte dagen meer deze maand.</div>')}
    <div class="note">Kijk in het rooster of de app van je werk welke diensten er op deze dagen open staan. Diensten uit je werkagenda komen vanzelf in de planner.</div></div>`;
}

// ================= MAAND =================
let ym = vandaag().slice(0,7), maandTab = 'overzicht';
/** Cijfers van een maand; de doelen zijn de optelsom van de dagdoelen (toetsweekmodus per dag meegerekend). */
function maandCijfers(ym){
  const i = I(), nu = vandaag(), perVak = {}, doelVak = {};
  let studie = 0, gamen = 0, coderen = 0, sport = 0, dagen = 0, dagenTotNu = 0, dStudie = 0, dGame = 0, dVrij = 0, er = 0, slaap = [], bed = [];
  for (let s = ym + '-01'; s.startsWith(ym); s = plus(s, 1)) {
    dagen++; if (s <= nu) dagenTotNu++;
    const r = D.dagen.find(x => x.datum === s) || {}, st = studieOp(s), dl = dagDoel(s);   // maanddoel = optelsom van de dagdoelen
    Object.keys(st).forEach(v => { perVak[v] = (perVak[v]||0) + st[v]; studie += st[v]; });
    Object.keys(dl.perVak).forEach(v => doelVak[v] = (doelVak[v]||0) + dl.perVak[v]);
    dStudie += dl.studie; er += dl.beschikbaar; if (s <= nu) dVrij += dagPlan(s).gameVrij;
    gamen += r.gamen || 0; coderen += r.coderen || 0; if (r.sport) sport++;
    if (r.slaap) slaap.push(r.slaap); if (r.bedtijd) bed.push(bedUur(r.bedtijd));

  if (dt(nu).getDay() === 0) return deze;

/** Tekst van het weekoverzicht. ma = maandag van de week, r = reflectie van die week (standaard: wat je nu ziet). */

    `${W()}: ${u(ws.werk)} u deze week · ${ymNaam(ma.slice(0,7))} totaal ${u(mi.tot)} u (doel ${mi.doel})`,

    roosterTekst(ma),

/** Rooster, takenlijsten en extra agenda's van week ma, voor het weekoverzicht (Kopieer weekoverzicht + Obsidian). */
function roosterTekst(ma){
  const zo = plus(ma, 6), inWeek = x => x >= ma && x <= zo, regels = [];
  const bl = blokken().filter(b => inWeek(b.datum));
  if (bl.length) {
    const per = {};
    bl.forEach(b => { const k = BLOK_SOORT[b.soort] || 'Blok', x = per[k] = per[k] || { n: 0, klaar: 0, u: 0, uKlaar: 0 };
      x.n++; x.u += blokUren(b); if (b.klaar) { x.klaar++; x.uKlaar += blokUren(b); } });
    regels.push('Rooster (eigen blokken): ' + Object.keys(per).map(k => `${k.toLowerCase()} ${per[k].klaar}/${per[k].n} afgevinkt (${uMin(per[k].uKlaar)} van ${uMin(per[k].u)} gepland)`).join(', '));
  }
  const tk = (D.taken || []);
  const wk = tk.filter(t => t.lijst === 'week' && !interval(t)).map(t => ({ t, st: taakStand(t, zo) })).filter(x => x.st);
  // na-vaste-tijd-taken (beide lijsten): gedaan deze week, of moet deze week
  const iv = tk.filter(t => interval(t)).map(t => { const vo = intervalVolgende(t);
    return t.klaar && inWeek(t.klaar) ? t.wat + ' ✓ ' + dagKort(t.klaar) : !vo ? t.wat + ': nog nooit afgevinkt' : vo.datum <= zo ? t.wat + ': moet ' + dagKort(vo.datum) : ''; }).filter(Boolean);
  if (iv.length) regels.push('Terugkerend (na vaste tijd): ' + iv.join(', '));
  if (wk.length) regels.push('Weektaken: ' + wk.map(x => (x.st.klaar ? '✓ ' : '✗ ') + x.t.wat).join(', '));
  const vakAf = tk.filter(t => t.lijst === 'vak' && t.klaar && inWeek(t.klaar));
  if (vakAf.length) regels.push('Studietaken afgerond: ' + vakAf.map(t => t.vak + ': ' + t.wat).join(', '));
  const vakOpen = tk.filter(t => t.lijst === 'vak' && !t.klaar);
  if (vakOpen.length) regels.push('Studietaken nog open: ' + vakOpen.length + ' (eerst: ' + (eersteStudie() && eersteStudie().taak ? eersteStudie().vak + ' · ' + eersteStudie().taak.wat : '-') + ')');
  const dagen = dagIndelingTekst(ma);
  if (dagen) regels.push(dagen);
  return regels.join('\n');
}
/**
 * Per dag wat vastligt en hoeveel tijd er over is, voor het planningsproject (Claude), zodat dat zonder screenshot
 * een schema kan maken: lessen, diensten, afspraken uit extra agenda's, reistijd, vrije tijd en het studieplan.
 */
function dagIndelingTekst(ma){
  const wp = weekPlan(ma), nu = vandaag(), regels = [];
  // tijdvakken samenvoegen die overlappen of op elkaar aansluiten: [[b, e], ...] → "10:00–10:30, 12:00–12:30"
  const vakken = lijst => { const m = lijst.slice().sort((p, q) => p.b - q.b), uit = [];
    m.forEach(x => { const l = uit[uit.length - 1]; if (l && x.b <= l.e) l.e = Math.max(l.e, x.e); else uit.push({ b: x.b, e: x.e }); });
    return uit.map(x => hhmm(x.b) + '–' + hhmm(x.e)).join(', '); };
  for (let k = 0; k < 7; k++) {
    const s = plus(ma, k), d = wp.dagen.find(x => x.s === s) || {}, delen = [];
    const lo = lessenOp(s);
    if (!lo || lo.fout || lo.buiten) delen.push('lessen onbekend');
    else if (lo.lessen.length) delen.push('lessen ' + vakken(lo.lessen.map(minuten)));
    dienstenOp(s).forEach(x => delen.push(`${W()} ${x.begin}–${x.eind}${x.waar ? ' (' + x.waar + ')' : ''}`));
    extraOp(s).forEach(x => delen.push(`${x.heleDag ? '' : x.begin + '–' + x.eind + ' '}${x.titel}${x.heleDag ? (x.tijdTekst ? ' (' + x.tijdTekst + ')' : ' (hele dag)') : ''}`
      + (extraTeltMee(x.agenda) ? '' : ' (alleen tonen)')));
    const reis = reisOp(s);
    if (reis.length) delen.push('reizen ' + vakken(reis));
    const vak = vakantieOp(s), uit = uitjeOp(s);
    if (vak) delen.push('vakantie: ' + vak.naam);
    if (uit) delen.push('weg: ' + uit.lijst.map(p => p.naam).join(', '));
    const st = studieVanDag(s);
    regels.push(`- ${dagKort(s)}: ${delen.length ? delen.join(' · ') : 'niets vast'} → vrij ${uD(d.vrij || 0)}, studieplan ${uD(st.plan)}`
      + (st.gepland ? `, studie gepland ${uMin(st.gepland)}` : '') + (s < nu && st.gedaan ? `, gedaan ${uMin(st.gedaan)}` : ''));
  }
  return 'Dagindeling (vast + reistijd; vrij = tijd voor school en werk die over is, na lessen, diensten, afspraken en reizen):\n' + regels.join('\n');
}
// ================= WEEKOVERZICHT NAAR DE SERVER =================
// Het script op de pc (weekoverzicht.py) zet deze tekst in Obsidian. Zo staan de berekeningen van de app
// (doelen, vrijgespeelde gametijd, toetsweekmodus) er ook in. Stil op de achtergrond, alleen als de tekst veranderd is.
const WO_KEY = 'planner-weekoverzicht-verstuurd';
let woTimer = null, woBezig = false;
function planWeekSync(){ clearTimeout(woTimer); woTimer = setTimeout(syncWeekoverzicht, 5000); }
async function syncWeekoverzicht(){
  // pas als de lessen binnen zijn (anders klopt het studieplan niet) en de server bewaarWeekoverzicht kent
  if (woBezig || !D || !LESSEN || LESSEN.fout || !(String(D.versie || '') >= '2026.11.24-1')) return;
  if (!IN_GOOGLE && !opslag.get(CFG_KEY)) return;
  woBezig = true;
  const verstuurd = opslag.get(WO_KEY) || {}, nu = maandag(vandaag());
  try {
    // volgende week ook, zodat je hem in het weekend kunt plannen (alleen als de lessen van die week al binnen zijn)
    const volgende = plus(nu, 7), lv = lessenWeek(volgende);
    for (const ma of [plus(nu, -7), nu].concat(lv && !lv.fout && !lv.buiten ? [volgende] : [])) {
      const tekst = weekTekst(weekStats(ma), ma, D.reflecties.find(x => x.week === ma));
      if (verstuurd[ma] === tekst) continue;
      await roep('bewaarWeekoverzicht', [{ week: ma, tekst }]);
      verstuurd[ma] = tekst;
    }
  } catch (e) { /* offline of fout: bij de volgende wijziging opnieuw, zonder melding */ }
  finally {
    Object.keys(verstuurd).forEach(w => { if (w < plus(nu, -14)) delete verstuurd[w]; });
    opslag.set(WO_KEY, verstuurd);
    woBezig = false;
  }
}
/**
 * Hoeveel weken op rij (terug vanaf week ma) haalde je een doel? gehaald(w) geeft true, false of null.
 * null = die week had geen doel (bijv. zomervakantie): telt niet mee en breekt de reeks ook niet.
 */
function reeks(ma, gehaald){
  let n = 0;
  for (let k = 0; k < 52; k++) {
    const r = gehaald(weekCijfers(plus(ma, -7 * k)));
    if (r === null) continue;
    if (!r) break;
    n++;
  }
  return n;
}
/** Vergelijking met vorige week over evenveel dagen (lopende week: t/m dezelfde weekdag). */
function vergelijkVorige(ma, dagen){
  const som = (start, wat) => { let t = 0; for (let k = 0; k < dagen; k++) t += wat(plus(start, k)); return t; };
  const studie = s => Object.values(studieOp(s)).reduce((a, b) => a + b, 0);
  const sport = s => (D.dagen.find(x => x.datum === s) || {}).sport ? 1 : 0;
  const vorige = plus(ma, -7);
  const dS = som(ma, studie) - som(vorige, studie), dP = som(ma, sport) - som(vorige, sport);
  const teken = (x, f) => (x > 0.001 ? '+' : x < -0.001 ? '−' : '±') + f(Math.abs(x));
  return `<div class="note">Vergeleken met vorige week${dagen < 7 ? ' (zelfde aantal dagen)' : ''}: studie ${teken(dS, uMin)}, sport ${teken(dP, x => x + '×')}</div>`;
}
